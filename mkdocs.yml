# MkDocs + Material configuration for the YazSes documentation site.
# Build:  uv run --group docs mkdocs build --strict
# Serve:  uv run --group docs mkdocs serve
# Deploy: handled by .github/workflows/docs.yml (GitHub Pages).

site_name: YazSes
site_url: https://mskazemi.com/yazses/
site_author: Mohsen Seyedkazemi Ardebili
site_description: >-
  Offline, on-device hold-to-talk voice dictation for Linux, macOS & Windows.
  Hold a key, speak, release — your words are transcribed locally with
  faster-whisper and typed into any focused app. No cloud, no API key, no subscription.

repo_name: MSKazemi/yazses
repo_url: https://github.com/MSKazemi/yazses
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; Mohsen Seyedkazemi Ardebili — Apache-2.0 licensed.

docs_dir: docs

# Keep page URLs identical to the previous Jekyll site (foo.html, not foo/),
# so every already-indexed link survives the cutover with no redirects needed.
use_directory_urls: false

# Keep Jekyll leftovers and heavy binaries out of the built site.
exclude_docs: |
  _config.yml
  yazses-complete-reference.pdf

# Individual release notes are built and linkable but kept out of the sidebar
# (46 files would swamp it); the Releases index links the notable ones.
not_in_nav: |
  /releases/v*.md
  /design/adr/*.md
  /design/specs/*.md
  /design/research/**/*.md
  /mobile/adr/adr-mob-*.md

# A link to a heading that does not exist was only `info` by default, so it never
# failed anything, not even under `--strict`. That is how every Devanagari heading
# anchor stayed broken and unnoticed until a cross-link happened to spell one
# correctly (see hooks/indic_slugify.py). At `warn` it becomes fatal under
# `--strict`, which is the point.
#
# mkdocs only accepts warn/info/ignore here — `error` is rejected at config load —
# so `--strict` is what supplies the teeth. Everything else is left at its default
# deliberately: widening this to `unrecognized_links` should be a separate,
# measured change, not a side effect of fixing anchors.
validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  # Local template overrides (overrides/main.html injects search-console
  # verification tags from the extra.* fields below).
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Palette toggle — light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle — dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss

extra:
  homepage: https://mskazemi.com/yazses/
  # Search-engine ownership verification — paste the token from the provider's
  # "HTML tag" method here, then push (see overrides/main.html for the flow).
  # Empty = no tag emitted (build-safe).
  google_site_verification: ""
  bing_site_verification: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MSKazemi/yazses
      name: YazSes on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/yazses/
      name: YazSes on PyPI
  generator: false

extra_css:
  - assets/extra.css

# Build-time hooks. `faq_schema` derives schema.org FAQPage JSON-LD from the
# FAQ page's own markdown, so the structured data cannot drift out of sync with
# what a reader actually sees (which Google requires, and which a hand-written
# duplicate block would eventually violate).
hooks:
  - hooks/faq_schema.py
  # `research_schema` does the same for the research section: it derives
  # ScholarlyArticle JSON-LD (including the `citation` list) from each page's own
  # "## References" section, so the structured data and the visible bibliography
  # cannot disagree.
  - hooks/research_schema.py
  # Publishes the  tier (decision records, specifications, research notes)
  # into the built site without copying it into . See the hook for why it is
  # not in the nav: 155 ADRs would bury the user documentation.
  - hooks/design_tier.py
  # Emits a `.md` twin of every page plus a <link rel="alternate"> pointing at
  # it. AI crawlers and coding agents ingest dedicated Markdown URLs (and prefer
  # them — ~80% fewer tokens, no chrome) while largely ignoring llms.txt, so
  # this is the delivery mechanism that actually reaches the machine audience.
  - hooks/markdown_mirrors.py
  # Declares reciprocal <link rel="alternate" hreflang> between a page and its
  # translations, derived from one `alternates:` entry so the two directions
  # cannot drift apart (a one-sided declaration is ignored by search engines).
  - hooks/hreflang.py
  # Replaces the `toc:` slugifier below with one that keeps Unicode combining
  # marks. The stock one deletes them, which erases every vowel sign in
  # Devanagari/Tamil/Bengali/Telugu headings; see the module docstring. Applied
  # from a hook because `!!python/name:` cannot reach the repo root at the point
  # mkdocs.yml is parsed.
  - hooks/indic_slugify.py

plugins:
  - search
  # Self-hosts every external asset at build time. Without it, Material links the
  # webfonts from fonts.googleapis.com with a preconnect to fonts.gstatic.com, so
  # every visitor's IP reached Google before the page rendered — on all 22 pages of
  # a site whose first line is that your voice never leaves your machine, and which
  # ships a privacy statement. The demo video is deliberately *linked* rather than
  # embedded for the same reason; this closes the hole that was left.
  # Needs network at build time (CI has it); it downloads the fonts into the site.
  - material/privacy
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      type: timeago
      fallback_to_build_date: true
      # Don't let git-history quirks (file renames, shallow CI clones) fail the
      # strict build; timestamps are informational, not correctness-critical.
      strict: false
  # Social preview cards (Open Graph / Twitter). Needs libcairo at build time;
  # disable by exporting MKDOCS_SOCIAL=false if that toolchain is unavailable.
  - social:
      enabled: !ENV [MKDOCS_SOCIAL, true]
      cards_layout_options:
        background_color: "#4527a0"
        color: "#ffffff"
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true
  # Release notes as a subscribable feed. YazSes ships roughly weekly and writes a
  # real page for every version, but until now that stream was only readable by
  # someone who thought to revisit /releases/ — invisible to feed readers,
  # aggregators, and the crawlers that ingest feeds. `match_path` scopes it to the
  # 51 version pages so the feed is releases-only, not "every doc edit".
  # Dates come from git (`use_git`), which works here because the pages carry no
  # date front-matter and git-revision-date-localized already proves the history
  # is available at build time. Shallow CI clones would break that — docs.yml must
  # keep fetch-depth: 0.
  - rss:
      match_path: "releases/v.*"
      abstract_chars_count: 500
      length: 30
      use_git: true
      feed_ttl: 1440
      pretty_print: false

markdown_extensions:
  # Python-Markdown core
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      title: On this page
      # Use GitHub's slug algorithm, not Python-Markdown's. `docs/features.md` is
      # generated by scripts/gen-docs.py with GitHub-style anchors (`Accuracy &
      # correction` -> `accuracy--correction`), and it is read both here and on
      # GitHub. With the default slugify the site produced `accuracy-correction`
      # instead, so all nine "Contents" links on the largest page in the docs
      # were dead. This makes both renderings agree.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # PyMdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true

# Eight top-level tabs, deliberately. `navigation.tabs` renders the top level as
# one horizontal bar that does **not** scroll for the reader — Material only
# scrolls it programmatically, to the active tab. At fifteen tabs the list
# overflowed its container, so the entries at the right-hand end were clipped off
# and unreachable from the top nav on an ordinary laptop screen.
#
# Eight fits with room to spare. Before adding a ninth top-level entry, measure the
# rendered width (`nav.scrollWidth - nav.getBoundingClientRect().width` on
# `.md-tabs__list`); prefer nesting under an existing tab.
# Guarded by tests/test_docs_nav_fits.py.
