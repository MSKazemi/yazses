# ALSA configuration for the strictly-confined YazSes snap.
#
# A strict snap does not see the host's /usr/share/alsa config tree, so libasound
# has no configuration at all. When PortAudio (via sounddevice) calls
# Pa_Initialize() it then aborts:
#
#   ALSA lib conf.c: Cannot access file /usr/share/alsa/alsa.conf
#   BuildDeviceList: Assertion `devIdx < numDeviceNames' failed  ->  abort()
#
# This file is pointed at by ALSA_CONFIG_PATH (see snapcraft.yaml) and routes the
# default PCM/CTL through the PulseAudio plugin. The snap reaches the sound server
# (PulseAudio / PipeWire-pulse) through the audio-playback and audio-record
# interfaces; the pulse plugin itself is staged from libasound2-plugins. This is
# self-contained: `type pulse` is resolved directly to libasound_module_pcm_pulse.so
# via ALSA_PLUGIN_DIR, so no host config tree is required.

pcm.!default {
    type pulse
    hint.description "Default (PulseAudio via snap audio interface)"
}
ctl.!default {
    type pulse
}

pcm.pulse {
    type pulse
}
ctl.pulse {
    type pulse
}
