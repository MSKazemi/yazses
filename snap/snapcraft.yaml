name: yazses
base: core24
# Kept equal to `pyproject.toml`'s `[project] version` by
# `tests/test_snap_version_matches_the_project.py`. The tag workflow rewrites
# this line before building, so on a tagged release it is overwritten anyway --
# but the snapcraft.io **build service** builds the repository exactly as
# committed, and nothing rewrites anything for it. This line sat at 2.17.0 while
# the project shipped 2.29.0, so all 188 of its builds were stamped with a
# version twelve releases old and *lower* than what `latest/stable` served.
version: "2.31.0"
summary: Local, offline-by-default voice dictation for Linux
description: |
  YazSes is offline-by-default, on-device voice dictation. Hold a key (Space by
  default), speak, release — your words are transcribed locally and typed into
  whatever app has focus. No cloud, no API key, no subscription; no audio and no
  text leave your machine by default.

  - Offline speech-to-text with faster-whisper (CPU, int8) — no GPU needed
  - Voice commands for editors and terminals: "undo that", "save file",
    "go to line 42", "run the tests", "rename this to user_id"
  - Personal vocabulary and multi-step macros
  - Works in any focused text field — editors, browsers, terminals, chat

  Important: this strictly-confined snap supports hold-to-talk dictation on X11
  only. Wayland keystroke injection is unavailable. On Wayland, use the Linux
  installer instead:
  https://mskazemi.com/yazses/install-linux.html

  Install on X11 — all three commands are required. A snap cannot connect its own
  interfaces, and the daemon starts and looks healthy without them; it simply
  never hears you, or never sees the key:

    sudo snap install yazses
    sudo snap connect yazses:audio-record   # microphone; without it, no audio
    sudo snap connect yazses:raw-input      # hold-to-talk key; without it, nothing fires

  `yazses setup` is not an installation step for the snap: strict confinement
  prevents host package, group, or service changes, so it can only print the
  manual permission checklist. The snap already bundles its X11 dependencies.
  Run `yazses doctor` as your normal desktop user after connecting the interfaces.
  Never run YazSes itself with sudo; doing so loses the desktop session environment.

title: YazSes
icon: snap/gui/yazses.png
contact: mohsen.seyedkazemi@gmail.com
license: Apache-2.0
website: https://mskazemi.com/yazses/
source-code: https://github.com/MSKazemi/yazses
issues: https://github.com/MSKazemi/yazses/issues

grade: stable
confinement: strict

# Declared explicitly, because "unset" does not mean "amd64" to the build
# service -- it means EVERY architecture Launchpad supports, and five of those
# can never succeed. The runtime stack is wheel-only: ctranslate2 (via
# faster-whisper), onnxruntime (via onnx-asr) and PySide6 publish manylinux
# wheels for x86_64 and aarch64 and nothing else, so armhf / i386 / ppc64el /
# s390x / riscv64 builds fail at pip-install every single time. Requesting them
# just fills the build history with red that nobody can act on.
platforms:
  amd64:
  arm64:

apps:
  yazses:
    command: bin/yazses-wrapper
    # ALSA/PulseAudio paths are arch-dependent and this block cannot expand the
    # multiarch triplet, so the wrapper sets them -- see snap/local/snap-env.sh.
    plugs:
      - audio-record
      - audio-playback
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - home
      - network
      - opengl
      # Hold-to-talk reads /dev/input/event* via evdev, which strict confinement
      # blocks outright — the `input` group cannot grant it (issue #44). Not
      # auto-connected: users run `sudo snap connect yazses:raw-input`, and
      # `yazses doctor` says so when capture is denied inside a snap.
      - raw-input
  # Audio (2026-07-08): the ALSA env set by yazses_audio_env stops PortAudio
  # aborting; mic *capture* additionally needs libpulse0 staged (see parts) and
  # PULSE_SERVER pointed at the host pulse socket (the snap's private
  # XDG_RUNTIME_DIR has no socket). All of it lives in snap/local/snap-env.sh.
  # If a real snapcraft build still can't capture on PipeWire, adopt
  # `extensions: [gnome]` for the full desktop/pulse session env.
  yazses-daemon:
    command: bin/yazses-daemon-wrapper
    plugs:
      - audio-record
      - audio-playback
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - home
      - network
      - opengl
      # The daemon is the process that actually holds the evdev device.
      - raw-input
  yazses-overlay:
    command: bin/yazses-overlay-wrapper
    plugs:
      - desktop
      - x11
      - wayland
      - opengl
  yazses-tray:
    command: bin/yazses-tray-wrapper
    plugs:
      - desktop
      - x11
      - wayland
      - home

parts:
  yazses:
    plugin: python
    source: .
    build-packages:
      - python3-dev
    stage-packages:
      - libportaudio2
      # ALSA runtime config + plugins. libportaudio2 pulls in libasound2 (the
      # library) but NOT its config data or plugins; without these PortAudio
      # aborts on Pa_Initialize inside strict confinement. libasound2-data ships
      # /usr/share/alsa/*; libasound2-plugins ships the pulse bridge that
      # snap/local/asound.conf routes the default device through.
      - libasound2-data
      - libasound2-plugins
      # libpulse (+ libpulsecommon) is what libasound2-plugins' pulse bridge links
      # against; a real snapcraft build pulls it as a dependency, but stage it
      # explicitly so mic capture works. The wrappers set PULSE_SERVER to the real
      # /run/user/<uid>/pulse/native socket (the snap's private XDG_RUNTIME_DIR has
      # none), which is reachable under the audio-record interface.
      - libpulse0
      # X11 keystroke injection. Without a bundled injector the confined snap has
      # no way to type on X11 sessions (`yazses doctor` -> "no X11 injector").
      # xdotool needs its own library libxdo3 (libxdo.so.3) — a real snapcraft
      # build pulls it as a dependency, but list it explicitly so a hand/partial
      # build can't ship the xdotool binary without the .so it loads (which makes
      # every type() exit 127 and injection silently fail).
      - xdotool
      - libxdo3
      # Clipboard tools: the ClipboardInjector fallback + the context readers shell
      # out to xclip (X11) / wl-copy (Wayland). Bundle both so a missing tool never
      # aborts an injection.
      - xclip
      - wl-clipboard
      - python3.12
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-pip-whl
      - python3-xlib
      # Qt runtime libs for the bundled PySide6 overlay (yazses-overlay). The
      # PySide6 wheel ships Qt itself but relies on these system libs to load
      # the xcb/wayland platform plugins under strict confinement.
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxcb-cursor0
      - libxcb-xinerama0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      # The Qt xcb platform plugin (libqxcb.so) also links libxcb-xkb + the X11
      # variant of libxkbcommon; without them the overlay dies with "Could not
      # load the Qt platform plugin xcb" and no sonar window appears.
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libfontconfig1
      - libdbus-1-3
    python-packages:
      - pip
      # PySide6: the tray icon and the voice-activity overlay. It used to arrive
      # as a base dependency; it is now the `desktop` extra, so it MUST be listed
      # here explicitly. A snap cannot pip-install at runtime (read-only squashfs
      # + PEP 668), so leaving it out would silently remove both features for the
      # life of the revision. Publishes manylinux wheels for x86_64 and aarch64.
      - PySide6>=6.11.1
      # Optional-feature libraries, bundled because a snap can NEVER install
      # them later: the payload is a read-only squashfs and the staged Debian
      # python ships a PEP 668 EXTERNALLY-MANAGED marker, so `yazses features
      # enable <name>` cannot pip-install anything at runtime. Whatever is not
      # here is unreachable for a snap user for the life of the revision.
      #
      # Every entry must publish manylinux wheels for BOTH x86_64 and aarch64 —
      # `platforms:` above builds both, and a dep with no wheel for one of them
      # fails that build outright (same trap that killed the other five arches).
      #
      # sherpa-onnx: speaker diarization — unlocks `meeting`, `recimport` and
      # `diarize`, i.e. Meeting Mode, the headline capability. ~40 MB.
      - sherpa-onnx>=1.13.4
      # kokoro-onnx + soundfile: the Read-Back voice (`read-back`). onnxruntime
      # is already staged for onnx-asr, so this only adds the TTS front end.
      - kokoro-onnx>=0.5.0
      - soundfile>=0.14.0
      #
      # Deliberately NOT bundled — each is refused honestly at runtime by
      # yazses.system.snap.dependency_install_advice rather than silently
      # failing:
      #   speechbrain  (`cocktail`)     pulls torch, ~1 GB — dwarfs the snap
      #   llama-cpp-python (`llm-cleanup`) ships no PyPI wheels, needs a compiler
      #   mediapipe + opencv (`gaze`)   ~110 MB for an experimental X11/webcam feature
      #   praat-parselmouth (`prosody`) has no aarch64 wheel — would break arm64
    # snapcraft's python plugin runs a fix-python-shebang helper that searches
    # for /usr/bin/python3.12 in the staged payload. Stage-packages installs
    # python3.12 to /usr/bin, but on some core24 versions the binary lands in
    # an unexpected location; the symlink below is a defensive belt-and-braces
    # so the helper finds it.
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      if [ ! -e "$CRAFT_PART_INSTALL/usr/bin/python3.12" ]; then
        ln -sf /usr/bin/python3.12 "$CRAFT_PART_INSTALL/usr/bin/python3.12"
      fi
      install -Dm644 snap/local/snap-env.sh "$CRAFT_PART_INSTALL/bin/snap-env.sh"
      install -Dm755 snap/local/yazses-wrapper "$CRAFT_PART_INSTALL/bin/yazses-wrapper"
      install -Dm755 snap/local/yazses-daemon-wrapper "$CRAFT_PART_INSTALL/bin/yazses-daemon-wrapper"
      install -Dm755 snap/local/yazses-overlay-wrapper "$CRAFT_PART_INSTALL/bin/yazses-overlay-wrapper"
      install -Dm755 snap/local/yazses-tray-wrapper "$CRAFT_PART_INSTALL/bin/yazses-tray-wrapper"
      # ALSA config so PortAudio can initialise under strict confinement (routes
      # the default device through PulseAudio). Referenced by ALSA_CONFIG_PATH.
      install -Dm644 snap/local/asound.conf "$CRAFT_PART_INSTALL/etc/asound.conf"
      # XDG autostart so the daemon's DISPLAY is populated on every graphical login
      install -Dm644 contrib/yazses-session.desktop \
        "$CRAFT_PART_INSTALL/etc/xdg/autostart/yazses-session.desktop"
