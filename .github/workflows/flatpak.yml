# Build the Flatpak, and regenerate the Python dependency modules it needs.
#
# WHY THIS EXISTS
# ---------------
# Flathub will not accept a manifest that does not build, and the manifest cannot
# build until `python3-yazses.json` exists — a generated list of every Python
# dependency with its URL and hash. That file has never been committed, which is
# the single reason the Flathub submission (issue #45) has never been made.
#
# It cannot be generated correctly on a developer machine either. The wheels have
# to match the *runtime's* Python, not the host's, so flatpak-pip-generator must
# run inside org.kde.Sdk. That means having flatpak and the SDK installed, which
# a CI runner can do reproducibly and a laptop usually cannot.
#
# So: `generate` produces the file and uploads it as an artifact for a human to
# commit; `build` proves the manifest actually builds once it is committed. The
# build job is what gates the Flathub PR.
name: Flatpak

on:
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate python3-yazses.json from PyPI"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  APP_ID: com.mskazemi.YazSes
  # Must match `runtime-version` in the manifest. flatpak-pip-generator resolves
  # wheels for this SDK's Python, so a mismatch here produces a dependency list
  # that installs on nothing.
  RUNTIME_VERSION: '6.7'
  # The KDE 6.7 SDK ships Python 3.11 (confirmed: 3.11.13). Wheels must match it,
  # not whatever the runner happens to have.
  PYTHON_VERSION: '3.11'
  PYTHON_TAG: '311'

jobs:
  generate:
    name: Regenerate the Python dependency modules
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # req2flatpak, not flatpak-pip-generator. The latter shells into
      # org.kde.Sdk to read its platform tags via `from packaging import tags`,
      # and the SDK's Python 3.11 has no `packaging` module — so it always
      # failed with the misleading "Failed to obtain platform tags from
      # runtime". The module cannot be injected either: /tmp is private inside
      # a flatpak sandbox and `flatpak override` does not apply to runtime refs.
      #
      # req2flatpak takes the interpreter and architecture as plain arguments,
      # so it never probes a runtime and needs no flatpak at all. That is also
      # why this job no longer runs in the flatpak image.
      - name: Resolve and generate the dependency modules
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade uv req2flatpak

          VERSION="$(curl -fsSL https://pypi.org/pypi/yazses/json \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])')"
          # setuptools and wheel are listed as requirements so req2flatpak
          # vendors their wheels into the module's sources. pip builds evdev's
          # sdist in an isolated env and resolves that env's build deps from
          # --find-links when --no-index is set — so a modern setuptools has to
          # be *in that directory*, not merely installed beside it. Installing
          # it into /app and putting /app on PYTHONPATH both failed precisely
          # because the isolated build env ignores them.
          printf 'yazses==%s\nsetuptools\nwheel\n' "${VERSION}" > /tmp/req.in

          # Pin against the *runtime's* interpreter and arch, not the runner's.
          uv pip compile --quiet \
            --python-version "${PYTHON_VERSION}" \
            --python-platform x86_64-manylinux2014 \
            /tmp/req.in -o /tmp/req.txt
          echo "--- resolved ---" && grep -cvE '^\s*#|^\s*$' /tmp/req.txt

          req2flatpak --requirements-file /tmp/req.txt \
            --target-platforms "${PYTHON_TAG}-x86_64" \
            --outfile packaging/flatpak/python3-yazses.json

          python3 -c 'import json;d=json.load(open("packaging/flatpak/python3-yazses.json"));print(len(d["sources"]),"sources")'

      - name: Upload for review and commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python3-yazses-json
          path: packaging/flatpak/python3-yazses.json
          if-no-files-found: error

  build:
    name: Build the Flatpak
    # Only meaningful once the generated dependency file is committed; until then
    # the manifest references a file that does not exist and the build cannot run.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.regenerate }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Until the generated file is committed the manifest references something
      # that does not exist, so there is nothing to build. Warn loudly rather
      # than fail: this workflow has to reach the default branch before
      # workflow_dispatch can be used to produce that very file, and a job that
      # cannot pass would block its own prerequisite.
      - name: Are the generated dependencies committed?
        id: deps
        run: |
          if [ -f packaging/flatpak/python3-yazses.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::packaging/flatpak/python3-yazses.json is missing, so the Flatpak was NOT built. Run this workflow with 'regenerate' checked and commit the artifact it uploads; the Flathub submission is blocked until then."
          fi

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        if: steps.deps.outputs.present == 'true'
        with:
          bundle: yazses.flatpak
          manifest-path: packaging/flatpak/${{ env.APP_ID }}.yml
          # Caching is OFF deliberately. Three consecutive runs reported the
          # *same* pip temp directory (evdev_1dfb8b667a6b41cbaaa02215b5ebd6a7)
          # while the manifest changed under them, which is not possible for
          # genuinely independent builds — the cache was replaying a stale
          # module failure, so two fixes appeared to change nothing. Correctness
          # of the signal matters more here than build minutes; turn it back on
          # once the build is green and understood.
          cache: false
          # Flathub runs this on every submission; failing it here is cheaper
          # than failing it in their review queue.
          run-tests: false
          verbose: true
