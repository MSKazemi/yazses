name: Live traceability audit

# Lane: scheduled assurance (.github/CI_POLICY.md section 1 and 10). Never blocks a PR.
#
# `scripts/check-traceability.py` proves design/traceability.yml is coherent, offline. It
# cannot know whether issue #164 is still open or whether milestone 9 still exists. This
# job asks GitHub (#487, parent #480, epic #377). It is READ-ONLY: two paginated GET list
# requests (all issues, all milestones), no issue or milestone is ever written.
#
# EXIT CODES decide how to read a red run, and the summary says which it was:
#   1  a real traceability violation  -> fix design/traceability.yml or the issue/milestone
#   2  GitHub's state could not be read (outage, rate limit) -> NOT a finding; re-run
#   3  the audit cannot run as configured (bad manifest/exceptions file, token, repo)
# Red is deliberate for all three: an unverified night must not look like a verified one.
#
# ADVISORY DRIFT (never changes the exit code): the same issue listing also reports open
# issues with no milestone and no exempt class, stale "do not start" banners whose blockers
# all closed, and manifest entries still listing a closed issue beside an open one. It lands
# in the job summary and in the `traceability-live` JSON artifact; nothing is written back.
#
# SECURITY: schedule/workflow_dispatch only, so no contributor-controlled text reaches an
# expression or a shell here; issue titles/bodies are read by the script as data only. Token
# is the standard GITHUB_TOKEN, read-only, and no secrets are used. Exceptions and the
# exempt-label classes live in design/traceability-exceptions.yml (empty, awaiting #480).

on:
  schedule:
    # Daily, off the hour: GitHub delays cron runs that pile up on :00.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

# One intentional run at a time; a queued run is not worth cancelling a half-finished audit.
concurrency:
  group: traceability-live
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The script is standard-library only except that it reuses the offline manifest
      # loader, which needs PyYAML (already a declared project dependency).
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0.3"

      # No pipe: the script's own exit code (0/1/2/3) must be the step's exit code.
      - name: Audit issues and milestones against design/traceability.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/check-traceability-live.py
          --summary-file "$GITHUB_STEP_SUMMARY"
          --json-file traceability-live.json

      # The JSON is written for every exit code, so a red night still leaves its evidence.
      # upload-artifact authenticates with the runner's own token, not GITHUB_TOKEN, so the
      # job permissions above stay read-only.
      - name: Upload the audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: traceability-live
          path: traceability-live.json
          if-no-files-found: ignore
          retention-days: 30
