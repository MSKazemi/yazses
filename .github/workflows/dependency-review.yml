name: Dependency review

# Blocks a PR that would introduce a dependency with a known vulnerability, or a
# licence incompatible with Apache-2.0. Dependabot tells you about problems you
# already shipped; this catches them before they land.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail on high and above; moderate findings are surfaced in the summary
          # but do not block a contributor's first PR on a transitive advisory
          # they did not introduce and cannot fix.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with this project's Apache-2.0
          # distribution (and with the PyPI/Snap/APT artifacts built from it).
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
