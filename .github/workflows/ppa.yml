name: Launchpad PPA

on:
  push:
    tags:
      # RELEASE-TRIGGER-DISABLED: dead since v1.0.0 and never once run; needs a
      # decision before it can publish. The comment below named rust-release.yml as
      # the successor for v1.x, and that workflow was deleted in 61025cc when the
      # Rust line was archived -- so no tag has matched this pattern since, and the
      # Launchpad PPA has had no publisher at all. Credentials were never set up
      # either (see design/packaging/ppa-setup.md), so widening the glob would only
      # convert silence into a failing job.
      #
      # ⚠ CORRECTION (2026-08-30): the line that used to end this note --
      # "Nothing advertises a PPA to users" -- was wrong, and it was the half that
      # mattered. `release.yml`'s notes template carried a **Launchpad PPA
      # (Ubuntu)** section telling every reader to run
      # `sudo add-apt-repository ppa:mskazemi/yazses`, and it had done so in the
      # notes of every release since v1.0.0. There is no such PPA: Launchpad
      # answers 404 for `~mskazemi/+archive/ubuntu/yazses`, and 404 for the person
      # `~mskazemi` as well, so the account the archive would belong to does not
      # exist either. The instruction could never have worked for anybody.
      #
      # The dead trigger and the advertisement were two halves of one fault and
      # only the half visible from this file had been found. The section is gone
      # from the template, and `tests/test_release_notes_channels_are_real.py`
      # now fails the build if the notes advertise an install channel that no
      # workflow in this repository publishes -- which is the check that would
      # have caught it, and the reason it went unnoticed for two years of tags is
      # that nothing compared the two documents.
      - "v0.*"  # Python v0.x only — v1.x was to be handled by rust-release.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: this workflow publishes to an external store, not to GitHub.
permissions:
  contents: read

jobs:
  upload-ppa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Debian packaging tools
        run: |
          sudo apt-get install -y -q devscripts debhelper dput gpg

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          passphrase: ""
          git_user_signingkey: true

      - name: Configure dput
        run: |
          cat > ~/.dput.cf <<'EOF'
          [yazses-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~mskazemi/ubuntu/yazses/
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

      - name: Upload to PPA
        env:
          DEBEMAIL: mohsen.seyedkazemi@gmail.com
          DEBFULLNAME: Mohsen Seyedkazemi Ardebili
          GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x scripts/upload-ppa.sh
          bash scripts/upload-ppa.sh \
            "$VERSION" \
            "$GPG_KEY_ID" \
            "yazses-ppa"
