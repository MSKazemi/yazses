name: Launchpad PPA

on:
  push:
    tags:
      - "v0.*"  # Python v0.x only — v1.x handled by rust-release.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: this workflow publishes to an external store, not to GitHub.
permissions:
  contents: read

jobs:
  upload-ppa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Debian packaging tools
        run: |
          sudo apt-get install -y -q devscripts debhelper dput gpg

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          passphrase: ""
          git_user_signingkey: true

      - name: Configure dput
        run: |
          cat > ~/.dput.cf <<'EOF'
          [yazses-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~mskazemi/ubuntu/yazses/
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

      - name: Upload to PPA
        env:
          DEBEMAIL: mohsen.seyedkazemi@gmail.com
          DEBFULLNAME: Mohsen Seyedkazemi Ardebili
          GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x scripts/upload-ppa.sh
          bash scripts/upload-ppa.sh \
            "$VERSION" \
            "$GPG_KEY_ID" \
            "yazses-ppa"
