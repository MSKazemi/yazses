name: Publish release checksums

# Why this exists
# ---------------
# Until 2026-08-13 a release shipped a .deb, a .dmg and an unsigned .exe and
# published *no* checksums anywhere. A user who downloaded the Windows installer
# had no way at all to tell whether the file was the one the project built --
# the binary is unsigned, so there was neither a signature nor a hash to check.
#
# The three artifacts are uploaded by three different workflows (release.yml,
# build-macos.yml, build-windows.yml) which finish at different times, so the
# checksum file cannot simply be produced by any one of them. This workflow waits
# for the expected assets to appear and derives SHA256SUMS.txt from the assets
# that are actually attached -- never from a value copied by hand.
#
# Trigger: the TAG PUSH, not `release: published`.
# ------------------------------------------------
# The obvious trigger is `release: published`, and it silently never fires.
# release.yml creates the Release with softprops/action-gh-release using the
# repository's GITHUB_TOKEN, and GitHub does not start new workflow runs from
# events raised by GITHUB_TOKEN (workflow_dispatch and repository_dispatch are
# the only exceptions). v2.18.2 proved it: published at 16:49 with the workflow
# already on main, and no run was ever queued.
#
# Keying off the tag push instead -- the same trigger release.yml itself uses --
# is a real user-initiated event, so it always fires. The consequence is that
# this starts BEFORE the Release exists, which is why the wait step below
# tolerates "release not found" instead of treating it as an error.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to checksum (e.g. v2.19.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads SHA256SUMS.txt onto the existing Release
    env:
      GH_TOKEN: ${{ github.token }}
      # This job deliberately does not check out the repository -- it only needs
      # the release assets. But without a checkout `gh` has no git remote to infer
      # the repo from, so every `gh release` call fails. GH_REPO supplies it
      # explicitly. Omitting it once cost a 40-minute run that polled an asset
      # list it could never read; the preflight step now catches that in seconds.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check gh can reach the repository
        # Proves the token and GH_REPO are usable BEFORE the wait loop starts.
        # Without this the loop cannot tell "the environment is broken" from
        # "the release does not exist yet" -- and it must tolerate the latter,
        # because the tag push fires this before release.yml has created it.
        run: |
          set -euo pipefail
          # The repo is passed POSITIONALLY, not via GH_REPO. That variable only
          # overrides commands which accept `--repo`, and `gh repo view` takes a
          # positional `[<repository>]` instead -- so it ignored GH_REPO, fell back
          # to reading a git remote, and died with "not a git repository" in a job
          # that deliberately does not check out. The step added to prove the
          # environment works was the only call in this file that could not work:
          # every `gh release` call below does accept `--repo` and was always fine.
          # v2.19.0 was the first tag push to reach it; the earlier green runs were
          # all workflow_dispatch from before this step existed.
          #
          # It is `gh api` and not `gh repo view` for the same reason, one layer
          # down: `--json` makes `gh repo view` a **GraphQL** call, while every
          # `gh release` call below is REST. A GraphQL outage therefore failed the
          # release while the API it actually depends on was healthy -- which is
          # exactly what happened on the v2.27.0 tag, HTTP 503 from the GraphQL
          # endpoint alone. A preflight must exercise the same transport as the
          # work it clears, or it reports on something else.
          gh api "repos/$GH_REPO" --jq .name

      - name: Wait for the builds that produce the assets to finish
        # The step below waits for asset *names*, and a name is not a file.
        #
        # v2.32.0: the release was run twice for the same tag. On the second run
        # every asset already existed from the first, so the name count was
        # satisfied on the very first poll -- this job hashed the previous run's
        # binaries and the still-running Windows build overwrote both .exe two to
        # three minutes later. The published SHA256SUMS.txt matched NEITHER Windows
        # installer, and Windows builds are unsigned, so that hash is the only
        # integrity signal a Windows user has. `docs/code-signing.md` tells them to
        # check it; a wrong value there reads as "your download was tampered with",
        # and Chocolatey/Scoop, whose manifests are derived from this file, simply
        # refuse to install. The .deb and .dmg matched by luck -- their builds
        # happened to finish ten seconds before the hashing step.
        #
        # Presence cannot express freshness, so ask the only thing that can: are the
        # workflows that write those assets still running? A leg with no run for this
        # tag returns an empty list, which is the right answer for one that was never
        # triggered, and a failed leg is `completed` -- so neither can hang this job.
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 2700 ))   # 45 minutes
          # These are the workflows that attach a .deb/.dmg/.exe to the release.
          # `tests/test_checksums_workflow_waits_for_builds.py` derives that set from
          # the workflow files themselves and fails if a fourth producer appears
          # without being listed here -- a hand-written set is only safe while
          # something else is checking it.
          producers="release.yml build-macos.yml build-windows.yml"
          while (( SECONDS < deadline )); do
            busy=""
            for wf in $producers; do
              # `branch` filters on head_branch, which for a tag push is the tag name.
              states=$(gh api \
                "repos/$GH_REPO/actions/workflows/$wf/runs?branch=$TAG&per_page=30" \
                --jq '.workflow_runs[].status' 2>/dev/null || true)
              if grep -qE '^(queued|in_progress|requested|waiting|pending)$' <<<"$states"; then
                busy="$busy $wf"
              fi
            done
            if [ -z "$busy" ]; then
              echo "No producer build is still running for $TAG."
              break
            fi
            echo "still building:$busy (${SECONDS}s elapsed)"
            sleep 60
          done

      - name: Wait for platform builds to attach their assets
        # release.yml creates the Release as soon as the .deb is built, but the
        # macOS and Windows builds are still running at that point. Poll rather
        # than sleep a fixed amount: the .exe build is the long pole and its
        # duration varies. Missing assets are not fatal -- a platform build may
        # legitimately have failed, and a partial SHA256SUMS.txt is still far
        # better than none. Re-run via workflow_dispatch to regenerate.
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 2400 ))   # 40 minutes
          while (( SECONDS < deadline )); do
            # The release legitimately may not exist yet: this is triggered by the
            # tag push, and release.yml only creates the Release once its test job
            # has passed. So "not found" is a normal early state, not an error --
            # the preflight step above has already proved gh itself works.
            if ! names=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); then
              echo "release $TAG does not exist yet (${SECONDS}s elapsed)"
              sleep 60
              continue
            fi
            have_deb=$(grep -c '\.deb$'  <<<"$names" || true)
            have_dmg=$(grep -c '\.dmg$'  <<<"$names" || true)
            have_exe=$(grep -c '\.exe$'  <<<"$names" || true)
            echo "deb=$have_deb dmg=$have_dmg exe=$have_exe (${SECONDS}s elapsed)"
            # TWO of each, not one. Every architecture ships its own bundle now --
            # amd64/arm64 .deb, arm64/x86_64 .dmg, x64/arm64 .exe -- and "at least
            # one" was accurate only while the cross-architecture legs were failing.
            # With them building, one-of-each lets this proceed the moment the
            # primary architecture lands, so SHA256SUMS.txt could be generated
            # before the second bundle attaches and would omit it permanently:
            # the file users verify against would silently not cover their download.
            #
            # Falling short is not fatal. The loop simply runs to its deadline and
            # the job proceeds with whatever exists, which is the old behaviour --
            # so a regressed advisory leg costs waiting, never the release. The
            # printed counts say which one was missing.
            if (( have_deb > 1 && have_dmg > 1 && have_exe > 1 )); then
              echo "All expected assets present (both architectures of each)."
              break
            fi
            sleep 60
          done

      - name: Download assets and generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # Explicit patterns rather than '*': this must never download a previous
          # SHA256SUMS.txt, or a re-run would checksum its own output. `gh release
          # download` has no --exclude flag, so listing what we want is also the
          # only correct way to express that.
          # Each pattern is tolerated separately -- if one platform's build failed,
          # a partial checksum file is still better than none.
          #
          # `*.intoto.jsonl` is here because the release body promises that
          # "SHA256SUMS.txt below lists the hash of every artifact in this release".
          # The provenance bundles became artifacts when the release workflows
          # started attaching them, and leaving them out would quietly make that
          # sentence false -- for the one asset type whose entire purpose is being
          # verifiable.
          for pat in '*.deb' '*.dmg' '*.exe' '*.intoto.jsonl'; do
            gh release download "$TAG" --clobber --pattern "$pat" || \
              echo "note: no asset matched $pat"
          done
          shopt -s nullglob
          files=(*.deb *.dmg *.exe *.intoto.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release assets found for $TAG -- nothing to checksum."
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt to the release
        run: gh release upload "$TAG" dist/SHA256SUMS.txt --clobber

      - name: Prove SHA256SUMS.txt describes the assets that are attached
        # The last line of defence, and the one that makes no timing assumption: an
        # asset written AFTER the checksum file cannot possibly be described by it.
        # One API call, no downloads. This is `scripts/verify-release-assets.py
        # --quick`, inlined so the job keeps its no-checkout property; that script
        # predicted both v2.32.0 mismatches from these timestamps alone, and hashing
        # the binaries confirmed it.
        #
        # Failing red here is the point. The alternative is what actually shipped:
        # a green run and a wrong hash that nobody looks at until a user's
        # `choco upgrade` refuses to install.
        run: |
          set -euo pipefail
          json=$(gh release view "$TAG" --json assets)
          sums_at=$(jq -r '.assets[] | select(.name=="SHA256SUMS.txt") | .updatedAt' <<<"$json")
          if [ -z "$sums_at" ]; then
            echo "::error::SHA256SUMS.txt is not attached to $TAG"
            exit 1
          fi
          newer=$(jq -r --arg t "$sums_at" \
            '.assets[] | select(.name|test("\\.(exe|dmg|deb)$")) | select(.updatedAt > $t) | .name' \
            <<<"$json")
          if [ -n "$newer" ]; then
            echo "::error::written AFTER SHA256SUMS.txt, so it cannot describe them:"
            echo "$newer"
            exit 1
          fi
          echo "ok: no artifact is newer than SHA256SUMS.txt"
