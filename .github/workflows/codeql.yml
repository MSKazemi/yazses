name: CodeQL

# Static security analysis. Free for public repositories, and worth having on a
# project whose entire value proposition is "trust this with everything you say":
# findings show up in the Security tab, not in a vendor's dashboard.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query pattern is caught even when the code is quiet.
    - cron: "24 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 'actions' analyses the workflow files themselves — a real supply-chain
        # surface for a repo that publishes signed artifacts.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          # `languages`, plural. `language:` is not an input the action has, so it
          # was silently ignored and CodeQL auto-detected everything in the tree —
          # which is why adding Kotlin turned every job red at once, and why the
          # matrix was decorative before that.
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Scopes the analysis; see the file for why android/ is excluded and
          # what bringing it in properly would take.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
