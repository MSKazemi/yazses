name: Docs

# Builds the MkDocs + Material documentation site and deploys it to GitHub Pages.
#
# One-time setup in the repo: Settings → Pages → "Build and deployment" →
# Source = "GitHub Actions" (switches away from the old Jekyll branch build).
#
# After that, this runs automatically on any push to main that touches the docs,
# and can also be launched by hand from the Actions tab (workflow_dispatch).

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege: read-only by default; only the deploy job gets Pages write.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so "last updated" dates are accurate

      # Material social cards render via Cairo/Pango + Pillow.
      - name: Install social-card system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev \
            libjpeg-dev libpng-dev libz-dev

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install docs toolchain
        run: uv sync --group docs --no-install-project

      # The privacy plugin mirrors the Google webfonts into the site at build
      # time. Uncached, every run re-fetches ~26 woff2 files, and on 2026-08-11
      # five of them 404'd on Google's side — under --strict that is 5 warnings,
      # which aborted the build and blocked the deploy. Caching the mirror means
      # a normal run touches Google's CDN not at all, so a bad day there can no
      # longer veto the documentation site.
      - name: Cache mirrored external assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: mkdocs-privacy-${{ hashFiles('mkdocs.yml') }}
          restore-keys: mkdocs-privacy-

      - name: Build site (strict)
        run: uv run --group docs mkdocs build --strict

      # The unit tests prove the exclusion *rule* is right and reads its list from
      # the pre-commit hook. They do not look at what was built, and those are
      # different claims: a correct rule that does not run publishes everything,
      # and a file can reach the site by a route the hook never sees — a nav entry
      # added by hand, a copied asset, an include.
      #
      # This is the last point where a leak is still cheap to stop. After the
      # upload it is public. stdlib only, so it needs nothing installed.
      - name: Refuse to publish anything private
        run: python3 scripts/check-site-privacy.py site

      # The APT repository is built by apt-repo.yml and pushed to the `gh-pages`
      # branch. That used to be what GitHub Pages served, so it appeared at
      # https://mskazemi.com/yazses/apt/. Moving the documentation to a
      # workflow-built Pages deployment silently took the whole branch out of
      # service, and that URL has been a 404 ever since — apt-repo.yml has gone on
      # publishing to a branch nobody serves.
      #
      # Nothing visibly broke, because install-apt.sh tries
      # raw.githubusercontent.com/.../gh-pages/apt *first* and only then the Pages
      # URL. But that means the redundancy is gone: of the two sources it knows,
      # exactly one works, so the channel now rests on a single point of failure.
      # Grafting the tree into the artifact restores the second one. It is ~40 KB,
      # and mkdocs has already finished, so nothing here can affect the site build.
      - name: Graft the APT repository into the Pages artifact
        run: |
          set -euo pipefail
          # Not --depth=1: a shallow fetch marks the whole clone shallow, and this
          # job checks out with fetch-depth: 0 precisely so the "last updated"
          # dates are accurate. gh-pages is a handful of commits, so a full fetch
          # of just that branch costs nothing and leaves the clone intact.
          if ! git fetch --no-tags origin gh-pages 2>/dev/null; then
            echo "::warning::no gh-pages branch — APT repo not served this deploy"
            exit 0
          fi
          if ! git cat-file -e FETCH_HEAD:apt 2>/dev/null; then
            echo "::warning::gh-pages has no apt/ directory — nothing to graft"
            exit 0
          fi
          git archive FETCH_HEAD apt | tar -x -C site
          test -s site/apt/KEY.gpg && test -s site/apt/Packages
          echo "Grafted APT repo:" && ls -1 site/apt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # required by actions/deploy-pages
      id-token: write   # OIDC token for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          # NOTE: `timeout` cannot be raised past 10 minutes — actions/deploy-pages
          # silently clamps anything larger ("timeout value is greater than the
          # allowed maximum - timeout set to the maximum of 600000 milliseconds"),
          # so waiting longer is simply not available as a remedy here.
          #
          # This step waits on the Pages *service*, not on our build. When Pages
          # stalls, the run goes red even though the site built fine and the
          # artifact uploaded — and the change silently never reaches the live
          # site while looking shipped. Seen repeatedly on 2026-08-06.
          # If that happens, re-run the failed job; the artifact is reusable.
          error_count: 10 # tolerate more transient polling errors before giving up
