# Publish the offline-transcription container image to GHCR.
#
# WHY THIS NOW RUNS ON TAGS
# -------------------------
# It used to be `workflow_dispatch` and nothing else, on the reasoning that turning
# every release tag into a container publish changes what a release *means*, and
# that call belonged to the maintainer rather than to a workflow file.
#
# The maintainer made it, on 2026-08-13: every supported channel must carry the
# newest version. So a tag now publishes the image, and release-complete.yml
# checks that it did.
#
# ORDERING: the image installs YazSes from PyPI, and on a tag push PyPI does not
# have the version yet — release.yml only publishes it after its test job passes.
# The build therefore waits for PyPI first. Without that wait this would quietly
# build the *previous* release and publish it under the new tag.
#
# SCOPE OF THE IMAGE
# ------------------
# It runs `yazses transcribe` (file -> text) only. Hold-to-talk dictation needs a
# real microphone, the kernel input device for the hotkey, and a window to type
# into, none of which exist in a container. See packaging/docker/Dockerfile.
name: Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "YazSes version to install from PyPI (blank = latest)"
        required: false
        default: ""
      tag:
        description: "Image tag to publish"
        required: false
        default: "latest"
      push:
        description: "Push to GHCR (unchecked = build and smoke-test only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, verify, and optionally publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Required by the GitHub Actions cache below. The runner's default builder
      # uses the plain `docker` driver, which cannot export a cache at all —
      # `cache-to: type=gha` made the build fail before it started, every time,
      # with "Cache export is not supported for the docker driver". This action
      # provisions the `docker-container` driver, which supports both the cache
      # export and the `load: true` the verification steps below depend on.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # A tag push gives the version; a manual run may leave it blank for "latest".
      - name: Decide what to build and how to label it
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "YAZSES_VERSION=$version"  >> "$GITHUB_ENV"
            echo "IMAGE_TAG=$version"       >> "$GITHUB_ENV"
            echo "SHOULD_PUSH=true"         >> "$GITHUB_ENV"
          else
            echo "YAZSES_VERSION=${{ inputs.version }}"          >> "$GITHUB_ENV"
            echo "IMAGE_TAG=${{ inputs.tag || 'latest' }}"       >> "$GITHUB_ENV"
            echo "SHOULD_PUSH=${{ inputs.push || false }}"       >> "$GITHUB_ENV"
          fi

      - name: Wait for PyPI to have this version
        # The image installs from PyPI, and on a tag push release.yml has not
        # published there yet. Building immediately would install the PREVIOUS
        # release and ship it under the new tag -- a wrong image that passes every
        # test below, because the tests check that transcription works, not which
        # version is doing it.
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1800 ))   # 30 minutes
          until (( SECONDS >= deadline )); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/yazses/${YAZSES_VERSION}/json")
            echo "pypi ${YAZSES_VERSION}: HTTP $code (${SECONDS}s)"
            [[ "$code" == "200" ]] && exit 0
            sleep 60
          done
          echo "::error::yazses ${YAZSES_VERSION} never appeared on PyPI -- not building an image for a release that was not published."
          exit 1

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: |
            YAZSES_VERSION=${{ env.YAZSES_VERSION }}
          load: true
          tags: yazses:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image transcribes before publishing it. The repo ships a real clip
      # next to its known-correct text, so this is a genuine end-to-end check rather
      # than a `--help` smoke test: a broken model path or a missing codec fails here
      # instead of in front of the first person who runs the published image.
      - name: Verify it actually transcribes
        run: |
          set -euo pipefail
          # Deliberately byte-for-byte the invocation docs/try-without-installing.md
          # hands the reader, so the page and this test cannot drift apart. It used to
          # differ, and the difference was the bug: the page mounted the sample
          # directory *writable*, and YazSes writes its transcript as a sidecar beside
          # the input — so `jfk.wav` produced `jfk.txt`, silently overwriting the
          # known-correct text the reader was being told to compare against. The
          # comparison then always looked perfect regardless of what the model said.
          mkdir -p /tmp/out
          docker run --rm -v /tmp/models:/models \
            -v "$PWD/data/librispeech-sample:/data:ro" -v /tmp/out:/out \
            yazses:ci jfk.wav -o /out/jfk-heard.txt
          echo "--- transcript ---" && cat /tmp/out/jfk-heard.txt
          # Compare on lowercased letters only: the model legitimately adds punctuation
          # ("Americans," for "Americans"), so a byte comparison would fail on a correct
          # transcript. Word content must still match exactly.
          norm() { tr '[:upper:]' '[:lower:]' < "$1" | tr -cd '[:alnum:] ' | tr -s ' '; }
          if [ "$(norm /tmp/out/jfk-heard.txt)" != "$(norm data/librispeech-sample/jfk.txt)" ]; then
            echo "::error::transcript does not match the expected text"
            diff <(norm /tmp/out/jfk-heard.txt) <(norm data/librispeech-sample/jfk.txt) || true
            exit 1
          fi
          echo "OK — transcript matches the expected text."
          # The documented command must leave the checkout untouched. If someone
          # reintroduces a writable mount, this is what catches it.
          if ! git diff --quiet data/librispeech-sample/; then
            echo "::error::the documented command modified the reference sample"
            git diff --stat data/librispeech-sample/
            exit 1
          fi

      # Re-run with no network at all. This is the project's central claim, so the
      # image must not be publishable without demonstrating it.
      - name: Prove it works fully offline
        run: |
          set -euo pipefail
          rm -f /tmp/out/jfk-offline.txt
          # Same read-only shape as the step above, and as docs/privacy-statement.md.
          docker run --rm --network none -v /tmp/models:/models \
            -v "$PWD/data/librispeech-sample:/data:ro" -v /tmp/out:/out \
            yazses:ci jfk.wav -o /out/jfk-offline.txt
          test -s /tmp/out/jfk-offline.txt
          echo "OK — transcribed with networking disabled."

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.SHOULD_PUSH == 'true'
        run: |
          set -euo pipefail
          base="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"  # GHCR requires lowercase
          docker tag yazses:ci "${base}:${IMAGE_TAG}"
          docker push "${base}:${IMAGE_TAG}"
          # A release also becomes :latest. Only from a tag -- a manual run must not
          # be able to move :latest onto an arbitrary build.
          if [[ "${{ github.ref_type }}" == "tag" && "$IMAGE_TAG" != "latest" ]]; then
            docker tag yazses:ci "${base}:latest"
            docker push "${base}:latest"
          fi
          echo "Published $target" >> "$GITHUB_STEP_SUMMARY"
