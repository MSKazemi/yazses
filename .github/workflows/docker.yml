# Build and publish the container image to GHCR (#76).
#
# Uses the built-in GITHUB_TOKEN with `packages: write` — no new secrets.
name: docker

on:
  push:
    branches: [main]
    paths:
      - "packaging/docker/**"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by the attestation step below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only a tag build publishes. A push to main proves the image still builds
      # without moving `latest` — the alternative is `latest` silently tracking an
      # unreleased commit, which is how people end up running something that was
      # never released.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Version being installed
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          # arm64 is emulated under QEMU here and is slow; it is included because
          # ctranslate2 publishes aarch64 wheels, so the image is genuinely usable
          # on a Pi or an Apple-silicon Docker Desktop.
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YAZSES_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.value || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The image exists to run one command. A build that produces an image which
      # cannot transcribe is a green check over a broken artifact.
      - name: Smoke-test the built image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker buildx build --load --platform linux/amd64 \
            -f packaging/docker/Dockerfile -t yazses:ci .
          docker run --rm yazses:ci --version
          cp data/librispeech-sample/jfk.wav "$RUNNER_TEMP/clip.wav"
          docker run --rm -v "$RUNNER_TEMP:/data" yazses:ci \
            transcribe /data/clip.wav --model tiny.en
          grep -qi "fellow americans" "$RUNNER_TEMP/clip.txt"
