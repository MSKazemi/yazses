# Build and publish the container image to GHCR (#76).
#
# Uses the built-in GITHUB_TOKEN with `packages: write` — no new secrets.
name: docker

# NOTE ON THE TRIGGER (fixed 2026-08-14 — do not re-add `paths:`)
#
# This used to carry a `paths:` filter alongside `tags: ["v*"]`. A `push` filter
# set applies to EVERY push the workflow sees, tags included, and a tag push
# changes no files — so the paths filter matched nothing and silently suppressed
# every tag build. Result: `7aa2879 ci: ... let a tag publish the container` never
# did. Five releases (v2.16.0 -> v2.18.2) produced zero tag-triggered runs, and
# `ghcr.io/mskazemi/yazses:latest` still 404s.
#
# The cost of dropping `paths` is that a push to main now always runs the build +
# smoke test (~1.5 min) instead of only when docker files change. That is a build-
# health check on the release artifact, which is worth 1.5 minutes. The publish is
# still gated on the tag ref by the `if:`/`push:` conditions below, so a push to
# main still cannot move `latest`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by the attestation step below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Only a tag build publishes. A push to main proves the image still builds
      # without moving `latest` — the alternative is `latest` silently tracking an
      # unreleased commit, which is how people end up running something that was
      # never released.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Version being installed
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The image installs `yazses[diarization]==<version>` from PyPI, but the
      # PyPI upload happens in release.yml, which a tag starts at the same
      # moment as this workflow. Whichever wins the race decides whether the
      # release gets a container: on v2.19.0 and v2.20.0 this job lost, pip
      # found no such version, and the tag shipped without an image until
      # someone re-ran it by hand. Wait for the version to exist instead.
      # This waits on what `pip install` resolves against, NOT on the JSON
      # metadata API. On v2.24.0 the old check polled
      # https://pypi.org/pypi/yazses/<v>/json, saw 200, and the Docker build
      # failed SIXTEEN SECONDS later with "no matching distribution", listing
      # versions that stopped one release short. The two surfaces are cached
      # separately and the metadata API leads -- so the guard passed while the
      # thing it guards was still untrue.
      #
      # The PEP 503 simple index is what pip resolves against, so waiting for the
      # artifact to appear *there* is waiting for the thing that actually failed.
      # Deliberately not `pip download`: that would be the most faithful test, and
      # it silently assumes pip is installed -- a venv without it reports the same
      # "cannot resolve" as a missing release, which is a false negative in the
      # direction that blocks every build.
      - name: Wait for PyPI to serve this version to pip
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS https://pypi.org/simple/yazses/ \
                 | grep -q "yazses-${VERSION}-py3-none-any.whl"; then
              echo "the index pip reads serves yazses ${VERSION} (attempt ${attempt})."
              exit 0
            fi
            echo "yazses ${VERSION} not in the simple index yet; retrying in 30s (${attempt}/40)."
            sleep 30
          done
          echo "::error::yazses ${VERSION} never reached the simple index -- refusing to build an image that would pin the wrong version."
          exit 1

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          # arm64 is emulated under QEMU here and is slow; it is included because
          # ctranslate2 publishes aarch64 wheels, so the image is genuinely usable
          # on a Pi or an Apple-silicon Docker Desktop.
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YAZSES_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.value || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The image exists to run one command. A build that produces an image which
      # cannot transcribe is a green check over a broken artifact.
      - name: Smoke-test the built image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker buildx build --load --platform linux/amd64 \
            -f packaging/docker/Dockerfile -t yazses:ci .
          docker run --rm yazses:ci --version
          cp data/librispeech-sample/jfk.wav "$RUNNER_TEMP/clip.wav"
          # --user matters: the image runs as uid 1000 and the runner's workspace
          # is owned by a different uid, so without this the transcript cannot be
          # written back into the mount. Anyone whose uid is not 1000 hits the
          # same thing, which is why the docs say so too.
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP:/data" yazses:ci \
            transcribe /data/clip.wav --model tiny.en
          grep -qi "fellow americans" "$RUNNER_TEMP/clip.txt"
