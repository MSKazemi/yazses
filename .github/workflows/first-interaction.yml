name: Greet first-time contributors

# A first issue or first PR from someone new is the moment they are most likely to
# quietly walk away — usually because they cannot tell whether anyone is there. This
# posts once, only on a person's very first issue and very first PR in this repo, and
# never again afterwards.

# SECURITY: `pull_request_target` is required, not incidental — a PR from a fork runs with a
# read-only token under `pull_request`, so it could not post the comment, and forks are exactly
# the case this exists for. It is safe here only because this workflow **never checks out or
# executes PR code**: it has no `actions/checkout` step and runs one action that posts a
# comment. Do not add a checkout step to this file.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# Read-only at the top so that the two write scopes exist only inside the job that
# posts the comment. That matters more here than it looks: `pull_request_target` gives
# this file a token with real write access to the tracker, and the note above forbids
# adding a checkout step -- a top-level grant is what would make ignoring that note
# expensive rather than merely wrong.
permissions:
  contents: read

jobs:
  greet:
    # Replaces the block above rather than adding to it, so `contents: read` is
    # repeated here on purpose.
    permissions:
      contents: read
      # Post the greeting on a first issue...
      issues: write
      # ...and on a first pull request. The action treats them as separate scopes.
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          # v3 renamed these inputs to snake_case. With the hyphenated v2 names the
          # action aborts on `Input required and not supplied: issue_message`, so the
          # greeting silently never posted — the failure mode this file exists to prevent.
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            👋 Thanks for opening your first issue here — genuinely, it helps.


            A maintainer will reply within a few days. If this is a bug, `yazses doctor`
            output and the OS/desktop you are on (X11 or Wayland matters) will speed it
            up a lot.


            If you ever fancy sending a change, there is **nothing to sign** — no CLA, no
            sign-off line. Opening the pull request is the whole contract. The
            [`browser-only`](https://github.com/MSKazemi/yazses/issues?q=is%3Aopen+label%3Abrowser-only)
            tasks need no clone and no Python at all, and the test suite is fully offline
            and runs in about 30 seconds.
          pr_message: >
            🎉 Thanks for your first pull request to YazSes — that is a real contribution
            and it is appreciated.


            **There is nothing to sign.** No CLA, no sign-off line, no bot to authorise —
            opening this PR is the whole contract, so there is no paperwork step you can
            have missed.


            A maintainer will review it within a few days. We would rather merge a small
            imperfect PR and polish it afterwards than leave you waiting, so please do not
            worry if CI is red on the first push — say so and we will help you read it. If
            a check sits on "waiting for approval", that is GitHub holding runs on a first
            fork PR; it is not something you did, and a maintainer will clear it.


            Two things that catch people out: `ruff` and `pytest` are the gates that must
            be green (mypy is advisory), and if you changed a CLI command, flag or config
            key, run `uv run python scripts/gen-docs.py` or the doc-sync test will fail.


            Once this lands you will be added to the contributors wall in the README.
