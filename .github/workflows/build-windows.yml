name: build-windows

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/yazses/platform/windows/**'
      - 'src/yazses/__main__.py'
      - 'src/yazses/tray/**'
      - 'packaging/windows/**'
      - 'assets/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/gen-icons.py'
      - 'src/yazses/brandmark.py'
      - '.github/workflows/build-windows.yml'
      - 'pyproject.toml'
  workflow_dispatch:

# Least privilege: read-only by default; the build job declares what it needs.
permissions:
  contents: read

jobs:
  build:
    permissions:
      id-token: write   # SignPath OIDC authentication, and build provenance
      contents: write   # softprops/action-gh-release attaches the .exe
      # Build provenance ties this binary to this workflow and commit, which
      # matters most for an UNSIGNED artifact — it is the only verifiable link a
      # user has (OpenSSF Signed-Releases, #116). `id-token` above is shared with
      # SignPath; listing it twice is a duplicate key, which YAML parsers accept
      # silently and GitHub Actions rejects outright.
      attestations: write
    # One installer per architecture. Windows on ARM is a real desktop target
    # now, and until this matrix existed the only .exe was x64 -- an ARM user
    # could run it under emulation but never got a native build.
    #
    # PyInstaller does not cross-compile, so the runner label IS the target
    # architecture; build-windows.ps1 derives the name from the host rather than
    # taking a flag, which keeps the two from disagreeing.
    #
    # arm64 is `continue-on-error` on purpose: GitHub's windows-11-arm runners
    # and PyInstaller-on-ARM have never run in this repo, and a brand-new
    # cross-arch job must not be able to fail a release that x64 completed fine.
    # Promote it once it has been green a few times.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            experimental: false
          - arch: arm64
            runner: windows-11-arm
            experimental: true
    name: build (windows-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45

    env:
      # SignPath.io signing (free for OSS). All four must be set for the
      # sign step to fire; otherwise the workflow ships an unsigned dev
      # preview (the v0 default).
      #   SIGNPATH_API_TOKEN          — API token from SignPath account
      #   SIGNPATH_ORGANIZATION_ID    — UUID of your SignPath organisation
      #   SIGNPATH_PROJECT_SLUG       — e.g. "yazses"
      #   SIGNPATH_SIGNING_POLICY     — e.g. "release-signing"
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY: ${{ secrets.SIGNPATH_SIGNING_POLICY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `latest`, like every other workflow here. This was pinned to '0.5.x'
          # — a toolchain from December 2024 — and only in the two desktop-bundle
          # workflows, which is also where both cross-architecture legs failed.
          # On windows-11-arm the pin is the whole failure:
          #
          #   error: No download found for request: cpython-3.12-windows-aarch64-none
          #
          # uv 0.5 predates python-build-standalone's Windows ARM64 builds, so it
          # cannot fetch an interpreter for the runner it is standing on. A pin
          # that old is not stability, it is a platform that had not been invented
          # yet.
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Confirm Inno Setup is available
        shell: pwsh
        run: |
          $cands = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not preinstalled; installing via choco"
            choco install innosetup -y --no-progress
          } else {
            Write-Host "Found Inno Setup at $iscc"
          }

      - name: Detect signing presence
        id: sign
        shell: pwsh
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID -and $env:SIGNPATH_PROJECT_SLUG -and $env:SIGNPATH_SIGNING_POLICY) {
            Write-Host "Signing via SignPath will run."
            echo "sign=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "SignPath secrets not all present; producing unsigned dev preview."
            echo "sign=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Locate .exe
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist\YazSes-*-windows-${{ matrix.arch }}.exe" | Select-Object -First 1
          if (-not $exe) { throw "No ${{ matrix.arch }} installer produced" }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      # Upload the unsigned .exe to SignPath, which signs it and returns the
      # signed binary as a separate artefact named "$name.signed".
      - name: Upload to SignPath for signing
        # `id` is load-bearing: the signing step below needs this step's
        # `artifact-id` output, and a step with no id cannot be referenced.
        id: upload-unsigned
        if: steps.sign.outputs.sign == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.sign.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          # The ARTIFACT id, not the run id. The action's own input description says
          # "Use `steps.<step-id>.outputs.artifact-id` from the preceding
          # actions/upload-artifact step" — this passed ${{ github.run_id }}, a
          # different number that identifies the workflow run. SignPath would have
          # looked up an artifact that does not exist. It could never have been
          # caught by a build, because the whole signing path is gated on four
          # secrets that have never been set, so these lines have never executed.
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Default is 600 s. A SignPath Foundation signing policy may require a
          # human to approve each signing request in SignPath's web UI, and ten
          # minutes is not enough time to notice an email and click approve — the
          # job would fail and the release would ship with no Windows installer at
          # all. 30 min also stays inside the 45-minute window checksums.yml waits
          # for producer workflows, so SHA256SUMS.txt still covers both .exe.
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist-signed
          parameters: |
            Version: ${{ github.ref_name }}

      - name: Replace unsigned installer with signed one
        if: steps.sign.outputs.sign == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem "dist-signed\*.exe" | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no signed exe" }
          Copy-Item -Force $signed.FullName "${{ steps.locate.outputs.path }}"
          Write-Host "Replaced unsigned installer with signed version: $($signed.Name)"
          Get-AuthenticodeSignature "${{ steps.locate.outputs.path }}" | Format-List

      # Until this step existed, CI proved only that the installer *built*.
      # Nothing checked that it installed, that the binaries ran, or that the
      # CLI could print — and all three were broken in shipped releases.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "${{ steps.locate.outputs.path }}"
          $app = "$env:LOCALAPPDATA\Programs\YazSes"
          $log = "$env:RUNNER_TEMP\yazses-install.log"

          Write-Host "::group::Silent install"
          # /VERYSILENT is also what winget's validation pipeline uses, so this
          # doubles as a check that the manifest's InstallerSwitches are honest.
          $p = Start-Process -Wait -PassThru -FilePath $installer `
               -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log"
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "installer exited $($p.ExitCode)"
          }
          Write-Host "::endgroup::"

          Write-Host "::group::Payload"
          foreach ($f in @('YazSesApp.exe','yazses-cli.exe','yazses.cmd')) {
            if (-not (Test-Path "$app\$f")) { throw "installer did not deliver $f" }
            Write-Host "  ok  $f"
          }
          Write-Host "::endgroup::"

          Write-Host "::group::CLI runs and prints"
          # Native stdout goes to a file rather than through `2>&1`: under
          # $ErrorActionPreference='Stop', anything a native command writes to
          # stderr can abort the step, which would make an unrelated warning
          # look like a build failure.
          function Invoke-Cli([string[]]$CliArgs, [string]$Tag) {
            $o = "$env:RUNNER_TEMP\$Tag.out"
            $e = "$env:RUNNER_TEMP\$Tag.err"
            $p = Start-Process -Wait -PassThru -NoNewWindow -FilePath "$app\yazses-cli.exe" `
                 -ArgumentList $CliArgs -RedirectStandardOutput $o -RedirectStandardError $e
            [pscustomobject]@{
              Code = $p.ExitCode
              Out  = (Get-Content $o -Raw -ErrorAction SilentlyContinue)
              Err  = (Get-Content $e -Raw -ErrorAction SilentlyContinue)
            }
          }

          # The regression this guards: the CLI used to live only in a windowed
          # binary, which has no stdout, so this produced an empty string.
          $v = Invoke-Cli @('--version') 'version'
          if ($v.Code -ne 0) { throw "yazses-cli --version exited $($v.Code): $($v.Err)" }
          if ([string]::IsNullOrWhiteSpace($v.Out)) {
            throw "yazses-cli --version printed nothing (is it a windowed build?)"
          }
          Write-Host "  version: $($v.Out.Trim())"

          # `doctor` is the widest cheap exercise of the bundle that needs no
          # microphone. Informational: a runner has no mic and no audio device,
          # so its warnings are expected and must not fail the build.
          $d = Invoke-Cli @('doctor') 'doctor'
          Write-Host $d.Out
          Write-Host "  doctor exit: $($d.Code) (informational)"
          Write-Host "::endgroup::"

          Write-Host "::group::Shim + PATH"
          $shimOut = "$env:RUNNER_TEMP\shim.out"
          $sp = Start-Process -Wait -PassThru -NoNewWindow -FilePath "cmd.exe" `
                -ArgumentList '/c',"`"$app\yazses.cmd`"",'--version' `
                -RedirectStandardOutput $shimOut
          if ($sp.ExitCode -ne 0) { throw "yazses.cmd exited $($sp.ExitCode)" }
          $shim = Get-Content $shimOut -Raw -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($shim)) { throw "yazses.cmd forwarded nothing" }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if ($userPath -notlike "*$app*") { throw "installer did not add $app to PATH" }
          Write-Host "  ok  shim + PATH entry"
          Write-Host "::endgroup::"

          Write-Host "::group::Uninstall"
          $unins = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "no uninstaller was written" }
          $u = Start-Process -Wait -PassThru -FilePath $unins.FullName `
               -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($u.ExitCode -ne 0) { throw "uninstaller exited $($u.ExitCode)" }

          if (Test-Path "$app\YazSesApp.exe") { throw "uninstall left the binary behind" }
          # A botched PATH removal is the one failure here that damages the
          # machine rather than just the app, so assert both halves.
          $after = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if ($after -like "*$app*") { throw "uninstall left $app on PATH" }
          if ([string]::IsNullOrWhiteSpace($after)) { throw "uninstall wiped the user PATH" }
          Write-Host "  ok  removed cleanly, PATH intact"
          Write-Host "::endgroup::"

      - name: Show build artefacts
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length, LastWriteTime

      - name: Upload installer (signed if applicable)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yazses-windows-${{ matrix.arch }}-${{ steps.sign.outputs.sign == 'true' && 'signed' || 'unsigned' }}-${{ github.sha }}
          path: dist/YazSes-*-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attest build provenance for the .exe
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # dist/, not the repo root — same defect as build-macos.yml. The glob
          # matched nothing, the step failed, and the "Attach to release" step
          # after it never ran, so the installer never reached the release.
          subject-path: dist/YazSes-*-windows-${{ matrix.arch }}.exe

      # Scorecard's Signed-Releases check reads release ASSET FILENAMES, not
      # GitHub's attestations API, so the attestation above scored 0/10 until the
      # bundle was attached too. See the longer note in release.yml. `pwsh` here:
      # every other run step in this job sets it explicitly, and the arch is in the
      # name because both matrix legs upload to the same release.
      - name: Attach the provenance bundle as a release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item "${{ steps.attest.outputs.bundle-path }}" `
            "dist/YazSes-$version-windows-${{ matrix.arch }}.intoto.jsonl"

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/YazSes-*-windows-${{ matrix.arch }}.exe
            dist/YazSes-*-windows-${{ matrix.arch }}.intoto.jsonl
          fail_on_unmatched_files: true
