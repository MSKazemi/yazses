name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # The manual escape hatch: a dispatched run always takes the full lane.
  workflow_dispatch:

# Fast and full lanes, and the `ci-gate` status: see .github/CI_POLICY.md section 5.
#
# A rapid PR update should spend runners only on the newest head. Pushes to main are
# deliberately unique and never cancelled: every merged commit still gets its own run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and runs the suite. It never
# publishes, comments, or writes a check. (The release/publish workflows need more
# and declare their own — do not copy this block into them blindly.)
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Run Qt (PySide6 overlay) headless in CI — no display server needed.
  QT_QPA_PLATFORM: offscreen

jobs:
  changes:
    # Decides the lane. Standard library only, so no `uv sync` stands between a PR and
    # the decision. Any doubt resolves to the full lane, never the fast one: a non-PR
    # event, the `ci:full` label, a diff that cannot be listed, an empty diff, or a path
    # the classifier does not know.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.lanes.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR is checked out as its merge commit. Depth 2 brings its first parent,
          # the base branch tip it merges into, so HEAD^1..HEAD is exactly what the
          # PR would change on main today, not what changed since it forked.
          fetch-depth: 2

      - name: Choose the lanes
        id: lanes
        # Explicit, for pipefail: GitHub's default shell has none, and a classifier
        # that crashed behind `tee` would otherwise end this step green.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::notice::$EVENT_NAME run: taking the full lane"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FULL_LABEL" = "true" ]; then
            echo "::notice::labelled ci:full: taking the full lane"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a file moved out of src/ must count as a src/ change too.
          if ! changed=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "::warning::could not list the changed files: taking the full lane"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" \
            | python3 scripts/classify_changes.py --github-output \
            | tee -a "$GITHUB_OUTPUT"

  repo-hygiene:
    # Cheap and Linux-only: a large file costs every future clone permanently, and the
    # only inexpensive moment to catch one is before the commit lands.
    runs-on: ubuntu-latest
    # Healthy runs take under a minute. With no limit, a hung `apt-get update` held a
    # runner for 78 minutes on PR #625 before it was cancelled by hand (CI_POLICY.md §8).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No oversized files in the repo
        run: python3 scripts/check_repo_size.py

      # Read-only: reports translation drift, never edits a translation. English is
      # the source of truth and the translations are native human work, so the fix
      # always belongs to someone who reads the language.
      - name: README translations have not drifted
        run: python3 scripts/check-translations.py

      - name: Install system dependencies (Linux)
        # Just enough for `import yazses.core.daemon` (sounddevice dlopen's this at
        # import time) — the dependency budget check below imports it on a base
        # install. No Qt libs needed: PySide6 is not imported at daemon module scope.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts paper/benchmark

      - name: Dependency budget
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        # Values are passed as env vars and read as shell variables, never interpolated
        # into the script body — a label is attacker-adjacent text and `${{ }}` inside
        # `run:` is how that becomes a shell injection.
        run: |
          # The growth check compares against the baseline as it exists on the base
          # branch, so a PR cannot wave through a new dependency by rewriting the
          # baseline in the same commit. A shallow checkout has no base branch ref, so
          # fetch that one commit; the check says so out loud if this fails.
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          fi
          uv run python scripts/check_dependency_budget.py

      - name: CI contract and generated-file drift
        # The fast lane's share of the suite: the tests that pin the classifier, the
        # gate and the workflows, and the generators whose drift once turned every
        # matrix leg red at once. Seconds, not minutes. The full suite still runs them.
        run: |
          uv run python -m pytest -q \
            tests/test_classify_changes.py \
            tests/test_ci_lanes.py \
            tests/test_workflow_concurrency.py \
            tests/test_gen_docs.py \
            tests/test_gen_man.py \
            tests/test_adr_index_is_current.py

  # The matrix's ubuntu/3.12 leg, moved out so the whole suite runs on every PR, even
  # when the full lane is skipped. tests/test_ci_lanes.py keeps its steps equal to `test`'s.
  test-linux:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # The same limit as `test`, for the same reason: without one a hang holds a runner
    # for GitHub's 6-hour default (CI_POLICY.md §8).
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            desktop-file-utils \
            xdotool

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        # Must stay identical to `test`'s step; the comment there says why.
        run: uv run pytest tests/ -n auto --dist worksteal -rfE --durations=30

  test:
    # Full lane: the rest of the OS/interpreter matrix.
    needs: changes
    if: needs.changes.outputs.full != 'false'
    runs-on: ${{ matrix.os }}
    # The suite runs on every core (pytest-xdist, below). Serial, the slowest leg --
    # windows-latest, 3.12 -- took 77 minutes on 92ad3c89 and this job had no limit at
    # all, so a hang held a runner for GitHub's 6-hour default (CI_POLICY.md §8).
    # In parallel the slowest leg took 15 minutes (e0463500) and 3-5 minutes once the
    # suite itself was sped up (96e98ffe, c1a9ab56), so 30 is twice the worst healthy run.
    timeout-minutes: 30
    # Legs without `experimental` are blocking; only a leg that explicitly opts
    # out is allowed to fail. Written this way round so that adding a new leg
    # makes it blocking by default rather than silently non-blocking.
    # PROMOTE WHEN: an `experimental: true` leg has passed once -- delete the flag. The
    # arm64 leg has (run 39471109286); flipping it is the owner's call (CI_POLICY.md §6.1).
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `requires-python = ">=3.11"`, so every version from 3.11 up is a version
        # users install on. Stopping the matrix at 3.12 meant a break on a newer
        # interpreter reached a user before it reached CI — which is exactly how
        # 3.13's new class dunders (`__firstlineno__`, `__static_attributes__`)
        # broke a test that nothing here could see. 3.13 and 3.14 run on Linux
        # only: the failure mode being caught is interpreter behaviour, not OS
        # behaviour, and a full 3x5 matrix buys nothing for the runtime it costs.
        python-version: ["3.11", "3.12"]
        # Runs as `test-linux` above, on every PR, so it is not repeated here.
        exclude:
          - os: ubuntu-latest
            python-version: "3.12"
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # The first execution of the suite on arm64 Linux, ever. Every arm64
          # channel -- the .deb, the snap, the docker image -- is marked shipping
          # in docs/platform-support.md, and the tests had never once run on the
          # architecture: the claim rested entirely on the code being pure Python.
          # GitHub's arm64 runners are free and unlimited on public repositories,
          # so this is permanent regression coverage rather than a one-off check.
          #
          # continue-on-error while it is unproven, exactly as build-macos.yml
          # treats macos-15-intel. FLIP IT TO BLOCKING once it has passed once --
          # a leg that is permitted to fail forever is a leg nobody reads.
          - os: ubuntu-24.04-arm
            python-version: "3.12"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags, not just the commit. The packaging-manifest guards compare
          # scoop/chocolatey/winget against the latest release *tag*, and with
          # no tags fetched they hit their "shallow clone" skip and passed
          # silently -- so the guard meant to stop a stale manifest reaching a
          # package manager has never once been enforced in CI.
          fetch-depth: 0
          # blob:none, NOT tree:0. A treeless clone cannot answer a path-limited
          # `git log -- <file>`: deciding which commits touched a path needs the
          # trees, so git falls back to fetching them one at a time from the
          # promisor remote. `hooks/sitemap_dates.py` runs that query with a 10 s
          # timeout, gets nothing, and returns "" -- which is how
          # test_sitemap_dates_hook.py failed on all eight legs while passing on
          # every developer machine. Measured against real clones of this
          # repository: tree:0 cannot produce the date at all, blob:none returns
          # it. Skipping blobs keeps nearly all of the speed.
          filter: blob:none

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # The last two packages are not build dependencies -- they are two tests
        # that skipped in every CI job on every runner purely because the tool they
        # shell out to was absent, and skipped *silently*, which reads exactly like
        # passing:
        #   desktop-file-utils -> tests/test_desktop_launcher.py, the freedesktop
        #                         validator proving the shipped .desktop entry parses
        #   xdotool            -> tests/test_windowctl_promises.py, the only test that
        #                         reaches the OK branch of doctor's window-focus check
        # Both are installed on the maintainer's machine, so both ran locally and
        # neither had ever run here. Do not trim them for image size: dropping either
        # one deletes a test rather than a package.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            desktop-file-utils \
            xdotool

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        # One worker per core (`-n auto`). `worksteal` rebalances as workers finish,
        # because test durations are very uneven -- a few whole-tree scans take 10-45 s
        # while most tests take milliseconds. Same tests, same assertions: only the
        # scheduling changes. `--durations=30` names the slowest tests in every log, so
        # a regression in suite time shows up as a name, not as a slower job.
        run: uv run pytest tests/ -n auto --dist worksteal -rfE --durations=30

  gui:
    # The windowed surfaces — settings window, tray, overlay — on the two OSes
    # most users run them on.
    #
    # PySide6 is deliberately not a base dependency (648 MB of Qt), so `uv sync`
    # never installs it and EVERY Qt test in the suite is skipped by the job
    # above. The result was that the settings window's own tests had never
    # executed anywhere, and running them for the first time found two defects
    # they were written to catch: they hung forever on any machine with a daemon
    # running, and a partly-failed Apply reported itself as a clean save. A test
    # that is always skipped is not a test.
    #
    # Ubuntu + Windows only: macOS adds a third Qt build for the same code paths
    # and the failures being caught are Qt/logic, not platform. Runs offscreen,
    # so no display server is needed. `--no-skip-gui` does not exist — instead
    # the run fails if PySide6 is missing, because a silent skip here would
    # restore exactly the hole this job closes.
    name: GUI (Qt) — ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.full != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies (with Qt)
        run: uv sync --extra overlay

      - name: PySide6 must actually be importable
        # Without this the Qt tests skip and the job passes green having tested
        # nothing — the precise failure mode this job exists to end.
        run: uv run python -c "import PySide6; print(PySide6.__version__)"

      - name: Run the windowed-surface tests
        # One run, not two. `-rs` lists skip reasons in the same output the
        # assertions produce, and `pipefail` keeps pytest's exit code from being
        # swallowed by `tee` — without it a red suite would report success and
        # only the skip check below would ever fail.
        #
        # `python -m pytest`, not `uv run pytest`: it puts the project on
        # sys.path the way AGENTS.md specifies for this repo.
        shell: bash
        run: |
          set -o pipefail
          # The settings-window family is a GLOB, not a hand-written list. It
          # was a list of nine filenames, and a tenth
          # (tests/test_settingsui_snap_banner.py) was added without anyone
          # noticing it had joined nothing: it would have run only on a
          # developer's machine, where PySide6 is absent and it skips. A set
          # that has to be remembered is the defect; derive the region instead.
          # tests/test_gui_covers_every_settingsui_file.py fails if this stops
          # matching the family.
          uv run python -m pytest -v -rs \
            tests/test_settingsui_*.py \
            tests/test_gui_entry_points.py \
            tests/test_tray_settings_parity.py \
            tests/test_tray_about.py 2>&1 | tee gui-tests.txt

      - name: No Qt test may be silently skipped
        # A skip here means a guard stopped guarding — which is the whole reason
        # this job exists, since the suite above was skipped in CI for its entire
        # life and nobody could see it in a green run.
        shell: bash
        run: |
          if grep -q "^SKIPPED" gui-tests.txt; then
            echo "::error::A Qt test was skipped in the GUI job — it guards nothing here."
            grep "^SKIPPED" gui-tests.txt
            exit 1
          fi
          echo "No Qt test was skipped."

  extras:
    # The same hole the GUI job closed, still open for four other extras.
    #
    # `uv sync` installs base dependencies only, so every test guarded by an
    # optional extra skips in the main job — and until this job existed, in
    # *every* job. Fourteen tests were reporting green while executing nothing:
    # eleven in `test_han_script.py` behind `chinese`, and one each behind
    # `notes`, `diarization-pyannote` and `voiceprint-resemblyzer`. The Qt case
    # proved what that costs: the settings-window tests had never run anywhere,
    # and their first real execution immediately found two shipped defects.
    #
    # This covers the extras whose cost is trivial. `chinese` is a single
    # pure-Python package (`opencc-python-reimplemented`), and installing it
    # takes `test_han_script.py` from 30 passed / 11 skipped to 41 passed —
    # eleven assertions about Simplified vs Traditional output that had never
    # executed, on a code path a user in Taipei hits on every utterance.
    #
    # NOT COVERED HERE, and named so the gap is visible rather than forgotten:
    # `notes`/`slm` (llama-cpp-python compiles a C++ inference engine), and
    # `diarization-pyannote` / `voiceprint-resemblyzer` (both pull torch, ~2 GB).
    #
    # The torch pair is now covered *weekly* by `heavy-extras.yml` rather than on
    # every push: both were run by hand on 2026-08-24 and passed, and what they
    # catch is an upstream API change — which arrives on upstream's schedule, not
    # with a commit here. `notes`/`slm` stays skipped everywhere. That is a real
    # gap — it is recorded here instead of being hidden behind a green tick.
    #
    # Linux only: these extras are pure Python or platform-independent, and the
    # OS matrix in the main job already covers the code around them.
    name: Optional extras
    needs: changes
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies (with the light optional extras)
        run: uv sync --extra chinese

      - name: The extra must actually be importable
        # Without this the guarded tests skip and the job passes green having
        # tested nothing — the precise failure mode this job exists to end.
        run: uv run python -c "import opencc; print('opencc ok')"

      - name: Run the tests that only exist when the extra is installed
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest -v -rs tests/test_han_script.py 2>&1 | tee extras-tests.txt

      - name: No extra-guarded test may be silently skipped
        shell: bash
        run: |
          if grep -q "^SKIPPED" extras-tests.txt; then
            echo "::error::A test guarded by the 'chinese' extra was skipped — it guards nothing here."
            grep "^SKIPPED" extras-tests.txt
            exit 1
          fi
          echo "No extra-guarded test was skipped."

  freebsd:
    # Runs the suite on a REAL FreeBSD VM, not a simulated `sys.platform`.
    #
    # `src/yazses/platform/bsd/` is composed from the Linux backend on the
    # argument that those components are genuinely portable (platformdirs/XDG
    # paths, evdev, ports-provided injection tools, Unix-socket IPC). That
    # argument is only worth as much as an execution on the real thing — the
    # unit tests can prove the wiring, never the assumption underneath it.
    #
    # GitHub has no BSD runners, so this drives a FreeBSD guest inside the Linux
    # runner. It is deliberately ADVISORY (`continue-on-error`) until it has been
    # green for a few runs: a brand-new cross-OS job that has never executed must
    # not be able to turn `main` red on its first PR. Promote it to blocking —
    # and upgrade the ⚗️ row in docs/platform-support.md to ✅ — once it is
    # reliably passing.
    #
    # Advisory, so it is not one of ci-gate's dependencies.
    needs: changes
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    # PROMOTE WHEN: green on several consecutive runs with #306 resolved -- delete this,
    # add the job to ci-gate's needs and upgrade its row in docs/platform-support.md.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run the test suite on FreeBSD
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          usesh: true
          # The ubuntu-latest host has 4 vCPUs; give them to the VM so `-n auto` below
          # has cores to use. The action leaves `cpu` unset by default.
          cpu: 4
          # Derived, not pinned. The first run of this job found two independent
          # reasons the obvious spelling cannot work:
          #   * `py311-pip` is not in the binary repo — 3.12 is the ports default
          #     and pip is built only for the default flavour. `py311-sqlite3`
          #     does exist, which makes the gap look arbitrary until you check.
          #   * `lang/python311` configures `--without-ensurepip`, so even with the
          #     right interpreter `python -m venv` cannot bootstrap pip itself.
          # So: install the DEFAULT python, ask it which flavour prefix it is, and
          # install pip/sqlite3 for exactly that. This survives the ports default
          # moving 3.12 → 3.13, and it exercises the interpreter a FreeBSD user
          # actually gets rather than one we pinned. portaudio backs sounddevice,
          # which dlopen's it at import time.
          #
          # PyPI ships no FreeBSD wheels, so anything with a compiled extension is
          # a source build here. Two of them are why this job could not finish, and
          # both were measured rather than guessed:
          #
          #   * `cryptography` builds through maturin and needs `rust`. Without it
          #     the job dies on `metadata-generation-failed` before a single test.
          #     With it the build takes ~5 minutes. FreeBSD's own binary package
          #     would be faster, but ports carries py312-cryptography 48.0.1
          #     against our `cryptography>=50.0.0`, so pip rejects it and builds
          #     anyway — re-check when ports catches up.
          #   * `numpy` has no wheel either, and compiling it from the 20 MB sdist
          #     ran for 38 minutes and hit `timeout-minutes` without finishing.
          #     py312-numpy is 2.4.6, which satisfies our `numpy>=2.4.6` exactly,
          #     so the binary port removes that build entirely. Same for
          #     sounddevice (0.5.5 vs `>=0.5.5`).
          #
          # Install the compiled ones from pkg and let the `--system-site-packages`
          # venv below find them, so pip never reaches for a source build.
          prepare: |
            # git and bash are not in the FreeBSD VM image, and their absence was
            # indistinguishable from a defect. Twenty-odd repo-hygiene guards --
            # "is this file tracked?", "is this design tier published?", "does the
            # drift-watch script parse?" -- shell out to one or the other, and on
            # this leg they were failing with `FileNotFoundError: 'git'` while
            # reporting themselves as assertion failures about the repository. A
            # guard that cannot run its own probe must not look like a guard that
            # ran and found something. portaudio backs sounddevice, which dlopen's
            # it at import; rust is for the cryptography source build below.
            #
            # ffmpeg is the interesting one. `recimport/audio_io.load_audio`
            # decodes through faster-whisper's bundled PyAV and falls back to a
            # system ffmpeg subprocess -- and this is the only leg in CI where that
            # fallback can ever be taken, because every other one has PyAV. Without
            # ffmpeg here the fallback has no fallback, and ~21 tests failed with
            # "Could not decode ...: No module named 'faster_whisper'. Install
            # ffmpeg for broader format support." -- the code correctly naming its
            # own missing prerequisite while the job was read as a FreeBSD defect.
            # With it, those tests run for real and the documented fallback finally
            # has coverage somewhere.
            pkg install -y python3 portaudio rust git bash ffmpeg
            PYV=$(python3 -c 'import sys; print(f"{sys.version_info[0]}{sys.version_info[1]}")')
            python3 -V
            # These four are the ones a source build would make unaffordable or
            # impossible, so they come from pkg and a missing one must fail loudly.
            pkg install -y "py${PYV}-pip" "py${PYV}-sqlite3" \
                           "py${PYV}-numpy" "py${PYV}-sounddevice"
            # pillow and scipy only widen coverage, so they are installed one at a
            # time and allowed to be absent -- `pkg install` is all-or-nothing, and
            # one unavailable name in a combined command aborts `prepare` and ends
            # the job before a single test runs. That is not hypothetical: this list
            # carried `py${PYV}-yaml`, which ports MOVED renamed to py-pyyaml on
            # 2024-07-07, and the stale name took the whole FreeBSD leg down with
            # "No packages available to install matching" -- a port rename reported
            # as though the platform itself were broken. Every test that needs
            # Pillow already goes through `importorskip`, so a rename here now costs
            # a few skips instead of the run.
            for opt in "py${PYV}-pillow" "py${PYV}-scipy"; do
              pkg install -y "$opt" || echo "optional port $opt unavailable -- the tests that need it will skip"
            done
          run: |
            set -e
            python3 -V
            # `--without-pip --system-site-packages`: the port is built
            # `--without-ensurepip`, so a plain venv cannot create pip at all.
            # Borrowing the pkg-installed pip through system-site-packages is the
            # FreeBSD idiom, and installs still land in the venv because
            # VIRTUAL_ENV points here. `dev` is a PEP 735 dependency-group, NOT an
            # extra, so `.[dev]` does not exist — the test deps are named explicitly.
            python3 -m venv --without-pip --system-site-packages /tmp/venv
            . /tmp/venv/bin/activate
            # `--no-deps` is the whole reason this job can finish. A plain
            # `pip install -e .` resolves `faster-whisper`, which needs
            # `ctranslate2`, and PyPI has **neither a FreeBSD wheel nor an sdist**
            # for it — pip reports `from versions: none`, so there is nothing to
            # build from either. Every run of this job failed there, for weeks,
            # before a single test executed. A check that can only ever be red
            # teaches people to stop reading CI, which costs more than the
            # coverage it was meant to add.
            #
            # The coverage this job actually exists for does not need any of that.
            # `platform/bsd/` is composed from the Linux backend, and the claim
            # under test is that FreeBSD really selects and builds it — that needs
            # `sys.platform` to genuinely be `freebsdN`, not the transcription
            # stack.
            python -m pip install -e . --no-deps
            # pyyaml and click come from pip rather than pkg, and they are named
            # rather than inherited. Thirteen test files `import yaml` at module
            # scope and one imports `click`, so a missing one is a COLLECTION ERROR
            # rather than a skip -- neither is optional here. Both used to arrive as
            # transitive dependencies and both stopped: pinning yaml to a ports name
            # broke this job when devel/py-yaml was renamed, and click was riding on
            # typer, which dropped it at 0.27.2. This leg is the only environment
            # that installs test dependencies by name instead of from the `dev`
            # group, so it is the only one where such a drop shows up as red.
            # pytest-timeout is named by `required_plugins` in pyproject.toml, so
            # pytest refuses to start without it; tests/test_pytest_config.py
            # keeps this line and that list in step.
            python -m pip install platformdirs typer click pytest pytest-mock pytest-xdist pytest-timeout hypothesis pyyaml
            # `cryptography` is the learning corpus's AES-256-GCM cipher, and 151
            # tests reach it. There is no FreeBSD wheel, so it builds through
            # maturin — which is what the `rust` package above is for — in about
            # five minutes. Ports carries py-cryptography 48.0.1 against this
            # project's `>=50.0.0`, so the binary port cannot stand in for it;
            # re-check when ports catches up and this line can become a `pkg`.
            python -m pip install cryptography
            # Twenty repo-hygiene guards shell out to git, and on this leg every
            # one of them failed with `git ... returned non-zero exit status 128`
            # -- with git installed. 128 is git's catch-all, so the message names
            # no cause, and `capture_output=True` in the tests swallows the line
            # that would: `test_the_dry_run_helper_is_still_unwired` runs git with
            # `check=False` and therefore reported "dryrun_wrap is now referenced
            # from []", an assertion about the source tree, from a git that never
            # ran. A guard that cannot execute its own probe must not read as a
            # guard that ran and found something.
            #
            # So: print git's actual complaint once, before the suite, where it
            # appears in the log as itself rather than as twenty unrelated
            # findings. `|| true` throughout -- this block diagnoses, it must never
            # be the thing that ends the run.
            echo "--- git diagnosis (advisory) ---"
            git --version || true
            ls -ld "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" 2>&1 || true
            id || true
            git -C "$GITHUB_WORKSPACE" ls-files -- pyproject.toml 2>&1 | head -5 || true
            git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree 2>&1 | head -5 || true
            # The most likely cause, and harmless if it is not: git refuses to
            # operate on a repository owned by another user, and this workspace is
            # created on the Linux host and rsynced into the guest, where the
            # numeric owner need not map to the user running the tests. The host
            # runner's checkout step does exactly this for itself
            # (`git config --global --add safe.directory <workspace>`); the guest
            # has its own git and its own global config and inherits neither.
            # Scoped to this workspace rather than `*`, so it fixes the path in
            # question without disarming the protection for anything else.
            git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
            echo "--- after safe.directory ---"
            git -C "$GITHUB_WORKSPACE" ls-files -- pyproject.toml 2>&1 | head -5 || true
            echo "--- end git diagnosis ---"
            # Run the whole suite, not one file.
            #
            # This used to be `pytest tests/test_platform_bsd_and_fallback.py`, on
            # the reasoning that most of the suite imports the transcription stack.
            # That reasoning was measured and is mostly wrong: the decoder is
            # reached by a *small* set of files. Forty-eight tests on one file is
            # close enough to no coverage that the ⚗️ row in
            # docs/platform-support.md was resting on very little.
            #
            # Measured on the real VM, not estimated, across three runs:
            #
            #   48 executed          the old one-file command
            #   14,212 pass / 96 red  first whole-suite run
            #   14,260 pass / 20 red  after the decoder markers + missing programs
            #   14,304 pass /  0 red  after the safe.directory fix (run 33320909064)
            #
            # The 96 were three causes and not one defect between them:
            #   * 23 were `git` and `bash` missing from the VM image (fixed in
            #     `prepare` above);
            #   * 20 were the PyAV→ffmpeg decode fallback with no ffmpeg to fall
            #     back to (same);
            #   * 50 were the decoder stack, which genuinely cannot be installed
            #     here. Those tests now carry a `tests/decoder_stack.py` marker and
            #     skip on this platform alone — see that module for why a
            #     module-scope `pytest.importorskip` was the wrong instrument for
            #     most of them (#306).
            #
            # A new test that reaches the decoder and forgets the marker fails
            # loudly here rather than quietly reducing coverage, which is the
            # property worth keeping.
            #
            # This leg has already paid for itself twice: widening it surfaced
            # `ydotool_key_args` importing evdev — a Linux-only C extension — on a
            # path `platform/bsd/` reaches, which broke every spoken command and
            # every backspace on a FreeBSD Wayland desktop; and it is the only
            # environment in CI that installs the test dependencies by name, which
            # is how `click` disappearing from typer's dependency list was caught.
            #
            # In parallel, like the matrix above: run serially this leg reached
            # 98% and was killed by its 45-minute limit (6a57a468; again on 92ad3c89
            # and b237c1bc).
            python -m pytest tests/ -q -rf -n auto --dist worksteal

  # The benchmark harness's own tests. `uv sync` installs the base dependencies
  # only, so `psutil`, `jiwer` and `whisper-normalizer` -- all in the `benchmark`
  # dependency *group* -- are absent in the `test` job above. Seven tests raised
  # ModuleNotFoundError there, which turned `main` red and skipped the
  # `publish-pypi` step of a tagged release.
  #
  # `tests/benchmark_deps.py` now makes those tests skip when the group is
  # missing, which fixes the red but would leave the harness tested nowhere:
  # `benchmark.yml` is `workflow_dispatch` only, because it downloads 346 MB of
  # LibriSpeech and decodes for tens of minutes. This job is the cheap half --
  # the group is five small pure-Python-ish wheels, no corpus, no checkpoints --
  # so the tests that guard the harness actually execute on every push.
  benchmark-harness:
    name: Benchmark harness tests
    needs: changes
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    # Healthy runs take under a minute; the limit only ends a hang (CI_POLICY.md §8).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies (with the benchmark group)
        run: uv sync --group benchmark

      - name: The benchmark dependencies must actually be importable
        # Without this the tests skip and the job passes green having tested
        # nothing -- the same failure mode the `gui` job guards against, and the
        # reason this job exists rather than trusting the skip to be temporary.
        run: uv run python -c "import psutil, jiwer, whisper_normalizer, soundfile"

      - name: Run the benchmark harness tests
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest -v -rs \
            tests/test_bench_provenance.py \
            tests/test_bench_wer_split.py \
            tests/test_bench_diarization_scoring.py \
            tests/test_bench_persian.py \
            tests/test_bench_persian_manifest.py \
            tests/test_fa_manifest.py \
            tests/test_wer_normalizer_vectors.py

  # ADR-027's one-click Windows update, executed for real. The unit tests prove the
  # job's decisions and text with an injected launcher, opener and spawn -- and the
  # first version passed every one of them while it could never have worked (the
  # release API answered 415 to a header no test saw). This runs the real detached
  # `powershell.exe -EncodedCommand` job from the real WindowsUpdateLauncher against a
  # fake release on 127.0.0.1, with a compiled stand-in installer, and checks that it
  # waits for YazSes to exit, re-checks the SHA-256, runs the installer with the
  # in-place switches, records the exit code and relaunches -- plus the failing,
  # tampered and stuck cases. Lane: specialized platform (CI_POLICY.md section 1).
  # No network beyond 127.0.0.1, no secrets, read-only token.
  #
  # ADVISORY (`continue-on-error: true`, not a ci-gate need) because it has never run:
  # a brand-new Windows job must not turn every PR red on its first execution
  # (CI_POLICY.md section 9). PROMOTE it -- delete `continue-on-error` and add it to
  # ci-gate's `needs` -- once it has passed on three consecutive pushes to main.
  # Owner of a persistent failure: whoever owns ADR-027.
  #
  # Full lane only (CI_POLICY.md section 5), like the advisory `freebsd` leg: a
  # docs-only PR has nothing this job could catch. Pushes to main always take the
  # full lane, so the three-pushes promotion rule above still counts every push.
  windows-update-handoff:
    name: Windows one-click update hand-off (real PowerShell)
    needs: changes
    if: needs.changes.outputs.full != 'false'
    runs-on: windows-latest
    # PROMOTE WHEN: passed on three consecutive pushes to main -- delete this and add the
    # job to ci-gate's needs (see the comment above the job).
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run the hand-off end to end against a local fake release
        run: uv run python scripts/check_windows_update_handoff.py

  # ── The one stable check branch protection requires (#462, ADR-024 §9) ──────
  #
  # Every other check name in this file is generated by a matrix and changes the
  # moment a leg is added or renamed, so a ruleset that listed them would either
  # drift or have to be edited on every matrix change. This job is the stable
  # name: its success means every BLOCKING job above succeeded on this commit.
  #
  # The contract, enforced by tests/test_ci_gate.py:
  #
  # * `needs` lists every job in this file EXCEPT the advisory ones. A job is
  #   advisory exactly when it declares a literal `continue-on-error: true`
  #   (today: `freebsd`), so an advisory job can never turn this gate red. The
  #   test derives both sets from this file, so a new job that is not listed
  #   here fails the suite instead of silently going unrequired.
  # * `if: always()`, never `!cancelled()` or a path condition. A required check
  #   that is SKIPPED reports "Success" and does not block a merge (GitHub docs,
  #   "Using conditions to control job execution"), so a gate that can skip is a
  #   gate that can pass without evidence. With always() it runs whatever
  #   happened upstream and reports a real verdict.
  # * It passes only when every need's result is literally `success`, with ONE
  #   exception: a full-lane job (one whose `if:` is exactly
  #   `needs.changes.outputs.full != 'false'`) may be `skipped` when the lane
  #   decision is literally `false` (#535, CI_POLICY.md section 5). `failure` and
  #   `cancelled` always fail it, and so does any other skip: a blocking job that
  #   skipped when it should have run proved nothing. A decision that is neither
  #   `true` nor `false` (the classifier crashed or printed nothing) fails it too.
  #   (A superseded PR head's run is cancelled, so its gate fails on the OLD
  #   commit; the ruleset only ever reads the gate on the current head.)
  #   tests/test_ci_lanes.py checks the script's FULL_LANE set against the jobs
  #   that are actually gated on the decision.
  # * This workflow has no `paths`/`paths-ignore` filter, so the gate is present
  #   on every PR to main and can never sit "pending" waiting for a run that a
  #   filter suppressed. Do not add one (CI_POLICY.md sections 4 and 6).
  #
  # The `test` matrix's arm64 leg is advisory INSIDE a blocking job (its
  # `continue-on-error` is an expression, not `true`). GitHub does not document
  # how such a leg's failure shows in `needs.test.result`; if it shows as
  # `failure`, this gate fails closed, which is the safe direction.
  # CI_POLICY.md section 6 records this.
  #
  # No checkout: the verdict is computed from the `needs` context alone, and
  # nothing from the pull request's tree is executed here.
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - repo-hygiene
      - test-linux
      - test
      - gui
      - extras
      - benchmark-harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every blocking job succeeded
        # The results arrive through an environment variable, never through
        # `${{ }}` inside the script body (CI_POLICY.md section 7, rule 4).
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
        shell: python3 {0}
        run: |
          import json
          import os
          import sys

          # The jobs that run only on the full lane, so may skip when it is off.
          FULL_LANE = {"test", "gui", "extras", "benchmark-harness"}

          full = os.environ.get("FULL", "")
          if full not in ("true", "false"):
              # A classifier that crashed or printed nothing must not read as
              # "the fast lane was enough".
              print(f"::error::the lane decision is {full!r}, not 'true' or 'false'")
              sys.exit(1)

          try:
              needs = json.loads(os.environ.get("NEEDS_JSON") or "null")
          except ValueError as exc:
              print(f"::error::ci-gate could not parse the needs context: {exc}")
              sys.exit(1)
          if not isinstance(needs, dict) or not needs:
              # An empty verdict is not a green one.
              print("::error::ci-gate received no job results; refusing to pass.")
              sys.exit(1)

          failed = []
          for job in sorted(needs):
              entry = needs[job]
              result = entry.get("result") if isinstance(entry, dict) else None
              print(f"{job}: {result}")
              if result == "success":
                  continue
              if result == "skipped" and job in FULL_LANE and full == "false":
                  continue
              failed.append(f"{job}={result}")

          if failed:
              print("::error::blocking job(s) did not succeed: " + ", ".join(failed))
              sys.exit(1)
          lane = "full" if full == "true" else "fast + Linux baseline"
          print(f"ci-gate: all {len(needs)} blocking jobs succeeded or were not selected ({lane}).")
