name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: this workflow only reads the repo and runs the suite. It never
# publishes, comments, or writes a check. (The release/publish workflows need more
# and declare their own — do not copy this block into them blindly.)
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Run Qt (PySide6 overlay) headless in CI — no display server needed.
  QT_QPA_PLATFORM: offscreen

jobs:
  repo-hygiene:
    # Cheap and Linux-only: a large file costs every future clone permanently, and the
    # only inexpensive moment to catch one is before the commit lands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No oversized files in the repo
        run: python3 scripts/check_repo_size.py

      - name: Install system dependencies (Linux)
        # Just enough for `import yazses.core.daemon` (sounddevice dlopen's this at
        # import time) — the dependency budget check below imports it on a base
        # install. No Qt libs needed: PySide6 is not imported at daemon module scope.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Dependency budget
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: uv run python scripts/check_dependency_budget.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v
