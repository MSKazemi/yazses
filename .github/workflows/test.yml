name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: this workflow only reads the repo and runs the suite. It never
# publishes, comments, or writes a check. (The release/publish workflows need more
# and declare their own — do not copy this block into them blindly.)
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Run Qt (PySide6 overlay) headless in CI — no display server needed.
  QT_QPA_PLATFORM: offscreen

jobs:
  repo-hygiene:
    # Cheap and Linux-only: a large file costs every future clone permanently, and the
    # only inexpensive moment to catch one is before the commit lands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No oversized files in the repo
        run: python3 scripts/check_repo_size.py

      # Read-only: reports translation drift, never edits a translation. English is
      # the source of truth and the translations are native human work, so the fix
      # always belongs to someone who reads the language.
      - name: README translations have not drifted
        run: python3 scripts/check-translations.py

      - name: Install system dependencies (Linux)
        # Just enough for `import yazses.core.daemon` (sounddevice dlopen's this at
        # import time) — the dependency budget check below imports it on a base
        # install. No Qt libs needed: PySide6 is not imported at daemon module scope.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Dependency budget
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        # Values are passed as env vars and read as shell variables, never interpolated
        # into the script body — a label is attacker-adjacent text and `${{ }}` inside
        # `run:` is how that becomes a shell injection.
        run: |
          # The growth check compares against the baseline as it exists on the base
          # branch, so a PR cannot wave through a new dependency by rewriting the
          # baseline in the same commit. A shallow checkout has no base branch ref, so
          # fetch that one commit; the check says so out loud if this fails.
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          fi
          uv run python scripts/check_dependency_budget.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `requires-python = ">=3.11"`, so every version from 3.11 up is a version
        # users install on. Stopping the matrix at 3.12 meant a break on a newer
        # interpreter reached a user before it reached CI — which is exactly how
        # 3.13's new class dunders (`__firstlineno__`, `__static_attributes__`)
        # broke a test that nothing here could see. 3.13 and 3.14 run on Linux
        # only: the failure mode being caught is interpreter behaviour, not OS
        # behaviour, and a full 3x5 matrix buys nothing for the runtime it costs.
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags, not just the commit. The packaging-manifest guards compare
          # scoop/chocolatey/winget against the latest release *tag*, and with
          # no tags fetched they hit their "shallow clone" skip and passed
          # silently -- so the guard meant to stop a stale manifest reaching a
          # package manager has never once been enforced in CI.
          fetch-depth: 0
          filter: tree:0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

  freebsd:
    # Runs the suite on a REAL FreeBSD VM, not a simulated `sys.platform`.
    #
    # `src/yazses/platform/bsd/` is composed from the Linux backend on the
    # argument that those components are genuinely portable (platformdirs/XDG
    # paths, evdev, ports-provided injection tools, Unix-socket IPC). That
    # argument is only worth as much as an execution on the real thing — the
    # unit tests can prove the wiring, never the assumption underneath it.
    #
    # GitHub has no BSD runners, so this drives a FreeBSD guest inside the Linux
    # runner. It is deliberately ADVISORY (`continue-on-error`) until it has been
    # green for a few runs: a brand-new cross-OS job that has never executed must
    # not be able to turn `main` red on its first PR. Promote it to blocking —
    # and upgrade the ⚗️ row in docs/platform-support.md to ✅ — once it is
    # reliably passing.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run the test suite on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          usesh: true
          # python311 = the floor this project supports; py311-sqlite3 is a separate
          # port on FreeBSD and the learning corpus needs it. portaudio backs
          # sounddevice, which dlopen's it at import time.
          prepare: |
            pkg install -y python311 py311-sqlite3 py311-pip portaudio
          run: |
            set -e
            python3.11 -V
            # A venv, not --break-system-packages: FreeBSD's python311 port may
            # ship a PEP 668 EXTERNALLY-MANAGED marker, and a venv is correct
            # either way. `dev` is a PEP 735 dependency-group, NOT an extra, so
            # `.[dev]` does not exist — the test deps are named explicitly.
            python3.11 -m venv /tmp/venv
            . /tmp/venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e .
            python -m pip install pytest pytest-mock hypothesis
            # The platform-selection tests are the point of this job: they must
            # run natively, where sys.platform really is freebsdN rather than
            # monkeypatched.
            python -m pytest tests/test_platform_bsd_and_fallback.py -v
            # Then the whole suite, to find out what else BSD breaks.
            python -m pytest tests/ -q
