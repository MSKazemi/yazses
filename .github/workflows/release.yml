name: Release

on:
  push:
    tags:
      # `v*`, never a list of majors: an enumeration has to be extended by
      # hand at each bump, and the failure is silent -- no job runs, so the tag
      # looks successful while nothing publishes. `ppa.yml` died that way.
      - "v*"
  workflow_dispatch: {}  # allow a manual re-publish from main (e.g. after a CI fix)

# Least privilege: read-only by default. The only job that needs write is
# release-linux (it creates the GitHub Release); publish-pypi and the owner-gated
# publish-mcp-registry use OIDC.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 65   # slowest of the last 15 runs: 20.4 min (serial suite) (CI_POLICY §8)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          python-version: "3.12"

      - run: uv sync

      - run: uv run pytest tests/ -v

  publish-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # slowest of the last 15 runs: 0.7 min (CI_POLICY §8)
    needs: test
    environment: pypi
    permissions:
      # A job-level permissions block REPLACES the defaults, so contents:read
      # must be listed explicitly or actions/checkout cannot clone this private
      # repo ("repository not found", exit 128). This is why PyPI publishing
      # silently broke from v0.5.1 onward.
      contents: read
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations, signed with the same OIDC identity that publishes.
          # They are the default with trusted publishing; stated explicitly so a
          # future default change cannot silently drop them.
          attestations: true
          # Make manual re-publishes idempotent: skip a version already on PyPI
          # rather than failing the job with "file already exists".
          skip-existing: true

  publish-mcp-registry:
    # ADR-032 §2 (#639): list `yazses mcp-server` in the official MCP registry
    # (registry.modelcontextprotocol.io) as io.github.MSKazemi/yazses, pointing at
    # this release's PyPI package. The registry stores metadata only.
    #
    # OFF BY DEFAULT, because publishing to the registry is outward-facing. The job
    # runs only after the owner sets the repository variable MCP_REGISTRY_PUBLISH to
    # `true` (Settings -> Secrets and variables -> Actions -> Variables). While it is
    # unset the job is skipped and a release does exactly what it did before.
    #
    # It must never decide whether the RELEASE succeeded. apt-repo.yml runs only when
    # this workflow run concludes `success`, and checksums.yml waits while this run is
    # queued, in progress or `waiting`. So the job is `continue-on-error`, and the
    # `mcp-registry` environment must NOT get a required reviewer: a pending approval
    # would hold the run, and with it the APT repository and SHA256SUMS.txt.
    #
    # It needs no secret: `mcp-publisher login github-oidc` trades this job's OIDC
    # token for the namespace of the token's `repository_owner`, io.github.MSKazemi/*.
    # It runs after publish-pypi because the registry fetches
    # https://pypi.org/pypi/yazses/<version>/json and rejects the publish unless that
    # version exists and its description (README.md) carries
    # `mcp-name: io.github.MSKazemi/yazses`. The steps by hand, and the recovery
    # when this job fails, are in packaging/README.md ("MCP bundle and MCP registry").
    if: github.ref_type == 'tag' && vars.MCP_REGISTRY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # waits up to 15 min for PyPI (SECONDS + 900) + 15; no measured run yet (CI_POLICY §8 rules 1, 3)
    needs: publish-pypi
    # REMOVE WHEN: nothing waits on the Release run any more (apt-repo.yml and checksums.yml
    # both chain on it today), or the registry publish has moved to its own workflow.
    continue-on-error: true
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write  # mcp-publisher login github-oidc
    env:
      # Pinned and content-checked, never `releases/latest`. To upgrade, take the
      # new linux_amd64 line from that release's registry_<version>_checksums.txt.
      MCP_PUBLISHER_VERSION: v1.8.6
      MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Refuses a tag that is not v<pyproject version>, and a README without the
      # marker, before anything is downloaded or published.
      - name: Render server.json from the tagged source
        run: |
          set -euo pipefail
          python3 scripts/render-mcp-server-json.py --out-dir mcp-registry \
            --expect-tag "$GITHUB_REF_NAME" --check-readme
          cat mcp-registry/server.json

      - name: Wait until PyPI serves this version with the ownership marker
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/yazses/${GITHUB_REF_NAME#v}/json"
          deadline=$(( SECONDS + 900 ))
          until curl -fsSL "$url" -o pypi.json \
              && python3 scripts/render-mcp-server-json.py --expect-tag "$GITHUB_REF_NAME" \
                   --check-pypi-json pypi.json; do
            if (( SECONDS >= deadline )); then
              echo "::error::$url did not show this version with the mcp-name marker within 15 minutes"
              exit 1
            fi
            sleep 30
          done

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --version

      - name: Publish to the MCP registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp-registry/server.json

  build-deb:
    # One .deb per architecture. This used to be a single amd64 job fused with
    # the release-creation step, so `yazses_<v>_amd64.deb` was the ONLY Debian
    # artifact that ever existed — an arm64 machine (Raspberry Pi, Ampere, arm64
    # VM) had no .deb and no APT package at all, even though
    # `scripts/update-apt-repo.sh` has always declared
    # `Architectures "amd64 arm64 all"` and scans whatever is in the pool.
    #
    # build-deb.sh needs no change: it reads `dpkg --print-architecture`, so on
    # a native arm64 runner it names the package correctly by itself.
    #
    # fail-fast is off so one architecture failing cannot cancel the other and
    # ship a release that silently lost an arch.
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build-deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10   # slowest of the last 15 runs: 0.6 min (CI_POLICY §8)
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build tools
        run: sudo apt-get install -y dpkg-dev

      # build-deb.sh regenerates man/yazses.1 so the .TH version stamp matches
      # the tag being released. That needs `yazses` importable; without this
      # step the script falls back to the committed copy and ships a stale
      # version string.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          python-version: "3.12"

      - name: Sync environment (for man page generation)
        run: uv sync

      - name: Build .deb
        run: |
          chmod +x scripts/build-deb.sh
          bash scripts/build-deb.sh

      # The filename carries the architecture dpkg actually reported. A wrong
      # runner label would otherwise produce two amd64 .debs and quietly ship a
      # release that looks dual-arch and is not.
      - name: Verify the build really is ${{ matrix.arch }}
        run: |
          ls -1 *.deb
          test -f "$(ls -1 *_${{ matrix.arch }}.deb 2>/dev/null | head -1)" || {
            echo "::error::expected a ${{ matrix.arch }} .deb, built: $(ls -1 *.deb | tr '\n' ' ')"
            exit 1
          }

      - name: Upload .deb artifact
        # Feeds both the GitHub Release job below and the APT repo workflow.
        # Arch-qualified: two matrix jobs uploading one artifact name collide.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-package-${{ matrix.arch }}
          path: "*.deb"
          if-no-files-found: error

  release-linux:
    # Creates the GitHub Release from every architecture built above. Split out
    # of the build job so the release is created exactly once no matter how many
    # architectures the matrix grows to — two matrix jobs both calling
    # action-gh-release would race on the same tag.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # slowest of the last 15 runs: 0.2 min (CI_POLICY §8)
    needs: build-deb
    permissions:
      contents: write      # softprops/action-gh-release creates the Release
      # Build provenance: an attestation says "this exact .deb was produced by this
      # workflow, from this commit". Without it a downloaded binary is only as
      # trustworthy as the hosting, which for a tool people run against everything
      # they say is not good enough (OpenSSF Signed-Releases, #116).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download every architecture's .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deb-package-*
          merge-multiple: true

      # ADR-032 §1: the one-click MCP bundle. Built here, from the tagged checkout
      # above (this job runs on tags only), by a standard-library script under the
      # runner's own python3, so nothing is installed and no new action is needed.
      # The build is byte-for-byte reproducible, which is what lets SHA256SUMS.txt
      # (checksums.yml) vouch for it. `--expect-tag` refuses to build unless
      # pyproject.toml's version is this tag's: a tag on an unbumped commit would
      # otherwise ship a bundle whose manifest names the previous release.
      - name: Build the MCP bundle (.mcpb) from the tagged source
        run: |
          set -euo pipefail
          python3 scripts/build-mcpb.py --out-dir . --expect-tag "$GITHUB_REF_NAME"
          test -f "yazses-${GITHUB_REF_NAME#v}.mcpb"

      - name: Show what will be attached
        run: ls -lh *.deb *.mcpb

      - name: Attest build provenance for every .deb
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.deb"

      # The attestation above is real and `gh attestation verify` finds it, because
      # it lives in GitHub's attestations API. OpenSSF Scorecard's Signed-Releases
      # check does not look there: it reads the *filenames of the last five
      # releases' assets* and counts `.asc`, `.sig`, `.sign`, `.minisig`,
      # `.sigstore`, `.sigstore.json` and `.intoto.jsonl`. So the work was done, the
      # check stayed at 0/10, and #116 recorded it as finished. Attaching the bundle
      # is what closes the gap — and it is worth doing on its own merits, since a
      # user who has downloaded a tarball offline can verify it without an API call.
      - name: Attach the provenance bundle as a release asset
        run: cp "${{ steps.attest.outputs.bundle-path }}" "yazses-${GITHUB_REF_NAME#v}-deb.intoto.jsonl"

      # Its own attestation and its own bundle, as each platform's assets have, so
      # `-deb.intoto.jsonl` keeps meaning what its name says. scripts/verify-provenance.py
      # derives the attested suffixes from these `subject-path:` lines, so
      # release-complete.yml now requires a servable attestation for the .mcpb too.
      # The .deb bundle is copied above before this step runs, so it cannot matter
      # whether the action reuses one bundle path between steps.
      - name: Attest build provenance for the MCP bundle
        id: attest-mcpb
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.mcpb"

      - name: Attach the MCP bundle's provenance as a release asset
        env:
          BUNDLE: ${{ steps.attest-mcpb.outputs.bundle-path }}
        run: cp "$BUNDLE" "yazses-${GITHUB_REF_NAME#v}-mcpb.intoto.jsonl"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            *.deb
            *.mcpb
            *.intoto.jsonl
          generate_release_notes: true
          body: |
            Local, offline voice dictation. **Hold a key, speak, release.** No cloud, no GPU.

            ### Verify your download

            `SHA256SUMS.txt` below lists the hash of every artifact in this release.
            How to check it, how release binaries are signed, and who approves a
            signing request: **[Code signing policy & verification](https://mskazemi.com/yazses/code-signing.html#code-signing-policy)**.

            ## macOS

            Download the `.dmg` for your Mac from the Assets below — `…-macos-arm64.dmg`
            for Apple Silicon, `…-macos-x86_64.dmg` for Intel — open it, and drag
            **YazSes.app** into **Applications**.

            Not sure which? Run `uname -m` in Terminal. If no Intel `.dmg` is attached,
            that build did not succeed for this release; `pipx install yazses` works on
            both architectures.

            On first launch, **right-click → Open** (this build is not code-signed
            yet — verify it with the attestation linked above instead). Grant
            **Accessibility** + **Microphone** when prompted.
            Default hotkey: **Right Option**. Full guide: `docs/macos-install.md`.

            ## Windows

            Download `…-windows-x64.exe` from the Assets below. It is the installer for
            an Intel or AMD PC, and it also runs on an ARM PC (Snapdragon, Surface Pro X
            and similar) under Windows' emulation: there is no native ARM build because
            the speech engine publishes no ARM Windows wheel yet.

            SmartScreen may say *"unrecognized app"* — click **More info → Run anyway**
            (this build is not code-signed yet — verify it with the attestation linked
            above instead). Default hotkey: **Right Ctrl**. Full guide:
            `docs/windows-install.md`.

            ## Linux

            **One-line installer (Debian/Ubuntu):**
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/MSKazemi/yazses/main/install.sh)
            ```

            **APT repository:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/MSKazemi/yazses/gh-pages/apt/KEY.gpg \
              | sudo gpg --dearmor --yes -o /usr/share/keyrings/yazses.gpg
            echo "deb [signed-by=/usr/share/keyrings/yazses.gpg] https://raw.githubusercontent.com/MSKazemi/yazses/gh-pages/apt ./" \
              | sudo tee /etc/apt/sources.list.d/yazses.list
            sudo apt update && sudo apt install yazses
            sudo usermod -aG input $USER && logout
            systemctl --user enable --now yazses.service
            ```

            **Snap:**
            ```bash
            sudo snap install yazses --classic
            sudo usermod -aG input $USER && logout
            ```

            **pipx (any Linux):**
            ```bash
            sudo apt install pipx libportaudio2 xdotool xclip
            sudo usermod -aG input $USER && logout
            pipx install yazses && pipx ensurepath
            systemctl --user enable --now yazses.service
            ```

            **.deb package:**
            ```bash
            sudo apt install ./yazses_*.deb
            sudo usermod -aG input $USER && logout
            systemctl --user enable --now yazses.service
            ```

            Default hotkey on Linux: **Right Alt** (configurable). Default config lives
            at `~/.config/yazses/config.toml`.

            ## AI assistants (MCP)

            `yazses-<version>.mcpb` in the Assets below connects YazSes to a desktop MCP
            client: open the file with the client. It contains no copy of YazSes; it runs
            the `yazses mcp-server` command of the YazSes you installed above, so install
            that first. If your client does not accept the bundle, add the server by hand.
            Guide: `docs/how-to/connect-mcp-client.md`.
