# Regenerate the committed SBOM on a Dependabot lockfile PR.
#
# `sbom.cdx.json` is generated from `uv.lock` and committed, because
# docs/privacy-statement.md and docs/comparison.md point people at it as a file
# they can read in the repository. `tests/test_sbom.py` fails when the two drift,
# and that guard is right: a stale SBOM is worse than none, because it is trusted.
#
# The consequence nobody wired up: Dependabot edits `uv.lock` and nothing else, so
# **every** uv update PR fails that guard the moment it is opened. #320 and #321 both
# died on exactly one assertion out of 13,805 tests. A PR that cannot be green without
# a human pushing a follow-up commit is a PR that does not land, which is how a
# dependency backlog builds up while the automation looks like it is working.
#
# So regenerate it here and push it onto Dependabot's own branch, before the reviewer
# ever sees red.
#
# `pull_request_target` rather than `pull_request` on purpose: GitHub gives a
# Dependabot-triggered workflow a **read-only** token, so the `pull_request` form
# cannot push the fix it just computed. `pull_request_target` runs in the base-branch
# context with a normal token. That form is a known footgun when it runs untrusted
# code, so this job is gated on the PR author being Dependabot itself -- an identity
# no outside contributor can forge, because only GitHub's own Dependabot can open a
# PR as `dependabot[bot]` -- and it runs exactly one stdlib-only script.
name: Dependabot SBOM refresh

#
# `workflow_dispatch` exists because `pull_request_target` only fires on a pull-request
# event, and a pull request opened *before* this workflow existed will never see one
# again -- no rebase, no new commit, no trigger. #320 and #321 were both in exactly that
# state: open, red on the SBOM assertion alone, and unreachable by the fix written for
# them. Without a manual entry point the only remedies are a `@dependabot rebase` comment
# or closing and reopening the PR, which throws away its review history.
on:
  pull_request_target:
    paths:
      - "uv.lock"
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of an open Dependabot lockfile PR to refresh."
        required: true
        type: string

# Nothing at the top, deliberately. This workflow runs on `pull_request_target`, which
# means its token can write to this repository, and a top-level grant hands that token
# to *every* job in the file -- including one added later by somebody who read the job
# they were adding and not this block. The single job that needs to push asks for it
# itself, a few lines down.
#
# `{}` rather than `contents: read` so that a future job which quietly relies on
# inheriting something fails loudly at the step that needs it, instead of half-working.
permissions: {}

jobs:
  refresh-sbom:
    # Job-level permissions REPLACE the top-level block rather than merging with it,
    # so everything this job uses has to be listed here.
    permissions:
      # The point of the job: add one commit to Dependabot's own branch.
      contents: write
      # Read the pull request to confirm its author, its head repository and that it
      # is open -- checked against the API before anything is checked out.
      pull-requests: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Resolve *and authorise* the target before anything is checked out. On the
      # `pull_request_target` path the job-level `if` has already established the
      # author; on the dispatch path it cannot, because there is no pull request in
      # the event payload -- only a number somebody typed. Both are re-checked here
      # against the API rather than the payload, so the branch this job is about to
      # check out with a writable token is known to be Dependabot's own.
      #
      # `head.repo.full_name` is checked too: Dependabot's branches live in this
      # repository, and checking out a fork's head with `persist-credentials` would
      # hand a push-capable token to code from outside it.
      - name: Resolve and authorise the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$NUMBER" in
            ''|*[!0-9]*) echo "::error::'$NUMBER' is not a pull request number."; exit 1 ;;
          esac
          # Captured first, then split on tabs only: with the default IFS a `read`
          # would also split on spaces, and under `set -e` a `read` that hits EOF
          # without a trailing newline would abort the step rather than report.
          meta=$(gh api "repos/${{ github.repository }}/pulls/$NUMBER" \
            --jq '[.user.login, .head.repo.full_name, .head.ref, .state] | @tsv')
          IFS=$'\t' read -r author head_repo head_ref state <<<"$meta"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "::error::PR #$NUMBER was opened by '$author', not dependabot[bot]."
            exit 1
          fi
          if [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "::error::PR #$NUMBER's head is in '$head_repo', not this repository."
            exit 1
          fi
          if [ "$state" != "open" ]; then
            echo "::error::PR #$NUMBER is $state; nothing to push to."
            exit 1
          fi
          echo "ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "Refreshing the SBOM on #$NUMBER ($head_ref)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR's own branch: this job's whole purpose is to add a commit to it.
          # Verified above to be a Dependabot branch in this repository.
          ref: ${{ steps.pr.outputs.ref }}
          # A token that can push back. The default checkout token is scoped to the
          # workflow run; `persist-credentials` keeps it for the `git push` below.
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # stdlib only, by design -- `gen-sbom.py` parses `uv.lock` with tomllib and
      # writes JSON, so this needs no dependency install and cannot be poisoned by
      # the very lockfile change it is reacting to.
      - name: Regenerate sbom.cdx.json from the lockfile in this PR
        run: python scripts/gen-sbom.py

      - name: Commit it to the pull request, if it moved
        run: |
          set -euo pipefail
          if git diff --quiet -- sbom.cdx.json; then
            echo "sbom.cdx.json already matches uv.lock — nothing to push."
            exit 0
          fi
          # Sole author of every commit in this repository, CI included.
          git config user.name  "Mohsen Seyedkazemi Ardebili"
          git config user.email "mohsen.seyedkazemi@gmail.com"
          # Named pathspec, never a bare `git commit`: this job must add the SBOM and
          # nothing else, even if some future step leaves something else in the tree.
          git commit -m "chore(deps): regenerate sbom.cdx.json for this lockfile" -- sbom.cdx.json
          git push origin "HEAD:${{ steps.pr.outputs.ref }}"
          # ⚠ What this push does to the PR's checks, measured on #324 rather than
          # assumed. The note here used to say a GITHUB_TOKEN push starts no workflow
          # run at all (GitHub's recursion guard), so the PR would keep showing the
          # result from the head it arrived with. That is not what happens on this
          # repository, and the real behaviour is worse.
          #
          # On #324 the push to `797c2de` *did* create four runs -- Tests, CodeQL,
          # Dependency review, Campaign preflight -- all on the `pull_request` event.
          # Every one of them completed as `action_required`: held, never executed,
          # waiting for a maintainer to press "Approve and run workflows". The reason
          # is the actor. The runs on Dependabot's own head `32e800b8` have
          # `actor: dependabot[bot]` and ran; the runs on the head this step pushes
          # have `actor: github-actions[bot]`, and that actor falls under the
          # approval gate.
          #
          # So the PR shows **no** check results rather than stale ones, and
          # `gh pr checks` answers "no checks reported on the branch" -- which reads
          # like a workflow-configuration bug rather than a queue waiting on a click.
          # The PR sat that way from 2026-08-30 until the runs were approved by hand
          # on 2026-08-31.
          #
          # It is still not a merge hazard: this repository has no required checks
          # (Scorecard reports Branch-Protection 3/10), so nothing merges on the
          # strength of a green tick -- the maintainer reads the run. What the push
          # buys is that the run, once approved, starts from a lockfile and an SBOM
          # that agree. To remove the manual click, push with a PAT or an app token so
          # the actor is not `github-actions[bot]`; that is also what required checks
          # would need.
