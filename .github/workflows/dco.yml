name: DCO

# Contributions are certified with a Developer Certificate of Origin (DCO)
# rather than a CLA: one `Signed-off-by` line, no signing page, no bot
# account, no employer legal review. See DCO.md and CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    # Bots do not sign off, and their commits carry no copyright a human
    # could certify.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check every commit carries a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE" >/dev/null 2>&1 || true

          failed=0
          # --no-merges: a merge commit carries no authored change to certify.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "  ok   ${sha:0:8}  $subject"
            else
              echo "  MISS ${sha:0:8}  $subject   (author: $author)"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'MSG'

          ─────────────────────────────────────────────────────────────────
          One or more commits are missing a Signed-off-by line.

          This project uses a Developer Certificate of Origin instead of a
          CLA. There is nothing to sign and no account to create — you just
          certify that you wrote the change and may submit it. See DCO.md.

          Fix the most recent commit:
              git commit --amend --signoff
              git push --force-with-lease

          Fix every commit on this branch:
              git rebase --signoff origin/main
              git push --force-with-lease

          Sign off automatically from now on:
              git config --global format.signOff true
          ─────────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

          echo "All commits are signed off."
