name: Publish to package channels

# Why this exists
# ---------------
# A tag already builds every artifact and checks that they all shipped
# (release-complete.yml). What it did NOT do is hand those artifacts to the
# package managers -- winget, Chocolatey, Homebrew and the AUR were each updated
# by a person remembering to, which is why at v2.18.2 the repo's own audit found
# five channels still on an older version or absent entirely.
#
# Each channel below publishes itself on a tag.
#
# SECRETS, AND WHY A MISSING ONE IS A SKIP RATHER THAN A FAILURE
# --------------------------------------------------------------
# Every channel needs a credential this repository does not have yet. A job whose
# secret is unset SKIPS with a warning naming the secret, and the summary at the
# end lists them. The alternative -- failing -- would make every release red for a
# reason no code change can fix, and a permanently red pipeline is one nobody
# reads. Add a secret and that channel starts publishing on the next tag with no
# edit here.
#
#   TAP_TOKEN      A FINE-GRAINED PAT, resource owner MSKazemi, scoped to the
#                  single repository MSKazemi/homebrew-yazses, with
#                  Contents: Read and write. Nothing else.
#                  https://github.com/settings/personal-access-tokens/new
#
#                  Not a classic `repo` PAT. That scope grants read/write to
#                  EVERY repository on the account -- 100 of them, 49 private --
#                  so that a workflow can overwrite one cask file in one public
#                  repo. A leaked classic token loses the whole account; a leaked
#                  fine-grained one loses a file that is generated from a public
#                  release anyway.
#
#   AUR_SSH_KEY    Private half of an SSH key registered on the AUR account.
#                  Generate a DEDICATED key rather than reusing a personal one:
#                  ssh-keygen -t ed25519 -f ~/.ssh/aur_yazses -N ""
#
#   CHOCO_API_KEY  From https://community.chocolatey.org/account
#
#   WINGET_TOKEN   Classic PAT with `public_repo`. Fine-grained will not do here:
#                  wingetcreate has to FORK microsoft/winget-pkgs, and forking a
#                  repository the account does not own is outside what a
#                  fine-grained token can be scoped to. `public_repo` still means
#                  write access to every public repo on the account, so treat it
#                  as the most dangerous secret in this list -- give it a short
#                  expiry and re-issue per release rather than leaving it live.
#                  (winget-pkgs also expects a signed installer, so this draws
#                  review until SignPath is in place -- docs/code-signing.md.)
#
# NOT AUTOMATED HERE, AND WHY
# ---------------------------
#   Flathub  - the first submission is a reviewed PR to flathub/flathub against a
#              reserved app ID. Once accepted, updates are PRs to its own repo and
#              can be automated; there is nothing to automate until then.
#              packaging/flatpak/ + flatpak.yml build and test the manifest today.
#   nixpkgs  - same shape: a reviewed PR to NixOS/nixpkgs. flake.nix exists but has
#              never been evaluated (no Nix on the authoring machine).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 2.18.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  wait-for-assets:
    # Every channel below needs the released binaries -- their checksums are what
    # the manifests carry. On a tag push the builds are still running.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          [[ -n "$version" ]] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      # WHY THIS WAITS FOR THE BUILDERS AND NOT ONLY FOR TWO FILENAMES
      #
      # The step below requires the two assets every manifest points at. That is
      # necessary and not sufficient. `scripts/refresh-package-manifests.py` also
      # consumes YazSes-<v>-windows-arm64.exe *when it is present*, and treats it
      # as optional on purpose: the arm64 leg of build-windows is
      # `continue-on-error`, so a release may legitimately ship without one.
      #
      # From here, "legitimately absent" and "has not finished uploading" look
      # identical -- and windows-11-arm is the slowest leg in the release. On
      # v2.36.0 this job reached the generator 40 minutes before that .exe
      # attached, so it printed "not in this release; the Scoop and winget arm64
      # entries are dropped" and published ARM-less manifests. The asset arrived
      # afterwards and the in-repo copies were regenerated by hand, which is why
      # the repository and the published channels have disagreed about ARM64
      # support rather than one of them being visibly wrong.
      #
      # Waiting for the producing runs to *finish* tells the two apart: once
      # build-windows has completed, an absent arm64 .exe means the leg failed,
      # which is the case the generator's fallback is actually for. A completed
      # run is enough -- its conclusion is deliberately not checked, because a
      # failed optional leg must not block the channels that do not need it.
      #
      # A dispatched publish of an older release has no run for that tag; that is
      # not an error and must not wait 30 minutes to discover so.
      - name: Wait for the artifact-producing workflows to finish
        env:
          TAG: v${{ steps.resolve.outputs.version }}
        run: |
          set -uo pipefail
          for wf in build-windows.yml build-macos.yml; do
            for attempt in $(seq 1 60); do
              states=$(gh run list --workflow="$wf" --branch "$TAG" --json status --jq '.[].status')
              if [ -z "$states" ]; then
                echo "$wf has no run for $TAG -- not waiting on it."
                break
              fi
              if ! grep -qv completed <<<"$states"; then
                echo "$wf has finished for $TAG."
                break
              fi
              echo "$wf is still running for $TAG; retrying in 30s (${attempt}/60)."
              sleep 30
            done
          done

      - name: Wait for the release to carry its Windows and macOS artifacts
        run: |
          set -euo pipefail
          tag="v${{ steps.resolve.outputs.version }}"
          deadline=$(( SECONDS + 3000 ))
          while (( SECONDS < deadline )); do
            if names=$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null); then
              # Matched by NAME, not by extension. These manifests point at two
              # specific files -- winget/Chocolatey/Scoop at the x64 .exe, the
              # Homebrew cask at the arm64 .dmg -- and neither consumes the
              # cross-architecture bundles. Counting extensions was correct only
              # while one of each existed: with an ARM .exe and an Intel .dmg now
              # building too, "an .exe arrived" can be satisfied by the *other*
              # architecture, and the manifests would be published pointing at a
              # file that has not attached yet.
              exe=$(grep -c 'windows-x64\.exe$'  <<<"$names" || true)
              dmg=$(grep -c 'macos-arm64\.dmg$'  <<<"$names" || true)
              echo "windows-x64.exe=$exe macos-arm64.dmg=$dmg (${SECONDS}s)"
              (( exe > 0 && dmg > 0 )) && exit 0
            else
              echo "release $tag not created yet (${SECONDS}s)"
            fi
            sleep 60
          done
          echo "::error::$tag never gained YazSes-*-windows-x64.exe and/or YazSes-*-macos-arm64.dmg -- refusing to publish manifests with no artifact behind them. (A cross-architecture bundle attaching is not a substitute: no manifest points at one.)"
          exit 1

  winget:
    needs: wait-for-assets
    runs-on: windows-latest
    env:
      HAVE_SECRET: ${{ secrets.WINGET_TOKEN != '' && 'yes' || 'no' }}
      VERSION: ${{ needs.wait-for-assets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAVE_SECRET == 'yes'

      - name: Submit the manifests to microsoft/winget-pkgs
        if: env.HAVE_SECRET == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "packaging/winget/manifests/m/MSKazemi/YazSes/$env:VERSION"
          if (-not (Test-Path $dir)) {
            Write-Error "no winget manifests for $env:VERSION at $dir -- run scripts/refresh-package-manifests.py first"
          }
          # Download the standalone exe rather than `winget install`. winget is a
          # Store-delivered app and is not dependably present on a hosted Windows
          # runner in a non-interactive session, so installing wingetcreate through
          # it can fail before the submit is ever reached. Downloading the exe is
          # the method winget-create's own README documents for pipelines.
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # `submit` opens the PR against winget-pkgs from manifests we already
          # generate and validate in-repo, rather than re-deriving them here.
          .\wingetcreate.exe submit `
            --prtitle "YazSes $env:VERSION" `
            --token $env:WINGET_TOKEN $dir
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # refresh-package-manifests.py calls `gh release view`; without these
          # it exits 1. Latent until the secret above is set, because the step
          # is skipped entirely while it is absent — the job reports success
          # having published nothing. The AUR job failed exactly this way.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Explain the skip
        if: env.HAVE_SECRET != 'yes'
        run: echo "::warning::WINGET_TOKEN is not set -- skipping winget. Add it to publish automatically."

  chocolatey:
    needs: wait-for-assets
    runs-on: windows-latest
    env:
      HAVE_SECRET: ${{ secrets.CHOCO_API_KEY != '' && 'yes' || 'no' }}
      VERSION: ${{ needs.wait-for-assets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAVE_SECRET == 'yes'

      - name: Pack and push
        if: env.HAVE_SECRET == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The .ps1 install scripts have never been syntax-checked on this
          # project (no pwsh on the authoring machine). Do it here, before
          # pushing something unrunnable to a public feed.
          Get-ChildItem packaging/chocolatey/tools/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Error "$($_.Name): $($errors -join '; ')" }
            Write-Host "$($_.Name): parses OK"
          }
          # Point the package at THIS release before packing. Nothing else
          # regenerates it -- refresh-package-manifests.py covers only the
          # Homebrew cask and the winget manifests -- so the nuspec version, the
          # download URL and the checksum were all frozen at whatever was last
          # committed. The next tag would have packed yazses.<old>.nupkg, and the
          # push below would then fail on a filename that does not exist, while
          # the install script still pointed at the previous release's .exe.
          # The checksum comes from the SHA256SUMS.txt published on the release
          # itself, so the package and the artifact cannot disagree.
          python scripts/render-chocolatey.py $env:VERSION `
            packaging/chocolatey/yazses.nuspec `
            packaging/chocolatey/tools/chocolateyinstall.ps1
          choco pack packaging/chocolatey/yazses.nuspec --outputdirectory dist
          choco push "dist/yazses.$env:VERSION.nupkg" `
            --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          # refresh-package-manifests.py calls `gh release view`; without these
          # it exits 1. Latent until the secret above is set, because the step
          # is skipped entirely while it is absent — the job reports success
          # having published nothing. The AUR job failed exactly this way.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Explain the skip
        if: env.HAVE_SECRET != 'yes'
        run: echo "::warning::CHOCO_API_KEY is not set -- skipping Chocolatey. Add it to publish automatically."

  homebrew:
    needs: wait-for-assets
    runs-on: ubuntu-latest
    env:
      HAVE_SECRET: ${{ secrets.TAP_TOKEN != '' && 'yes' || 'no' }}
      VERSION: ${{ needs.wait-for-assets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAVE_SECRET == 'yes'

      - name: Push the cask to the tap
        if: env.HAVE_SECRET == 'yes'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Derive the cask from the released .dmg rather than trusting whatever
          # is committed -- a hand-edited checksum is the failure this whole area
          # keeps having.
          python3 scripts/refresh-package-manifests.py --version "$VERSION"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/MSKazemi/homebrew-yazses.git" tap
          cp packaging/homebrew/yazses.rb tap/Casks/yazses.rb
          cd tap
          git config user.name  "Mohsen Seyedkazemi Ardebili"
          git config user.email "mohsen.seyedkazemi@gmail.com"
          # Same reason as the AUR job: compare the index, not the worktree, so a
          # cask that does not exist yet is a change rather than a silent no-op.
          git add -A
          if git diff --cached --quiet; then
            echo "tap already at $VERSION -- nothing to push."
            exit 0
          fi
          git commit -m "yazses $VERSION"
          git push

      - name: Explain the skip
        if: env.HAVE_SECRET != 'yes'
        run: echo "::warning::TAP_TOKEN is not set -- skipping Homebrew. Add it to publish automatically."

  aur:
    needs: wait-for-assets
    runs-on: ubuntu-latest
    env:
      HAVE_SECRET: ${{ secrets.AUR_SSH_KEY != '' && 'yes' || 'no' }}
      VERSION: ${{ needs.wait-for-assets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAVE_SECRET == 'yes'

      - name: The key must authenticate before 200 MB is hashed
        # Auth goes first because it is the cheapest thing to check and the
        # likeliest thing to be wrong. Previously the job spent every run
        # downloading and hashing every release asset, and only then failed on a
        # bare `git clone` error — which reads as a packaging problem when it is
        # a credential one. Checking here costs three seconds and names the fix.
        #
        # `Permission denied (publickey)` is matched by text, not by exit code:
        # the AUR's git shell refuses an interactive session even for a VALID
        # key, so a non-zero exit cannot tell a working credential from a
        # rejected one.
        if: env.HAVE_SECRET == 'yes'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          OUT=$(ssh -T -i ~/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes \
                    -o ConnectTimeout=20 aur@aur.archlinux.org 2>&1 || true)
          echo "$OUT"
          if grep -qF "Permission denied (publickey)" <<<"$OUT"; then
            echo "::error::The AUR rejected AUR_SSH_KEY. The secret is not necessarily wrong: an SSH key only works once its PUBLIC half is registered on an AUR account. Sign in at https://aur.archlinux.org, open My Account, and paste the matching public key into 'SSH Public Key'. No later step in this job can succeed until that is done."
            exit 1
          fi

      - name: Push PKGBUILD to the AUR
        if: env.HAVE_SECRET == 'yes'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # refresh-package-manifests.py shells out to `gh release view` to read
          # the published assets. Without these it dies with "set the GH_TOKEN
          # environment variable"; the winget and homebrew jobs already set both.
          # Supplying them was necessary and not sufficient — it moved the
          # failure from the manifest step to the SSH auth now checked above,
          # which is where it had been all along. The comment here used to say
          # the credential was fine. It was not: the key has been rejected on
          # every run since the secret was added.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Regenerate from the release first, so a PKGBUILD nobody remembered to
          # bump does not silently publish the previous version to the AUR. The
          # guard below then only fires if that regeneration itself failed.
          python3 scripts/refresh-package-manifests.py --version "$VERSION"
          # .SRCINFO is what the AUR actually indexes; a push without it, or with
          # one that disagrees with the PKGBUILD, is rejected.
          test -f packaging/arch/.SRCINFO
          grep -q "pkgver = ${VERSION}" packaging/arch/.SRCINFO || {
            echo "::error::packaging/arch/.SRCINFO is not at ${VERSION} -- refusing to push a stale package."
            exit 1
          }
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/yazses.git aur
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO aur/
          cp packaging/arch/yazses.install aur/ 2>/dev/null || true
          cd aur
          git config user.name  "Mohsen Seyedkazemi Ardebili"
          git config user.email "mohsen.seyedkazemi@gmail.com"
          # `git add -A` before comparing, and compare the INDEX. The first publish
          # clones an empty repo, so PKGBUILD/.SRCINFO arrive untracked -- and
          # `git diff` ignores untracked files. The previous form therefore reported
          # "already up to date" and exited 0 having pushed nothing, on the one run
          # that actually creates the package.
          git add -A
          if git diff --cached --quiet; then
            echo "AUR already at $VERSION -- nothing to push."
            exit 0
          fi
          git commit -m "yazses $VERSION"
          git push origin HEAD:master

      - name: Explain the skip
        if: env.HAVE_SECRET != 'yes'
        run: echo "::warning::AUR_SSH_KEY is not set -- skipping AUR. Add it to publish automatically."

  summary:
    needs: [wait-for-assets, winget, chocolatey, homebrew, aur]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Say what published and what is still waiting on a credential
        env:
          HAVE_WINGET: ${{ secrets.WINGET_TOKEN != '' && 'yes' || 'no' }}
          HAVE_CHOCO: ${{ secrets.CHOCO_API_KEY != '' && 'yes' || 'no' }}
          HAVE_TAP: ${{ secrets.TAP_TOKEN != '' && 'yes' || 'no' }}
          HAVE_AUR: ${{ secrets.AUR_SSH_KEY != '' && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          {
            echo "## Channel publishing — v${{ needs.wait-for-assets.outputs.version }}"
            echo
            echo "| Channel | Secret | Status |"
            echo "|---|---|---|"
            row() { # name secret have result
              if [[ "$3" == "yes" ]]; then echo "| $1 | \`$2\` set | $4 |"
              else echo "| $1 | \`$2\` **missing** | skipped |"; fi
            }
            row winget      WINGET_TOKEN  "$HAVE_WINGET" "${{ needs.winget.result }}"
            row Chocolatey  CHOCO_API_KEY "$HAVE_CHOCO"  "${{ needs.chocolatey.result }}"
            row Homebrew    TAP_TOKEN     "$HAVE_TAP"    "${{ needs.homebrew.result }}"
            row AUR         AUR_SSH_KEY   "$HAVE_AUR"    "${{ needs.aur.result }}"
            echo
            echo "Flathub and nixpkgs are not here: both need a first, reviewed submission"
            echo "to a third-party repository before any update can be automated."
            echo
            echo "Verify the result with: \`python3 scripts/check-release-channels.py --version <v>\`"
          } >> "$GITHUB_STEP_SUMMARY"
