name: build-macos

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/yazses/platform/macos/**'
      - 'src/yazses/__main__.py'
      - 'src/yazses/tray/**'
      - 'packaging/macos/**'
      - 'scripts/build-macos.sh'
      - '.github/workflows/build-macos.yml'
      - 'pyproject.toml'
  workflow_dispatch:

# Least privilege: read-only by default; the build job declares what it needs.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write   # softprops/action-gh-release attaches the .dmg
      # Build provenance: the attestation ties this binary to this workflow and
      # commit, which matters most for an UNSIGNED artifact — it is the only
      # verifiable link a user has (OpenSSF Signed-Releases, #116).
      id-token: write
      attestations: write
    # One .dmg per architecture. `macos-latest` is an Apple-silicon image, so until
    # this matrix existed the only bundle was arm64 -- an Intel Mac could install via
    # pipx but the .app would not launch, and its name said nothing about that.
    #
    # PyInstaller does not cross-compile and `target_arch=None` in the spec means
    # "host architecture", so the runner label IS the target. build-macos.sh derives
    # the name from `uname -m` rather than a flag, which keeps the two from
    # disagreeing (the same reasoning as build-windows.ps1).
    #
    # x86_64 is `continue-on-error` on purpose: `macos-15-intel` has never run in
    # this repository, and a brand-new leg must not be able to fail a release that
    # the arm64 build completed fine. Promote it once it has been green a few times.
    #
    # It also has a deadline that is not ours (ADR-017): `macos-15-intel` is the LAST
    # x86_64 image GitHub Actions will offer, available until August 2027, and
    # `macos-13` was retired on 2025-12-04. When it goes, this leg goes with it and
    # `pipx` becomes the only Intel path.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            experimental: false
          - arch: x86_64
            runner: macos-15-intel
            experimental: true
    name: build (macos-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30

    env:
      # Apple Developer Program signing + notarisation. All four secrets must
      # be set for the signing path to fire. Otherwise the workflow ships an
      # unsigned dev preview (the v0 default).
      #   MACOS_CERTIFICATE        — base64 of the Developer ID .p12 keystore
      #   MACOS_CERTIFICATE_PWD    — password for the .p12
      #   MACOS_NOTARY_APPLE_ID    — Apple ID email used for notarytool
      #   MACOS_NOTARY_PASSWORD    — app-specific password from appleid.apple.com
      #   MACOS_NOTARY_TEAM_ID     — 10-char team ID (Apple Developer Membership)
      #   MACOS_SIGNING_IDENTITY   — exact "Developer ID Application: <Name> (<Team>)" string
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `latest`, like every other workflow here. This was pinned to '0.5.x'
          # — a toolchain from December 2024 — and only in the two desktop-bundle
          # workflows, which is also where both cross-architecture legs failed.
          # On windows-11-arm the pin is the whole failure:
          #
          #   error: No download found for request: cpython-3.12-windows-aarch64-none
          #
          # uv 0.5 predates python-build-standalone's Windows ARM64 builds, so it
          # cannot fetch an interpreter for the runner it is standing on. A pin
          # that old is not stability, it is a platform that had not been invented
          # yet.
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Detect signing presence
        id: sign
        shell: bash
        run: |
          if [[ -n "${MACOS_CERTIFICATE}" \
              && -n "${MACOS_CERTIFICATE_PWD}" \
              && -n "${MACOS_NOTARY_APPLE_ID}" \
              && -n "${MACOS_NOTARY_PASSWORD}" \
              && -n "${MACOS_NOTARY_TEAM_ID}" \
              && -n "${MACOS_SIGNING_IDENTITY}" ]]; then
            echo "sign=true" >> "${GITHUB_OUTPUT}"
            echo "Signing + notarisation will run."
          else
            echo "sign=false" >> "${GITHUB_OUTPUT}"
            echo "Signing secrets not all present; producing unsigned dev preview."
          fi

      - name: Import signing certificate into keychain
        if: steps.sign.outputs.sign == 'true'
        shell: bash
        run: |
          KEYCHAIN=yazses-build.keychain-db
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"

          # Decode the base64-encoded .p12 and import it.
          echo -n "${MACOS_CERTIFICATE}" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
              -k "${KEYCHAIN}" \
              -P "${MACOS_CERTIFICATE_PWD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          rm -f /tmp/cert.p12

          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "${KEYCHAIN_PWD}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"' | xargs)
          echo "KEYCHAIN_PWD=${KEYCHAIN_PWD}" >> "${GITHUB_ENV}"
          echo "Keychain ready."

      - name: Build .dmg
        run: ./scripts/build-macos.sh

      # The build succeeding says nothing about what is inside the bundle, and this
      # is the one artefact nobody on this project can open -- development is on
      # Linux. Two defects have already lived in exactly that gap: an .app reporting
      # CFBundleVersion 0.1.2 for every release from v0.1.3 to v2.18.0, and a .dmg
      # with no x86_64 slice while the docs promised Intel.
      #
      # The permission strings are the third, and the worst of the three, because
      # macOS refuses a service whose NS*UsageDescription is absent WITHOUT EVER
      # PROMPTING. The bundle is well formed, the build is green, and hold-to-talk
      # is simply dead with no dialog to answer -- which is how #182 presented on
      # the first Mac this project was ever run on.
      #
      # The required keys are read out of packaging/macos/yazses.spec rather than
      # listed here, so a permission added there is covered the day it is added.
      - name: Verify what is inside the .dmg
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls dist/YazSes-*.dmg | head -1)
          # Only tag builds know the version they claim to be; a PR build does not.
          # `${A[@]+...}` because macOS ships bash 3.2, where `set -u` treats an
          # EMPTY array expansion as an unbound variable and kills the step.
          EXPECT=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            EXPECT+=(--expect-version "${GITHUB_REF_NAME#v}")
          fi
          uv run --no-project python scripts/inspect-dmg.py "${DMG}" \
              --expect-arch "${{ matrix.arch }}" \
              --require-keys-from-spec packaging/macos/yazses.spec \
              ${EXPECT[@]+"${EXPECT[@]}"}

      # Inspecting the .dmg proves what is inside it. It does not prove the thing
      # RUNS -- and until this step existed, nothing anywhere had ever executed the
      # built .app. Every macOS bundle this project has shipped went out unrun.
      #
      # Two of the three defects the first real Mac run found are reproducible here
      # with no human and no microphone:
      #
      #   * the `-B -c` re-entry. In a bundle `sys.executable` IS this binary, and
      #     the stdlib relaunches it as if it were an interpreter --
      #     `multiprocessing.resource_tracker` builds exactly `[sys.executable, "-B",
      #     "-c", "..."]`. With no branch for it that falls through to Typer, which
      #     answers "No such option: -B", and the tracker dies and respawns for every
      #     tracked resource. It frames every command the user runs. `__main__.py`
      #     handles it now and this is the only place that can prove it, because the
      #     bug does not exist outside a frozen binary.
      #
      #   * the CLI being reachable at all from inside the .app, with printable
      #     streams.
      #
      # The third -- granting Input Monitoring and speaking -- needs a human at a
      # Mac and is deliberately not attempted. What IS checked is that `doctor`
      # renders the Input Monitoring row, since the #182 failure mode was that
      # permission being neither granted nor requested nor mentioned.
      #
      # Runs before codesigning: an unsigned binary built on this machine carries no
      # quarantine attribute, so Gatekeeper is not in the way.
      - name: Smoke-test the built .app
        shell: bash
        run: |
          set -euo pipefail
          APP=dist/YazSes.app/Contents/MacOS/YazSes
          test -x "${APP}" || { echo "no executable at ${APP}"; exit 1; }

          # macOS ships no `timeout`. perl's alarm is present on every runner and
          # keeps a hung probe from burning the 30-minute job budget.
          #
          # No `--` before "$@": with -e, perl stops switch parsing at the code
          # string, so everything after it lands in @ARGV verbatim -- including the
          # `--`, which `shift` does not remove and `exec` then tries to RUN. That
          # form fails silently in the worst way available: a failed exec in perl
          # falls off the end of the script, so the probe runs nothing, prints
          # nothing, and exits 0. Only the output checks below would notice.
          # A leading `-B` in "$@" is safe for the same reason it is @ARGV, not a switch.
          run_capped() { perl -e 'alarm shift; exec @ARGV' 90 "$@"; }

          echo "==> the interpreter re-entry the stdlib performs on a frozen binary"
          # Not a synthetic check: this is byte-for-byte the argv shape
          # multiprocessing.resource_tracker builds. It must execute the program,
          # not parse it as YazSes options.
          OUT=$(run_capped "${APP}" -B -c "print('reentry-ok')" 2>&1) || true
          echo "${OUT}"
          case "${OUT}" in
            *reentry-ok*) echo "    ok: the bundle served the re-entry" ;;
            *"No such option"*)
              echo "FAIL: argv fell through to the CLI -- __main__.interpreter_reentry"
              echo "      is not handling the frozen relaunch. This is the #182 -B bug."
              exit 1 ;;
            *) echo "FAIL: re-entry produced neither the program output nor a CLI error"; exit 1 ;;
          esac

          echo "==> the CLI is reachable from inside the bundle"
          VER=$(run_capped "${APP}" --cli --version 2>&1) || true
          echo "${VER}"
          case "${VER}" in
            "") echo "FAIL: --version printed nothing; the bundle has no usable stdout"; exit 1 ;;
            *"No such option"*|*Traceback*) echo "FAIL: --version errored"; exit 1 ;;
          esac

          echo "==> doctor runs, and says something about Input Monitoring"
          # doctor exits non-zero when prerequisites are missing, which on a bare
          # runner they are. Its exit code is not the subject; its output is.
          DOC=$(run_capped "${APP}" --cli doctor 2>&1) || true
          echo "${DOC}"
          case "${DOC}" in
            *Traceback*) echo "FAIL: doctor raised inside the bundle"; exit 1 ;;
          esac
          case "${DOC}" in
            *"Input monitoring"*) echo "    ok: the row is rendered" ;;
            *) echo "FAIL: doctor never mentions Input Monitoring. That permission being"
               echo "      silently absent -- not denied, not requested, not named -- is"
               echo "      exactly how #182 presented."; exit 1 ;;
          esac

          echo "==> no resource-tracker storm framing the output"
          case "${DOC}${VER}" in
            *"resource_tracker"*) echo "FAIL: leaked semaphores; the re-entry branch is not holding"; exit 1 ;;
          esac

          echo "All bundle smoke checks passed."

      - name: Codesign .app and .dmg (Developer ID)
        if: steps.sign.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/YazSes.app"
          DMG=$(ls dist/YazSes-*.dmg | head -1)
          ENTITLEMENTS=packaging/macos/entitlements.plist

          echo "==> codesign --deep on the app bundle"
          /usr/bin/codesign \
              --force --deep --options runtime \
              --timestamp \
              --entitlements "${ENTITLEMENTS}" \
              --sign "${MACOS_SIGNING_IDENTITY}" \
              "${APP}"

          echo "==> codesign on the .dmg itself"
          /usr/bin/codesign \
              --force --timestamp \
              --sign "${MACOS_SIGNING_IDENTITY}" \
              "${DMG}"

          echo "==> verify"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${APP}"
          /usr/bin/codesign --verify --verbose=2 "${DMG}"

      - name: Notarise .dmg with Apple
        if: steps.sign.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls dist/YazSes-*.dmg | head -1)
          xcrun notarytool submit "${DMG}" \
              --apple-id "${MACOS_NOTARY_APPLE_ID}" \
              --password "${MACOS_NOTARY_PASSWORD}" \
              --team-id "${MACOS_NOTARY_TEAM_ID}" \
              --wait
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

      - name: Show build artefacts
        run: ls -lh dist/

      - name: Upload .dmg (signed if applicable)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yazses-macos-${{ matrix.arch }}-${{ steps.sign.outputs.sign == 'true' && 'signed' || 'unsigned' }}-${{ github.sha }}
          path: dist/YazSes-*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attest build provenance for the .dmg
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          # dist/, not the repo root. Every other step in this job addresses the
          # artifact as dist/YazSes-*.dmg; this one globbed the workspace root,
          # found nothing, and failed the job — which skipped "Attach to release"
          # below, so the .dmg was built and uploaded as a run artifact but never
          # reached the release. v2.19.0 shipped with only the two .deb files.
          subject-path: dist/YazSes-*.dmg

      # Scorecard's Signed-Releases check reads release ASSET FILENAMES, not
      # GitHub's attestations API, so the attestation above scored 0/10 until the
      # bundle was attached too. See the longer note in release.yml.
      - name: Attach the provenance bundle as a release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/YazSes-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.intoto.jsonl"

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/YazSes-*.dmg
            dist/YazSes-*.intoto.jsonl
          fail_on_unmatched_files: true
