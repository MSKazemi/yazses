name: Snap

on:
  push:
    tags:
      # `v*`, never a list of majors: an enumeration has to be extended by
      # hand at each bump, and the failure is silent -- no job runs, so the tag
      # looks successful while nothing publishes. `ppa.yml` died that way.
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without 'v' prefix). Defaults to current snapcraft.yaml value."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: this workflow publishes to an external store, not to GitHub.
permissions:
  contents: read

jobs:
  snap:
    # One job per architecture declared in snap/snapcraft.yaml `platforms:`.
    #
    # This used to be a single amd64 job, and it is the ONLY publisher to
    # stable — so `latest/stable` had an amd64 revision and nothing else, while
    # arm64 existed only on edge (fed by the snapcraft.io build service) and
    # drifted two releases behind. `snap install yazses` resolves stable, so on
    # a Raspberry Pi or an arm64 VM it could not find a revision at all, and the
    # packaging table still advertised "incl. arm64" (issue #267).
    #
    # snapcraft builds for the host architecture, so the fix is a native runner
    # per arch rather than cross-building. GitHub's arm64 hosted runners are
    # free for public repositories, which this is.
    #
    # fail-fast is off on purpose: one arch failing must not cancel the other
    # and leave stable half-updated — the exact asymmetry this fixes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(grep -E '^version:' snap/snapcraft.yaml | head -1 | sed -E 's/version:\s*"([^"]+)".*/\1/')
          fi
          sed -i "s/^version:.*/version: \"$VERSION\"/" snap/snapcraft.yaml
          echo "Building snap version $VERSION"

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: snap-build
        # Default mode uses an LXD container, which has root and can refresh
        # the apt cache. --destructive-mode runs as the runner user without
        # root, which leaves the package list stale and triggers 404s when
        # Ubuntu rolls forward.

      - name: Show built artefact
        run: ls -lh "${{ steps.snap-build.outputs.snap }}"

      # The filename carries the architecture snapcraft actually produced. A
      # runner-label typo or a future cross-build change would otherwise publish
      # two amd64 revisions and silently re-open #267 with a green tick.
      - name: Verify the build really is ${{ matrix.arch }}
        run: |
          SNAP="${{ steps.snap-build.outputs.snap }}"
          case "$(basename "$SNAP")" in
            *_${{ matrix.arch }}.snap) echo "OK: $(basename "$SNAP") is ${{ matrix.arch }}" ;;
            *) echo "::error::expected a ${{ matrix.arch }} snap, built $(basename "$SNAP")"; exit 1 ;;
          esac

      - name: Upload .snap as workflow artefact
        # Convenience copy only. Must not block the store publish below — when the
        # account's Actions artifact-storage quota is full this step errors, which
        # previously sank the whole job (and the publish with it).
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Arch-qualified: two matrix jobs uploading the same artifact name
          # collide and the second fails.
          name: yazses-snap-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ steps.snap-build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

      - name: Check Snap Store credentials presence
        id: check-snap-creds
        env:
          CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "${CREDS}" ]]; then
            echo "Snap Store credentials not configured; skipping publish."
            echo "have_creds=false" >> "${GITHUB_OUTPUT}"
          else
            echo "have_creds=true" >> "${GITHUB_OUTPUT}"
          fi

      # On the CANONICAL repo, a tagged release with no credentials must FAIL
      # loudly — otherwise the snap is silently never published and the job still
      # goes green (this hid a stuck-at-1.2.0 store for 9 releases). The backup
      # mirror (MSKazemi) is not expected to publish, so it only skips there.
      - name: Require credentials on a tagged release (canonical repo)
        if: github.repository == 'MSKazemi/yazses' && startsWith(github.ref, 'refs/tags/') && steps.check-snap-creds.outputs.have_creds != 'true'
        run: |
          echo "::error::SNAPCRAFT_STORE_CREDENTIALS is not set on ${GITHUB_REPOSITORY} — the ${{ matrix.arch }} snap for ${GITHUB_REF_NAME} was BUILT but NOT published. Add the secret (snapcraft export-login) and re-run."
          exit 1

      - name: Publish to Snap Store
        id: publish
        # Shorter than the job's 60 minutes on purpose. v2.20.0 and v2.21.0 both
        # built a good snap and then stalled here until the *job* limit killed
        # them, which GitHub reports as "cancelled" — indistinguishable from
        # someone pressing stop. Two releases passed with `latest/stable` on
        # 2.19.0 and nothing in the run list that looked like a failure.
        if: steps.check-snap-creds.outputs.have_creds == 'true'
        timeout-minutes: 30
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ steps.snap-build.outputs.snap }}
          ARCH: ${{ matrix.arch }}
        # This used to be `snapcore/action-publish` with `release: stable,edge`,
        # i.e. `snapcraft upload <snap> --release stable,edge`. That command does
        # two things and only the first one has ever worked here.
        #
        # The transfer finishes in about a minute and the store assigns a revision
        # straight away. The client then polls the store's scan for a verdict, and
        # for this ~474 MB snap the verdict does not arrive: run 32221079405
        # printed `Status: processing` 988 times over nineteen unbroken minutes and
        # was killed with the release never applied. Because `--release` is an
        # argument to the command that is still blocked, killing the client kills
        # the release too — the revision lands and no channel ever points at it.
        #
        # The snapcraft.io build service fails from the other side of the same
        # wall: Launchpad reports `store_upload_status: Failed to upload` on builds
        # whose revisions are demonstrably sitting in the store, 188 of them.
        #
        # Ten consecutive tagged releases died here. `latest/stable` served 2.19.0
        # while the project shipped 2.29.0.
        #
        # So: upload, do NOT wait for the verdict, then read the revision number
        # back out of the store and apply the channel release as its own call. The
        # release is what the blocked poll was holding hostage; it does not need
        # the scan to have reported.
        run: |
          set -uo pipefail
          command -v snapcraft >/dev/null || sudo snap install snapcraft --classic

          # snapcraft exits 120 when its final stdout flush loses the pipe after
          # a long store-review poll.  `bash -e` has still aborted this step in
          # practice despite the old trailing `|| true`, before the revision
          # lookup below could run.  Disable errexit explicitly around the one
          # command whose status is deliberately advisory, then restore it.
          set +e
          timeout 900 snapcraft upload "$SNAP_FILE" 2>&1 | tee upload.log
          UPLOAD_STATUS=${PIPESTATUS[0]}
          set -e
          if (( UPLOAD_STATUS != 0 )); then
            echo "::notice::snapcraft upload exited $UPLOAD_STATUS; checking the store for the accepted revision"
          fi

          # From the filename, which the arch check above has already proved.
          VERSION=$(basename "$SNAP_FILE" | sed -E "s/^yazses_(.+)_${ARCH}\.snap$/\1/")

          # Read the revision back from the store rather than parsing upload.log:
          # the log is exactly what gets truncated when the poll is killed, and the
          # revision exists whether or not the client lived to be told about it.
          REV=""
          for _ in $(seq 1 10); do
            REV=$(snapcraft revisions yazses 2>/dev/null \
                  | awk -v v="$VERSION" -v a="$ARCH" '$3 == a && $4 == v { print $1; exit }')
            [ -n "$REV" ] && break
            sleep 15
          done
          if [ -z "$REV" ]; then
            echo "::error::the store holds no revision for yazses $VERSION/$ARCH — the upload itself failed, not the wait"
            exit 1
          fi
          echo "Store revision for $VERSION/$ARCH is $REV"

          set -e
          snapcraft release yazses "$REV" stable,edge

          # A green workflow is not a published package — this whole area exists
          # because that assumption hid a stuck store for nine releases. Read the
          # channel back and fail if it did not move.
          snapcraft status yazses | tee status.log
          awk -v a="$ARCH" -v v="$VERSION" \
            '$2 == a && $3 == "stable" { ok = ($4 == v) } END { exit !ok }' status.log || {
            echo "::error::released revision $REV but latest/stable is still not $VERSION on $ARCH"
            exit 1
          }
          echo "latest/stable is $VERSION on $ARCH (revision $REV)"

      # The step above no longer waits for the store's scan, so a failure here has
      # changed meaning and the explanation had to change with it. It used to say
      # "the revision is queued for review, the pipeline is fine" -- true, and the
      # reason ten releases went unpublished while every run looked like an
      # infrastructure hiccup somebody else would clear.
      #
      # Now the upload is allowed to time out and the channel release is a separate
      # call, so reaching this step means one of two things that are worth telling
      # apart: the store holds no revision at all (the upload really failed), or the
      # revision exists and `snapcraft release` refused it -- which is the case that
      # points at the store's review of the revision rather than at this workflow.
      #
      # The job still FAILS, deliberately. Nothing reached `latest/stable`, and a
      # green workflow that published nothing is the exact failure this whole area
      # exists to prevent.
      - name: Explain what a failed publish means
        if: always() && steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=Snap publish did not complete::The snap was BUILT. \
          Read the step log above and tell the two cases apart. (1) 'the store holds \
          no revision' -- the upload itself failed; check credentials. (2) The \
          revision was found and 'snapcraft release' or the channel read-back failed \
          -- the upload is fine and the store's review of the revision is what is \
          holding it; repeated 'Status: processing' in the upload log is the same \
          signal, and it no longer blocks the release on its own. See \
          https://snapcraft.io/yazses/releases . Nothing reached latest/stable, \
          which is why this job is red."
