name: Heavy optional extras

# The two tests that had never executed anywhere.
#
# `test_shipped_backends.py` guards one test on `diarization-pyannote` and one on
# `voiceprint-resemblyzer` being importable. Neither extra is installed by any job in
# `test.yml` — both pull torch, ~2 GB — so both tests skipped in every run on every
# platform since they were written, and the comment in `test.yml`'s `extras` job records
# that gap rather than hiding it.
#
# On 2026-08-24 they were run by hand on a rented 16-vCPU box and both passed, so the
# gap is now closeable and this closes it. What they check cannot be checked any other
# way:
#
#   * the pyannote test binds the adapter's real call against the real
#     `Pipeline.from_pretrained` signature. That is what catches an upstream rename —
#     3.x `use_auth_token` became 4.x `token`, and the adapter shipped calling the old
#     name. A mocked signature cannot catch it, because the mock is written from the
#     same reading of the docs that produced the bug.
#   * the resemblyzer test embeds two lengths of synthetic noise through the real
#     encoder. Its first hand-run failure was `ModuleNotFoundError: No module named
#     'pkg_resources'` when the package was installed by *bare name*. That is what the
#     `setuptools<81` pin inside the extra used to prevent — and the pin has since been
#     removed, because a universal lock applies it to everyone (see the step below).
#     The job now applies the same remedy in its own environment, so it still tests the
#     ship and additionally proves the instruction given to users is a working one.
#
# Neither needs a token, a model, or the network at test time.
#
# **Two runs of the same file, not one.** Those two tests cannot both execute in one
# environment, and that is the design rather than an accident: the resemblyzer one
# skips unless `import resemblyzer` works, which needs `setuptools<81`, and
# `test_a_resemblyzer_that_cannot_import_names_the_remedy_and_stays_dormant` skips
# unless that same import *fails* -- it asserts the failure is turned into the one-line
# remedy instead of a `ModuleNotFoundError` raised three layers down inside webrtcvad.
# So phase 1 runs the file in the environment a user actually gets, phase 2 runs it on
# the documented remedy, and the gate is that nothing was skipped in **both**.
#
# The gate used to be "nothing may be skipped", which no run could satisfy. It survived
# three releases because the job died two steps earlier, on a bare `uv run` that
# re-synced the pin away -- so the contradiction was never reached and never seen.
#
# **Weekly, not per-push.** What this catches is an upstream API change, which arrives on
# upstream's schedule and not with a commit here; paying 2 GB of wheels on every pull
# request to look for it would be a poor trade. `workflow_dispatch` is here so it can be
# run against a branch on demand when either adapter is touched.
#
# `notes`/`slm` (llama-cpp-python) is still not covered: it compiles a C++ inference
# engine rather than downloading a wheel. That gap stays named here rather than closed.

on:
  schedule:
    # Mondays, 05:17 UTC. Off the hour on purpose — the top of the hour is when every
    # scheduled workflow on GitHub queues at once and starts late.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-extras:
    name: pyannote + resemblyzer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies (with the two heavy extras)
        run: uv sync --extra diarization-pyannote --extra voiceprint-resemblyzer

      # `resemblyzer` -> `webrtcvad` -> `import pkg_resources`, which setuptools
      # removed (80.10.2 has it; 83.0.0 and 84.0.0 do not). `pyproject.toml` used to
      # carry `setuptools<81` inside the extra to prevent that, and the pin had to go:
      # `uv.lock` is a universal resolution, so a pin in an opt-in extra held the base
      # install -- and both shipped bundles, which are built from that lock -- below
      # the 83.0.0 that patches Dependabot #9.
      #
      # The remedy now lives where the backend is chosen -- `voiceprint/factory.py`
      # catches the ModuleNotFoundError and tells the user, in those words, to
      # `pip install "setuptools<81"`. This step is what proves that instruction
      # actually works rather than merely being written down.
      #
      # Deliberately AFTER `uv sync`, which would otherwise resolve it straight back up.
      #
      # ⚠ And every `uv run` below carries `--no-sync` for exactly the same reason,
      # which is the half that was missed: a bare `uv run` re-syncs the environment
      # against `uv.lock` before it runs anything, so it silently undid this pin one
      # line later. Measured, not reasoned about -- in a throwaway project pinned to
      # `packaging<25`:
      #
      #   uv pip install "packaging<25" ; uv run --no-sync python -c ...  -> 24.2
      #   uv run python -c ...            -> "Uninstalled 1 package" -> 26.3
      #
      # So this job could never have passed. `uv run` restored setuptools 84.0.0, and
      # the very next step imports `resemblyzer`, which is the import that needs
      # `pkg_resources` and is the whole reason the pin exists. Red by construction,
      # and unobserved: the workflow is weekly and had not yet reached a Monday.
      # ------------------------------------------------------------------ phase 1
      # The environment a user actually gets: whatever `uv.lock` resolves. Run the
      # backend tests here first, because this is the state being shipped.
      - name: pyannote must import, and resemblyzer must fail the way the docs say
        run: |
          uv run --no-sync python -c "import pyannote.audio; print('pyannote.audio ok')"
          uv run --no-sync python - <<'PY'
          try:
              import resemblyzer  # noqa: F401
          except ModuleNotFoundError as exc:
              assert exc.name == "pkg_resources", f"failed on {exc.name}, not pkg_resources"
              print("resemblyzer fails on pkg_resources, exactly as documented")
          else:
              raise SystemExit(
                  "resemblyzer imported on the locked setuptools. That is good news and "
                  "it makes the remedy stale: delete the advice in voiceprint/factory.py "
                  "and the pin below rather than leaving people a fix they do not need."
              )
          PY

      - name: Run the backend tests as they run for a user
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest -v -rs \
            --junit-xml=shipped.xml tests/test_shipped_backends.py

      # ------------------------------------------------------------------ phase 2
      # The documented remedy. `voiceprint/factory.py` catches resemblyzer's
      # ModuleNotFoundError and tells the reader, in those words, to
      # `pip install "setuptools<81"`. This is what proves that instruction works
      # rather than merely being written down.
      #
      # Deliberately AFTER `uv sync`, which would otherwise resolve it straight back up.
      #
      # ⚠ And every `uv run` carries `--no-sync` for the same reason, which is the half
      # that was missed for three releases: a bare `uv run` re-syncs the environment
      # against `uv.lock` before running anything, so it silently undid this pin one
      # line later. Measured, in a throwaway project pinned to `packaging<25`:
      #
      #   uv pip install "packaging<25" ; uv run --no-sync python -c ...  -> 24.2
      #   uv run python -c ...                                            -> 26.3
      #
      # So this job could never have passed.
      - name: Pin setuptools, the way voiceprint/factory.py tells the user to
        run: uv pip install "setuptools<81"

      - name: And now resemblyzer must import
        run: uv run --no-sync python -c "from resemblyzer import VoiceEncoder; print('resemblyzer ok')"

      - name: Run the backend tests again, on the remedy
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest -v -rs \
            --junit-xml=remedy.xml tests/test_shipped_backends.py

      # Two runs rather than one, because a single environment cannot exercise this
      # file. `test_real_resemblyzer_returns_a_unit_vector_at_both_lengths` skips
      # unless resemblyzer imports; `test_a_resemblyzer_that_cannot_import_names_the_
      # remedy_and_stays_dormant` skips unless it does *not*. They are exact opposites
      # by construction, so "no test may be skipped" was a gate no run could satisfy --
      # unnoticed for three releases because the job died two steps before reaching it.
      #
      # The satisfiable form of the same intent: every test must run in at least one of
      # the two environments. That lives in a script rather than in shell here, so it
      # can be tested on a laptop instead of once a week on a runner
      # (`tests/test_extras_coverage_check.py`) -- and because the shell version read
      # pytest's terminal output with `awk '$2 == "SKIPPED"'` and silently dropped the
      # four tests whose parametrised ids contain spaces, counting 32 of 36 and
      # reporting success. The JUnit report carries the id in an attribute.
      - name: No test may be skipped in BOTH environments
        run: uv run --no-sync python scripts/check_extras_coverage.py shipped.xml remedy.xml
