name: CLA Assistant

# YazSes stays Apache-2.0. This exists so copyright remains consolidated with one
# party, keeping future licensing decisions possible without tracing every past
# contributor. See CLA.md.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Bots cannot agree to a CLA, and their commits carry no copyright a human
    # could assign. Skip them at the job level rather than relying on the
    # action's `allowlist`, which matches `bot*` as a prefix and so never
    # matched the `dependabot[bot]` suffix — on NovaFabric that took the check
    # red on all nine open Dependabot pull requests.
    #
    # issue_comment carries no pull_request payload, so it is admitted here and
    # filtered by the step condition below.
    if: github.event_name == 'issue_comment' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/MSKazemi/yazses/blob/main/CLA.md'
          # Signatures live on a dedicated branch so they never clutter main.
          branch: 'cla-signatures'
          path-to-signatures: 'signatures/version1/cla.json'
          custom-notsigned-prcomment: |
            Thanks for the pull request — it is welcome, and nothing about it is blocked on code review.

            YazSes is Apache-2.0 and stays that way. The [CLA](https://github.com/MSKazemi/yazses/blob/main/CLA.md) keeps copyright consolidated with one party so future licensing decisions stay possible without tracing every past contributor. **You keep the copyright in your work.**

            To sign, comment exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. Thank you!'
          # Second layer behind the job-level bot filter above. The trailing-star
          # forms are the ones this action actually supports.
          allowlist: MSKazemi,dependabot[bot],github-actions[bot],dependabot*,renovate*
          # Default is true, which locks a contributor's pull request once it
          # merges — no follow-up questions, no "how do I use this now".
          lock-pullrequest-aftermerge: false
