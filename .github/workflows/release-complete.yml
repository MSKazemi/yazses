name: Release completeness

# Why this exists
# ---------------
# A tag is supposed to produce a package for every supported OS. Nothing checked
# that it did, and on 2026-08-13 v2.18.1 proved what that costs.
#
# Its `Release` workflow failed in the test job, so `release-linux` and
# `publish-pypi` were both SKIPPED. But build-macos and build-windows are
# separate workflows: they succeeded, created the GitHub Release themselves and
# attached their own artifacts. The result was published as an ordinary release
# and sat as "Latest" carrying:
#
#   .exe  yes        .dmg  yes        .deb  NO        PyPI  NO (404)
#
# Linux users following the documented `pipx install yazses` silently got the
# previous version, and there was no .deb at all. Nothing anywhere said so --
# every individual workflow had done its own job correctly.
#
# This gate exists so that cannot happen quietly again. It does not build
# anything; it verifies that everything else did, and makes an incomplete
# release loud and un-recommended instead of silent and "Latest".
#
# Trigger is the TAG PUSH, not `release: published` -- a Release created by a
# workflow using GITHUB_TOKEN never raises an event that starts another workflow
# run. See checksums.yml for the same reasoning.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (e.g. v2.19.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # may demote an incomplete release to pre-release
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout: this job only inspects published artifacts. Without a
      # checkout `gh` cannot infer the repository, so state it explicitly.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Needed for scripts/check-release-channels.py. GH_REPO above is still set
      # explicitly rather than relying on the checkout's remote -- the two are
      # independent, and an inferred repo is how the checksum job silently
      # queried nothing for forty minutes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check gh can reach the repository
        run: |
          set -euo pipefail
          gh repo view --json name -q .name

      - name: Wait for every platform to publish
        # Deliberately generous: the Windows build is the long pole and PyPI
        # needs a moment to become queryable. Waiting costs nothing; declaring a
        # release complete before its slowest platform finishes costs the point
        # of the check.
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          deadline=$(( SECONDS + 3000 ))   # 50 minutes

          while (( SECONDS < deadline )); do
            if ! names=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); then
              echo "release $TAG does not exist yet (${SECONDS}s)"
              sleep 60
              continue
            fi
            deb=$(grep -c '\.deb$' <<<"$names" || true)
            dmg=$(grep -c '\.dmg$' <<<"$names" || true)
            exe=$(grep -c '\.exe$' <<<"$names" || true)
            pypi=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/yazses/$VERSION/json")
            echo "deb=$deb dmg=$dmg exe=$exe pypi=$pypi (${SECONDS}s)"
            if (( deb > 0 && dmg > 0 && exe > 0 )) && [[ "$pypi" == "200" ]]; then
              echo "All platforms published."
              break
            fi
            sleep 60
          done

      - name: Report every channel, and fail if any lacks this version
        # Owner policy, 2026-08-13: maximum coverage -- every channel is checked,
        # not just the ones CI builds. Some (winget, Chocolatey, Flathub, nixpkgs)
        # are not published yet, so this step will fail until they are. That is
        # the intent: a standing, itemised statement of what is still missing,
        # rather than a green tick that only ever covered four of fourteen.
        run: |
          set -euo pipefail
          python3 scripts/check-release-channels.py --version "$VERSION" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Demote an incomplete release so it is not advertised as Latest
        # Runs only when the check above failed.
        #
        # ONLY the current latest release is demoted. Policy (owner, 2026-08-13):
        # the newest version must carry every OS package; older ones need not.
        # A superseded release being incomplete is history, not a live problem --
        # nobody is directed to it, and rewriting old releases would misrepresent
        # what was actually published at the time. But a half-published release
        # that still reads "Latest" sends people to a download that does not
        # exist for their OS, and that is worth demoting.
        #
        # This matters most for workflow_dispatch: running the check over an old
        # tag should report, never rewrite.
        #
        # Reverse with: gh release edit <tag> --prerelease=false --latest
        if: failure()
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release exists for $TAG -- nothing to demote."
            exit 0
          fi
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          if [[ "$TAG" != "$latest" ]]; then
            echo "::warning::$TAG is incomplete but is superseded by ${latest:-unknown} -- reporting only, not demoting."
            exit 0
          fi
          # Demote only when a CHANNEL CI CONTROLS is missing, i.e. the release is
          # actually broken for somebody on that OS. An unpublished Flathub or
          # nixpkgs entry is a gap in reach, not a broken download -- failing the
          # build says so loudly enough without relabelling a release that works.
          if python3 scripts/check-release-channels.py --version "$VERSION" --core-only >/dev/null; then
            echo "::warning::$TAG is missing some distribution channels, but every artifact CI builds is present -- not demoting."
            exit 0
          fi
          gh release edit "$TAG" --prerelease
          echo "::warning::$TAG marked pre-release -- an artifact CI builds is missing."
