name: OpenSSF Scorecard

# Scores this repository against the OpenSSF's supply-chain security checks
# (pinned dependencies, branch protection, token permissions, signed releases,
# dangerous workflow patterns, …) and publishes the results to the Security tab.
#
# Why a dictation tool cares: YazSes asks users to trust it with everything they
# say. "Trust us" is not a security model; a public, independently-computed score
# and a Security tab anyone can read is closer to one.
on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to code scanning
      id-token: write          # publish results so the badge can be generated
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the public OpenSSF API so the README badge and
          # deps.dev can read it. Nothing about the code or its users is sent —
          # only the same checks anyone could run against this public repo.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
