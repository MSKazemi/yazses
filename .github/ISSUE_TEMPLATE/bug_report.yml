name: 🐞 Bug report
description: Something isn't working — a crash, wrong behaviour, or a hotkey/dictation problem.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The fastest way to a fix is the output of
        `yazses doctor` plus the exact steps you took. Please don't paste transcribed audio you'd
        rather keep private — YazSes is offline by design and we don't need it.

        **Couldn't get it installed or running at all?** File it anyway — only the first, the
        OS, and how you tried to install are required, and "it failed here" is one of the most
        useful reports we get. Don't let a blank field stop you.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: I held the hotkey and spoke, but nothing was typed…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. yazses start
        2. Focus a text field
        3. Hold right_ctrl, say "hello world", release
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Output of `yazses doctor`
      description: >
        Paste the full output — it resolves most reports on its own. **If YazSes will not
        install or will not start, leave this empty** and paste the error you got instead;
        that report is still very much wanted.
      render: text
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (X11)
        - Linux (Wayland)
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YazSes version
      description: Output of `yazses --version`. Leave blank if it never got far enough to run.
    validations:
      required: false
  - type: input
    id: install-method
    attributes:
      label: How did you install it?
      placeholder: install.sh / pipx / APT / from source
    validations:
      required: true
