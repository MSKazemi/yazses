name: 🧪 No-code eye-control test
description: >-
  A small, guided hardware check for people who do not need to write code.
  Run one scripted test on one computer and report what happened.
title: "[eye-test]: "
labels: ["accessibility", "measurement-wanted", "hardware-required"]
body:
  - type: markdown
    attributes:
      value: |
        **You do not need to be a developer.** One computer + one short test is useful.

        **Use this form only for a validation slot that is currently marked READY and has the
        `help wanted` label.** A visible PLANNED slot is not yet runnable; do not invent manual
        steps or a private data format.

        This public issue is always **community engineering QA (`community_qa`)**, not a research
        participant submission or research consent. Do not upload
        a face photo/video, raw webcam frame, private dictated text, diagnosis, email,
        device serial number, access token, or sensitive screenshot.

        If a future paper needs human-participant data, that will use a separate
        research protocol and consent process.

  - type: checkboxes
    id: public_ack
    attributes:
      label: Before you start
      options:
        - label: I understand this issue is public and I will not post sensitive/private data
          required: true
        - label: I can stop the test at any time if the pointer/camera control is uncomfortable
          required: true

  - type: input
    id: ready_issue
    attributes:
      label: READY validation issue
      description: >-
        Enter the issue number for the READY slot/test that asked you to use this form.
        The issue must currently have the help-wanted label.
      placeholder: "#428"
    validations:
      required: true

  - type: checkboxes
    id: readiness_ack
    attributes:
      label: Readiness acknowledgement
      options:
        - label: I checked that the linked validation issue is marked READY / help wanted
          required: true

  - type: dropdown
    id: research_contact
    attributes:
      label: Optional future research contact preference
      description: >-
        This does not change this public report from community QA into research data.
        Any future research participation requires a separate protocol and consent process.
      options:
        - "QA only — do not contact me about research through this issue"
        - "I am willing to be contacted separately about a future research study"
    validations:
      required: true

  - type: dropdown
    id: test
    attributes:
      label: Which small test are you doing?
      options:
        - "T0 — camera lifecycle / permission / stop / release"
        - "T1 — coarse four-target gaze"
        - "T2 — Head-Pointer large-target task"
        - "T3 — face-switch deliberate / neutral / speaking blocks"
        - "T4 — pause / kill / tracking-loss / recovery safety"
        - "T5 — HiDPI / multi-monitor topology"
        - "T6 — semantic grounding correct / wrong / ambiguous / abstain"
        - "T7 — hands-free scripted workflow"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: YazSes version or commit
      placeholder: "v2.x.y or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: os_family
    attributes:
      label: Operating system
      options:
        - "Windows 11"
        - "macOS"
        - "Ubuntu / GNOME Wayland"
        - "KDE Plasma Wayland"
        - "Linux X11"
        - "Other Linux"
        - "Other"
    validations:
      required: true

  - type: input
    id: os_detail
    attributes:
      label: OS / desktop version
      placeholder: "Ubuntu 26.04 GNOME; Windows 11 24H2; macOS 27"
    validations:
      required: true

  - type: input
    id: computer
    attributes:
      label: Computer (broad model is enough)
      placeholder: "ThinkPad T14 Gen 4; MacBook Air M3; desktop AMD Ryzen"
    validations:
      required: true

  - type: input
    id: camera
    attributes:
      label: Camera
      placeholder: "Built-in webcam; Logitech C920"
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: Display setup
      placeholder: "1 monitor 1920x1080 @ 100%; 2 monitors, external at 150%"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - "PASS — the scripted steps worked"
        - "PARTIAL — some steps worked"
        - "FAIL — reproducible problem"
        - "BLOCKED — I could not start because of dependency/permission/hardware"
    validations:
      required: true

  - type: textarea
    id: counts
    attributes:
      label: Simple counts / measurements
      description: >-
        Copy the numbers the test script asks for. If none were produced, say "none".
      placeholder: |
        Example:
        attempts: 40
        correct: 35
        wrong: 2
        fallback: 3
        OR
        test duration: 15 minutes
        false activations: 1
    validations:
      required: true

  - type: textarea
    id: failure
    attributes:
      label: What went wrong or what was easy?
      description: Plain language is better than technical guessing.
      placeholder: "After I turned my head left, the pointer stopped for about two seconds..."
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety / privacy checks
      options:
        - label: I was able to pause/stop the control
        - label: Losing the camera did not keep repeating the last action
        - label: I did not see YazSes save webcam images/video
        - label: Disabling the feature released/stopped camera use

  - type: textarea
    id: notes
    attributes:
      label: Optional notes
      description: >-
        Do not include personal contact information or sensitive screen/text content.
