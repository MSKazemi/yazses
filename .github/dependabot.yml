# Dependabot version updates.
#
# ⚠ An `ignore` entry below silences a **security** pull request too, not only a
# routine bump. This file used to claim the opposite — "security updates are enabled
# separately in repo settings and are NOT limited by this file" — which is wrong, and
# wrong in the direction that hides a vulnerability rather than one that adds noise.
# GitHub's own reference is unambiguous: you can configure Dependabot to ignore
# dependencies "when it opens pull requests for version updates **and security
# updates**". Only `update-types` is exempt; `versions:` is not.
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/controlling-dependencies-updated
#
# So every `ignore` here is a decision to go without a fix for the range it names, and
# it has to be worth that. Add one only when the bump genuinely cannot be taken, scope
# it to the versions that cannot be taken, and say why beside it.
#
# Deliberately conservative: monthly, grouped, and capped, because an OSS project
# with a small maintainer pool is hurt more by PR noise than by being a few weeks
# behind on a patch release. The project rule "always use latest stable versions"
# (see AGENTS.md) is served by the grouped monthly sweep.
version: 2
updates:
  # Python — uv is the project's package manager (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # ⚠ There is deliberately NO `ignore:` key on this ecosystem any more, and
    # removing it was a security fix rather than housekeeping.
    #
    # ⚠ There is deliberately NO setuptools entry here any more, and removing it was
      # a security fix rather than housekeeping.
      #
      # The old rule ignored `setuptools >= 81` because the `voiceprint-resemblyzer`
      # extra pinned `setuptools<81` for `pkg_resources`, and it justified suppressing
      # the *security* PR with: "The exposure is bounded to `voiceprint-resemblyzer`,
      # which is opt-in, excluded from `[all]`."
      #
      # That was false. `uv.lock` is a universal resolution — one version per package
      # for the whole workspace — so a pin inside an opt-in extra is not confined to
      # it. `uv export --no-dev`, with no extras at all, emitted `setuptools==80.10.2`,
      # because core `ctranslate2` requires setuptools and there was one entry to
      # satisfy. `scripts/build-macos.sh` and `scripts/build-windows.ps1` build the
      # shipped .dmg and .exe from that lock, so it went out in release artifacts too.
      # The reasoning had been copied into three files and checked by a test that read
      # the *declaration* rather than the resolution, so nothing could catch it.
      #
      # The pin is gone, the lock resolves 84.0.0, and
      # `tests/test_dependency_advisories.py::
      # test_the_resolved_setuptools_is_at_or_above_the_patched_release` now asserts
      # the resolved version. An `ignore` here would silence the next one.
      # ⚠ `onnxruntime` is deliberately NOT ignored (#322). The monthly `uv` job used
      # to fail on it every single run; it should now be green, and if it is red again
      # the fix is still not an ignore rule. Read on before reaching for one.
      #
      # What actually happened, and it is not what this comment used to say. The old
      # text blamed an unmarked global pin — "Dependabot checks a bump by pinning the
      # target version for the whole resolution … that pin has no environment marker"
      # — and concluded the failure "goes away only when the cap is gone", i.e. only by
      # dropping Intel macOS support. Both halves were wrong, and the error message was
      # already saying so: uv named the offending requirement as
      # `onnxruntime{platform_machine == 'x86_64' and sys_platform == 'darwin'}==1.29.0`.
      # A global pin has no `{…}` marker on it. Dependabot was rewriting the *marked
      # `[project]` declaration*, because pyproject.toml stated the Intel range twice —
      # once in `[tool.uv] constraint-dependencies` and once as a second
      # `onnxruntime>=1.23.2,<1.24; darwin+x86_64` requirement beside each `>=1.27`
      # floor. Dependabot rewrites `[project]` requirements and never touches
      # `[tool.uv]`, so a bump turned the duplicate into `>=1.29.0` sitting next to the
      # table's `<1.24`.
      #
      # So the range is now stated once, in the table Dependabot cannot rewrite, and
      # the `[project]` requirement for that platform carries no specifier at all —
      # which its uv handler treats as non-updatable and returns unchanged
      # (dependabot/dependabot-core#12273). Reproduced locally end to end: rewriting
      # every `[project]` floor to `>=1.29.0`, exactly as a bump does, resolved 287
      # packages with Intel macOS still on 1.23.2 and everything else on 1.29.0.
      # Nothing was given up — no ignore, no dropped platform, no hand-bumping — and
      # `tests/test_dependabot_ignores_are_honest.py::
      # test_no_platform_version_range_is_stated_in_both_places` fails the build if the
      # duplicate range comes back.
      #
      # For the record, since the old note's conclusion was a support decision: a fresh
      # Intel resolution of `yazses[all]` still succeeds on Python 3.11 and 3.12
      # (onnxruntime 1.23.2, torch 2.2.2) and already fails on 3.13+ for an unrelated
      # reason — torch ships no Intel macOS wheel. That decision is still open, and it
      # is no longer forced by this.
      #
      # Ignoring `onnxruntime >= 1.24` would stop every onnxruntime update — including
      # a security one, per the note at the top of this file — on Linux, Windows and
      # Apple silicon, which is where the users are. It would now also be buying
      # nothing.

  # GitHub Actions — pinned action versions go stale silently and are a real
  # supply-chain surface for a project that publishes signed artifacts.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]

  # Android (Gradle) — uncomment when android/ has a real Gradle build (issue #84).
  # - package-ecosystem: "gradle"
  #   directory: "/android"
  #   schedule:
  #     interval: "monthly"
  #   open-pull-requests-limit: 5
  #   labels: ["dependencies", "android"]
