title: YazSes
description: >-
  Offline, on-device voice dictation for Linux, macOS & Windows. Hold a key,
  speak, release — your words are typed into any focused app. No cloud, no
  API key, no subscription.
theme: jekyll-theme-cayman
show_downloads: false

# Canonical site location (GitHub Pages) — drives absolute URLs in the sitemap
# and SEO tags. Keep in sync with the Pages settings for MSKazemi/yazses.
url: "https://mskazemi.github.io"
baseurl: "/yazses"

# jekyll-sitemap auto-generates /sitemap.xml (allowlisted on GitHub Pages) with
# no layout change required. jekyll-seo-tag (canonical/OpenGraph) is deferred: it
# needs {% seo %} in the layout, which the cayman theme gem does not include, and
# a custom layout override should be verified with a local Pages build first.
plugins:
  - jekyll-sitemap

# Keep large binaries out of the generated site + sitemap.
exclude:
  - "*.pdf"
