<title id="system-map-t">YazSes subsystem map</title>
<desc id="system-map-d">Six bands. A control plane of CLI, settings window and tray talks over JSON-RPC to an IPC server, which drives the yazses-daemon orchestrator. Inside the daemon six pipeline stages run in order: hotkey, audio, speech, post-processing, command classification, dispatch. Dispatch delivers typed text, a key sequence, or text forwarded over SSH to another host. A support band holds the platform protocols, the self-repairing config, the 147-capability registry, and the opt-in encrypted learning corpus. A final band shows four subsystems that are designed and deliberately not built: the Android keyboard, cloud escalation, personal speech adapters, and code-switch models.</desc>
