<title id="direction-triage-t">How a YazSes idea is triaged into buildable, measurable or deferred work</title>
<desc id="direction-triage-d">A flowchart with three gates in series. An idea first has to name the problem it answers from the problem space; if it cannot, it is not built. It then has to run offline on an ordinary laptop CPU; if it cannot, it is filed as needing hardware or a lab. Finally it has to have a way of telling whether it worked; if it does, it is built now, and if it does not, it is a study rather than a feature.</desc>
