<title id="states-t">The daemon state machine</title>
<desc id="states-d">A spine of five states carries ordinary dictation: LOADING to IDLE once the model is loaded, IDLE to RECORDING when the key is held, RECORDING to TRANSCRIBING when it is released, TRANSCRIBING to INJECTING when text is ready, and INJECTING back to IDLE. Two early exits return to IDLE: from RECORDING when the audio was silent, and from TRANSCRIBING when there was nothing to type. Four further modes hang off IDLE and are entered over IPC rather than by the hotkey: MEETING, REMOTE_SETUP into REMOTE_ACTIVE, ENROLLING and READBACK; each returns to IDLE. Two more states exist in the type but are not entered by the daemon: ERROR is set by the tray when the daemon stops answering, and nothing currently sets PAUSED.</desc>
