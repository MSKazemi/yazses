# Add-on pack decisions, one per pyproject extra (ADR-028 §7).
#
# Read by scripts/build-packs.py, which builds one `.yazpack` per `decision = "pack"`
# entry on the Windows release runner, from the same uv.lock and interpreter as the
# frozen base. tests/test_build_packs.py holds this file to `pyproject.toml` (every
# extra has exactly one entry) and to `system/features.py::_FEATURE_DEPS` (every wired,
# dependency-carrying feature is served by a declared pack or by an extra whose
# decision says why not). A new extra therefore cannot silently be missing a decision.
#
# Decisions:
#   pack              build it; `features` and `entry_modules` are required
#   bundled           inside the frozen base: scripts/build-windows.ps1 syncs exactly the
#                     bundled extras (`build-packs.py validate` and the tests hold the two
#                     together), the pack build subtracts their closure from every pack,
#                     and a bundled extra is never packed
#   no-windows-wheel  a distribution in its closure is sdist-only in uv.lock
#   unwired           every feature that would consume it is in features.py::_UNWIRED
#   deferred          a later phase or an owner decision; `reason` says which
#
# Every non-pack entry needs a `reason`. A pack over 500 MiB needs `approved_large = true`
# and `approved_by = "<owner name>"`.
#
# `bind_to_base` (packs only) is the reviewed allow-list of DLL basenames for which the
# pack's own, different copy is dropped and the pack runs on the base's copy instead.
# It needs `bind_reason`. Every other DLL basename the base also ships with different
# bytes still withholds the pack; a byte-identical copy is dropped as before. pack.json
# records the bound names (`bind_to_base`), and the runtime loads the base's copy of
# each before it imports the pack's entry modules.
#
# Owner answers (ADR-028, "Owner questions: answered 2026-10-21"):
#   Q1  `parakeet` (onnx-asr, MIT, ~4 MB) and `chinese` (opencc, Apache-2.0, ~0.5 MB)
#       are bundled into the frozen Windows base; the PyPI base is unchanged. Phase 1
#       therefore builds one pack, `diarization`, the one with native code.
#   Q2  no torch packs: `voiceprint` stays PyPI-only.
#   Q7  the licence gate runs at build time (permissive and LGPL pass; GPL needs a
#       recorded owner approval and a SOURCE.md; an unknown licence fails).

format = 1

[extras.diarization]
decision = "pack"
features = ["diarize", "recimport", "meeting"]
entry_modules = ["sherpa_onnx"]
# sherpa-onnx-core 1.13.8's win_amd64 wheel carries its own onnxruntime.dll (an
# unsigned 1.28.2 build; a second copy sits under its .data/data/Scripts/). The base
# ships Microsoft's signed onnxruntime 1.28.0. Without this line the pack is withheld.
bind_to_base = ["onnxruntime.dll"]
bind_reason = """ADR-028 finding (2026-10-21, lock-hash-verified wheel): sherpa's copy \
differs from the base's but is the same 1.28 line. The pack drops every copy and binds \
to the base's; packs-spike.yml probe (d) must show sherpa_onnx loading the base's DLL and \
building a session, or diarization takes ADR-028 §1's out-of-process route."""

[extras.parakeet]
decision = "bundled"
reason = """ADR-028 Q1 (answered 2026-10-21): onnx-asr is MIT, pure Python, ~4 MB, and its \
[cpu,hub] dependencies are already in the base; build-windows.ps1 syncs --extra \
parakeet. The ~660 MB model downloads on first use either way."""

[extras.chinese]
decision = "bundled"
reason = """ADR-028 Q1 (answered 2026-10-21): opencc-python-reimplemented is Apache-2.0, \
pure Python, ~0.5 MB; build-windows.ps1 syncs --extra chinese."""

[extras.desktop]
decision = "bundled"
reason = "Synced into the frozen base by scripts/build-windows.ps1 (`--extra desktop`)."

[extras.overlay]
decision = "bundled"
reason = "Alias of `desktop`; PySide6 is already in the frozen base."

[extras.prosody]
decision = "deferred"
reason = """Phase 2. ADR-028 Q7: praat-parselmouth is GPL, so the pack needs a recorded \
owner approval and a SOURCE.md before the licence gate lets it through."""

[extras.tts]
decision = "deferred"
reason = """Phase 2. ADR-028 Q7: espeak-ng and phonemizer are GPL (recorded owner approval \
plus SOURCE.md), and espeakng-loader declares no licence, which the gate fails."""

[extras.denoise]
decision = "deferred"
reason = "Phase 2 (spec: feature-addon-packs.md)."

[extras.gaze]
decision = "deferred"
reason = "Phase 2 (spec: feature-addon-packs.md); needs the native_dirs path proven first."

[extras.moonshine]
decision = "deferred"
reason = "Phase 2 (spec: feature-addon-packs.md)."

[extras.voiceprint]
decision = "deferred"
reason = """ADR-028 Q2 (answered 2026-10-21): no torch packs; voiceprint stays PyPI-only \
(torch's libiomp5md.dll differs from ctranslate2's: OMP Error #15). The route forward \
is an ONNX speaker-embedding backend riding on the diarization pack."""

[extras.slm]
decision = "no-windows-wheel"
reason = "llama-cpp-python is sdist-only in uv.lock."

[extras.notes]
decision = "no-windows-wheel"
reason = "llama-cpp-python is sdist-only in uv.lock."

[extras.voiceprint-resemblyzer]
decision = "no-windows-wheel"
reason = "webrtcvad is sdist-only in uv.lock."

[extras.agent]
decision = "unwired"
reason = "Its only feature, `agent`, is in features.py::_UNWIRED."

[extras.diarization-pyannote]
decision = "deferred"
reason = "No feature in _FEATURE_DEPS installs it (a backend choice behind config); torch."

[extras.silero]
decision = "deferred"
reason = "No feature in _FEATURE_DEPS installs it (a backend choice behind config)."

[extras.lsp]
decision = "deferred"
reason = "No feature in _FEATURE_DEPS installs it (an editor integration, not a toggle)."

[extras.emg]
decision = "deferred"
reason = "No feature in _FEATURE_DEPS installs it (hardware input behind config)."

[extras.emg-band]
decision = "deferred"
reason = "No feature in _FEATURE_DEPS installs it (hardware input behind config)."

[extras.ble]
decision = "deferred"
reason = "No feature in _FEATURE_DEPS installs it (hardware input behind config)."

[extras.all]
decision = "deferred"
reason = "Aggregate of every extra; never a pack."
