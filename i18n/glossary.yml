# Terminology for translating YazSes.
#
# Consistency matters less than being understood. Where a term has a widely used form in
# your language, use it; where it does not, keeping the English is better than inventing a
# calque nobody will recognise. A translator who reads this and disagrees for their own
# language is probably right — say so in the PR and change it.
#
# Schema per term:
#   meaning:  what it means here, so it can be translated rather than transliterated
#   note:     the trap, if there is one
#   keep_english: true when translating it usually makes things worse
#
# Validated by tests/test_campaign.py.

protected:
  # Never translated. A "translated" command does not run.
  description: >-
    Commands, config keys, paths, code blocks and the project name are copied verbatim
    into every language. Translating one produces instructions that silently fail.
  examples:
    - "yazses start"
    - "yazses doctor"
    - "yazses mic-level --set"
    - "[stt] model"
    - "vad_threshold"
    - "~/.config/yazses/config.toml"
    - "YazSes"

terms:
  hold-to-talk:
    meaning: >-
      Hold a key down, speak, release. The key is held for the whole utterance — it is not
      a toggle and not a wake word.
    note: >-
      The contrast with "push-to-talk" in games is useful in most languages. If your
      language has a gaming term for this, it is probably the right one.

  offline:
    meaning: Runs entirely on the user's own machine; no audio or text is sent anywhere.
    note: >-
      Translate as "on your own device", not as "not connected to the internet". YazSes
      works fine online — the point is that nothing leaves the machine. Claims policy:
      always render this as offline **by default**, never as an absolute guarantee.

  speech-to-text:
    meaning: Turning recorded speech into written text.
    note: Most languages have an established term. Prefer it over the English acronym STT.

  dictation:
    meaning: Speaking so that text appears where you would have typed it.
    note: >-
      Distinct from "voice commands" — dictation types what you said, a command performs
      an action. Keep the two distinct in your language; the product does.

  injection:
    meaning: How YazSes puts text into another application's window.
    keep_english: false
    note: >-
      A literal medical/technical "injection" is wrong in many languages. Prefer wording
      like "inserting text into the focused window".

  focused app:
    meaning: The window that currently receives keystrokes.
    note: Whatever your OS localisation calls the active/foreground window.

  silence gate:
    meaning: >-
      The threshold below which audio is treated as silence and discarded, so background
      noise is not transcribed.
    note: Config key is `vad_threshold` and stays untranslated.

  diarization:
    meaning: Working out which speaker said which part of a recording.
    keep_english: false
    note: >-
      A rare word in English too. "Speaker labelling" or "who spoke when" is clearer in
      most languages than a transliteration.

  pull request:
    meaning: A proposed change submitted for review.
    keep_english: true
    note: >-
      GitHub's own UI is English for most users, so a translated term makes the
      instructions harder to follow, not easier. Same for "commit", "merge" and "fork".

  sign-off:
    meaning: >-
      The `Signed-off-by` line certifying you wrote the change and may submit it (DCO).
    keep_english: true
    note: >-
      The literal line is generated by `git commit -s` and must never be translated. Take
      extra care here — this is a legal statement, and a translation that changes its
      meaning is worse than leaving it in English.

  contributor wall:
    meaning: The table of contributor avatars in the README.
    note: Generated markup — copy the block verbatim, never retype or translate it.
