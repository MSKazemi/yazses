# examples/config.sublime-text.toml
# A YazSes setup for dictating into Sublime Text.
#
# Verified: an injected string arrived byte for byte in both the buffer and the
# saved file, including `--namespace`. Tested by driving the real xdotool
# injector against a live Sublime window on an isolated X display — not by
# dictating aloud, so the speech half is unverified. Method:
# scripts/appprobe/README.md.
#
# Copy to ~/.config/yazses/config.toml and edit as needed.

[stt]
model = "base.en"          # base.en balances accuracy and speed for code + prose
device = "cpu"
compute_type = "int8"

[hotkey]
key = "right_ctrl"         # Sublime binds ctrl+<letter>, never bare right_ctrl
hold_threshold_ms = 400

[audio]
sample_rate = 16000
max_record_seconds = 60

[injection]
backend = "type"           # typing lands in the buffer; verified
fallback_to_clipboard = true

[commands]
voice_punctuation = false  # off: "period" and "comma" are ordinary words in code comments

[general]
log_level = "INFO"

# Sublime's auto-complete popup takes Enter and Tab while it is open. That is not
# a YazSes problem and no setting here changes it — but if a dictated line ends up
# completed into something you did not say, that popup is why. Escape dismisses it.
