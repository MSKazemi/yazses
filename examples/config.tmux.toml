# examples/config.tmux.toml
# A YazSes setup for dictating into tmux.
#
# Verified: an injected string arrived byte for byte, including `--namespace`,
# `&&` and `src/main.py`. Tested by driving the real xdotool injector against a
# live tmux window on an isolated X display — not by dictating aloud, so the
# speech half is unverified. See the pull request for the method.
#
# Copy to ~/.config/yazses/config.toml and edit as needed.

# tmux runs inside another terminal, so the config that matters is the HOST
# terminal's — this file is the same as the terminal one. What tmux adds is the
# prefix key: keep the YazSes hotkey off ctrl+b, or holding it will be swallowed
# by tmux before YazSes ever sees it.

[stt]
model = "base.en"          # base.en balances accuracy and speed for commands + prose
device = "cpu"
compute_type = "int8"

[hotkey]
key = "right_ctrl"         # right_ctrl cannot collide with tmux's ctrl+b prefix
hold_threshold_ms = 400

[audio]
sample_rate = 16000
channels = 1
max_record_seconds = 60

[injection]
backend = "type"       # typing reaches the pane; a paste would go to the host terminal
fallback_to_clipboard = true

[commands]
voice_punctuation = true   # say "new line" to submit a command without reaching for Enter

[general]
log_level = "INFO"
